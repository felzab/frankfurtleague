server {
    listen 80;
    listen [::]:80;


    server_tokens off; # Target localhost for local testing
    server_name localhost 127.0.0.1; # Hide Nginx version number


    # Payload & Buffer optimization
    client_max_body_size 20M;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # COMPRESSION
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    # SECURITY
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # Global Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    # Passthrough for Auth.js
    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
    }

    # Next.js Static Assets -> Bypass application logs, max out browser cache
    # Nginx serves assets directly from disk. Bypasses Node.js entirely.
    location /_next/static/ {
        alias /app/.next/static/;
        access_log off;
        expires max;

        add_header Cache-Control "public, max-age=31536000, immutable";
        # Necessary to copy all the headers here again
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;
    }

    # Frontend Main
    location / {
        proxy_pass http://frontend:3000;

        # WebSocket Support for Next.js Turbo/HMR (if needed) or general socket logic
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
