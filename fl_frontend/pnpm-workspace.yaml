allowBuilds:
  # Refused: testcontainers reaches its container engine over the local socket, never SSH, so ssh2's
  # optional native binding and the cpu-features probe it builds with serve nothing, and protobufjs's
  # script only prints a version notice.
  cpu-features: false
  protobufjs: false
  # Its native code comes from the prebuilt @img packages the lockfile pins; pnpm lists it only for
  # the source build its binding.gyp offers, which nothing here needs.
  sharp: false
  ssh2: false
  # Its script only finds the binding the lockfile already pins; refused, a missing binding fails
  # loudly instead of being fetched with no integrity check.
  unrs-resolver: false
overrides:
  # Each pins past an advisory in the version next would otherwise pull. Only sharp is
  # runtime-reachable, via libvips on /_next/image.
  sharp: "^0.35.4"
  postcss: "^8.5.26"
# A version published with weaker trust evidence than its package's earlier ones (a trusted CI
# publisher replaced by a bare token) fails resolution: the shape of a hijacked maintainer account.
trustPolicy: no-downgrade
# Each is an older line's backport its long-standing maintainer published by hand while the current
# line publishes from CI: read in the registry's publish history before excepting it, never after.
trustPolicyExclude:
  - eslint-import-resolver-typescript@3.10.1
  - semver@6.3.1
# Not the default `install`, under which a `pnpm run` over a drifted manifest rewrites pnpm-lock.yaml,
# so a check writes the tree and races the gate's lockfile step. `pnpm install` is the one writer.
verifyDepsBeforeRun: error
# A peer outside its range fails the install rather than warning: an app dependency that is also
# HeroUI's peer is HeroUI's one copy, and a HeroUI upgrade raising its range would otherwise
# install past the app's range unseen.
strictPeerDependencies: true
patchedDependencies:
  # Aborts on the server a transaction whose commit failed, saying so where that abort fails, and
  # lets the commit's own error through where the driver's refusal of the adapter's abort replaced
  # it (`docs/frontend/spec.md :: I537`); no adapter release does either.
  "@better-auth/mongo-adapter@1.7.7": patches/@better-auth__mongo-adapter@1.7.7.patch
  # Every registration runs in the transaction `fl_frontend/src/core/auth.ts :: claimAccount` needs,
  # where upstream opens one only around a registration that signs in.
  "@better-auth/passkey@1.7.7": patches/@better-auth__passkey@1.7.7.patch
