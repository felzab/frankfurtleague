# OPS · end-to-end stack
#
# The local stack again, as a stack of its own for the Playwright journeys
# (`fl_frontend/playwright.config.ts`): its own compose project, database volume, sign-in store,
# keys, settings and made-up data, sharing nothing with the developer's local stack but the two host
# ports, 3000 and 27017, which is why only one of the two runs at a time. Started by
# `./scripts/ops/local.sh --e2e` on a development machine and by the journeys' CI job on Linux.
#
# Invariants:
# - An override merged over docker-compose.yml and docker-compose.local.yml, in that order, never a
#   stack on its own: everything this file does not write is the local stack's, so every key below IS
#   a difference from it (https://docs.docker.com/reference/compose-file/merge/).
# - Paths resolve against docker-compose.yml's directory, as the local file's do.
# - Nothing here is a credential. The keys are files a start generates under `.tmp-e2e/`, which
#   `.gitignore` covers, fresh on every start and generated rather than copied, so no machine's own
#   keys ever reach this stack.

# A project name of its own, so its containers, its volume and its networks are never the local
# stack's, whichever checkout either runs from.
name: frankfurtleague-e2e

services:
  frontend:
    # Named here, where the local file leaves the built image unnamed, so the journeys' CI job can
    # tag the image the images job built under the one name `up --no-build` looks for.
    image: frankfurtleague-e2e-frontend
    # The developer's `fl_frontend/.env` stays the local stack's: the one setting it holds that the
    # local file does not override is written here.
    env_file: !reset null
    environment:
      # `fl_backend/app/core/config.py :: API_VERSION`, which the base file's backend healthcheck spells too.
      - API_VERSION=0
    # The mail sink inside `.tmp-e2e/`, so the journeys read this stack's codes and never the local stack's.
    volumes: !override
      - ./.tmp-e2e/mail:/app/.tmp-mail

  backend:
    # Named for the same reason as the frontend's.
    image: frankfurtleague-e2e-backend
    # The start's own file, holding the one setting a start generates: the public half of the actor
    # key pair it generated beside it. Optional, so a stop needs no start before it; a backend booting
    # without it refuses, naming ACTOR_TOKEN_PUBLIC_KEY.
    env_file: !override
      - path: ./.tmp-e2e/backend.env
        required: false
    environment:
      # The frontend reaches the backend by its service name, and each container's healthcheck by loopback.
      - API_TRUSTED_HOSTS=backend,localhost,127.0.0.1
      - API_CORS_ALLOWED_ORIGINS=http://localhost:3000
      # The made-up seed's database (`scripts/ops/seed/seed.js`), on this stack's own server.
      - DB_BASE_NAME=fl_e2e

  mongo:
    # The local stack's volumes without its copy of production: that copy never enters this stack.
    volumes: !override
      - mongo-data:/data/db

  nginx:
    # nginx/e2e in nginx/local's place, which it includes from the path beside it: the local edge,
    # taking each journey's own address from the host's side (`nginx/e2e/e2e.conf`).
    volumes: !override
      - ./nginx/e2e:/etc/nginx/conf.d:ro
      - ./nginx/local:/etc/nginx/local:ro
      - ./nginx/shared:/etc/nginx/shared:ro
      - ./.tmp-e2e/nginx-log:/var/log/frankfurtleague/nginx

# The network the published port forwards the host's requests on, with a subnet and gateway of its
# own rather than the daemon's pick, so `nginx/e2e/e2e.conf` trusts that one gateway by address. It
# sits beside the 172.30.0.0/24 docker-compose.yml gives the connector's network.
networks:
  frankfurtleague-app:
    ipam:
      config:
        - subnet: 172.30.1.0/24
          gateway: 172.30.1.1

# The local stack's six files, each one this stack's start generated.
secrets: !override
  fl_actor_signing_key:
    file: ./.tmp-e2e/secrets/fl_actor_signing_key
  auth_secret:
    file: ./.tmp-e2e/secrets/auth_secret
  sperrliste_schluessel:
    file: ./.tmp-e2e/secrets/sperrliste_schluessel
  internal_api_key_base:
    file: ./.tmp-e2e/secrets/internal_api_key_base
  internal_api_key_system:
    file: ./.tmp-e2e/secrets/internal_api_key_system
  internal_api_key_admin:
    file: ./.tmp-e2e/secrets/internal_api_key_admin
