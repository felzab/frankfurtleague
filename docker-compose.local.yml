# docker-compose.local.yml
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./fl_frontend
      dockerfile: Dockerfile
    env_file: ./fl_frontend/.env
    environment:
      # Has to be redefined here, because the backend is not reachable through localhost, because it's running in the docker compose network
      - API_URL=http://backend:8000
      - AUTH_URL=http://localhost:3000
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./fl_backend
      dockerfile: Dockerfile
    env_file: ./fl_backend/.env
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:8000/api/v0/system/is_live"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  frankfurtleague-net:
    driver: bridge
