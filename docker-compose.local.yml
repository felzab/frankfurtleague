x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./fl_frontend
      dockerfile: Dockerfile
    env_file: ./fl_frontend/.env
    environment:
      - API_URL=http://backend:8000
      - AUTH_URL=http://127.0.0.1
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging

  backend:
    build:
      context: ./fl_backend
      dockerfile: Dockerfile
    env_file: ./fl_backend/.env
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.local.conf:/etc/nginx/conf.d/default.conf:ro  # Local config file nginx.local.conf
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      - frontend
      - backend


networks:
  frankfurtleague-net:
    driver: bridge
