# OPS · local stack
#
# The production images, built from source, behind nginx, with a database of its own; started by
# `./scripts/ops/local.sh` and served on http://localhost:3000. `docs/ops/spec.md` §1.5 states what
# this stack covers that neither `pnpm dev` nor production does.
#
# Invariants:
# - Mirrors docker-compose.yml except where the difference is deliberate: it BUILDS rather than
#   pulls, overrides API_URL, APP_ENV, AUTH_URL, BEWERBUNG_SWEEP, LOG_FORMAT and MONGODB_URI, mounts the
#   mail sink the frontend writes into, runs its own mongo and waits on it, keeps that mongo's data
#   in a named volume, publishes the edge on 3000:80 where production publishes nothing, runs no
#   tunnel connector and so declares neither its ipam subnet nor its token secret, mounts
#   nginx/local.conf and no ./certs, keeps the access log in the checkout where production keeps it
#   under /var/log, and sets no resource limits. A difference beyond those is a difference
#   production will not have caught. This list and
#   `scripts/checks/check_compose_mirror.py :: DECLARED_DELTAS` change together.

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./fl_frontend
      dockerfile: Dockerfile
    env_file: ./fl_frontend/.env
    environment:
      # Overrides whatever .env holds, because inside the compose network the backend is not on
      # localhost -- it is reachable by service name.
      - API_URL=http://backend:8000
      # The stack's own declaration, overriding whatever .env holds -- and .env here is legitimately a
      # copy of production's, which local.sh tells the developer to take from the password manager.
      # Nothing else stops this stack mailing the league's real contact people.
      - APP_ENV=local
      # http:// and localhost specifically: `fl_frontend/src/core/config.ts` refuses a non-loopback
      # http URL, because @auth/core derives the session cookie's Secure flag from this protocol.
      # Loopback is the one exemption.
      - AUTH_URL=http://localhost:3000
      # The point of this stack is the production behaviour, and the developer's .env legitimately
      # holds `console` for `pnpm dev` -- overridden so the stack always writes the production
      # stream (docs/logging/spec.md).
      - LOG_FORMAT=json
      # Auth.js keeps its session store in the same cluster, so leaving this one alone would sign
      # the local stack in against production while every other read came from the container below.
      - MONGODB_URI=mongodb://mongo:27017/?directConnection=true
      # This stack runs the production build, so nothing but this line holds the sweep off. An armed
      # sweep here mails the league's real contact people: the database below can hold a production
      # dump, and .env carries the real AUTH_RESEND_KEY.
      - BEWERBUNG_SWEEP=off
    volumes:
      # `/app` is root-owned and the container runs as `nextjs`, so without this the sink has
      # nowhere to write. In the checkout for the access log's reason below: the developer opens the
      # file rather than copying it out.
      - ./.tmp-mail:/app/.tmp-mail
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # The probe cadence during start_period, so each edit-verify verdict lands a little sooner:
      # measured at 3.2 s against the engine's own 5.2 s default (2026-08-11, engine 29.7.2).
      # Requires Docker Engine 25 or newer.
      start_interval: 3s

  backend:
    build:
      context: ./fl_backend
      dockerfile: Dockerfile
    env_file: ./fl_backend/.env
    environment:
      # Same reason as the frontend's override above: the stack shows the production stream even
      # when the developer's .env selects the console format for `fastapi dev`.
      - LOG_FORMAT=json
      # The whole point of the mongo service: `env_file` carries the production cluster, and
      # compose's `environment` overrides it, so the local stack stops writing to the live database
      # without fl_backend/.env being touched at all.
      - MONGODB_URI=mongodb://mongo:27017/?directConnection=true
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    depends_on:
      # Healthy, not started: the lifespan applies every validator before it yields and refuses the
      # boot if it cannot, so a backend reaching an unelected node fails the whole start.
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/system/is_live', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # Same first-probe reason as the frontend's, and the same engine requirement.
      start_interval: 3s

  # Production declares no database service and must not gain one (`docs/ops/spec.md :: I174`).
  mongo:
    # The tag `fl_backend/tests/conftest.py` starts the db tier against, and the floor the managed
    # cluster runs, so a copy taken from it restores into a server of its own major version.
    image: mongo:8
    # A single-node replica set rather than a standalone: every transactional endpoint runs
    # `session.with_transaction`, and a standalone answers one with `IllegalOperation`.
    command: --replSet rs0 --bind_ip_all
    # Pinned so the `rs.initiate()` below composes a member host the other containers resolve. The
    # default is the container id, which nothing else on this network can reach.
    hostname: mongo
    # Skips the entrypoint's chown and its step down from root, which `cap_drop: ALL` would refuse
    # -- the alternative was handing this service back CHOWN, SETUID and SETGID.
    user: mongodb
    restart: unless-stopped
    ports:
      # Loopback only, and the one port outside nginx on either stack: it is here for a database
      # client on the host, and any other interface publishes an unauthenticated mongod.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      # What `./scripts/ops/local.sh --seed` restores from. Read-only: the restore reads this directory
      # and nothing inside the container writes it.
      - ./.local-db/dump:/dump:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Initiates the set on the first probe and reports healthy only once the node has elected
      # itself: `replSetInitiate` returns before the election, and the first write then fails with
      # `NotWritablePrimary` (`fl_backend/tests/conftest.py :: mongo_replica_set_url`).
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate() } db.hello().isWritablePrimary || quit(1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # The cadence during start_period, as the two services above set for the same reason.
      start_interval: 3s

  nginx:
    # The same pin as docker-compose.yml, for the same reason: an unpinned tag is a different nginx
    # per host, and this stack exists to exercise the production one.
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    # The access log's mount is a directory in the checkout rather than production's `/var/log`,
    # which this stack's Windows hosts do not have. `.tmp-*/` is ignored, and `local.sh --fresh`
    # removes it with the database copy: both are records of real people.
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./.tmp-nginx-log:/var/log/frankfurtleague/nginx
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  frankfurtleague-net:
    driver: bridge

# A named volume rather than a bind mount: mongod's storage engine wants POSIX file locking, which
# a Windows host directory does not give it.
volumes:
  mongo-data:
    driver: local
