# OPS · local stack
#
# The production images, built from source, behind nginx, with a database of its own; started by
# `./scripts/ops/local.sh` and served on http://localhost:3000. `docs/ops/spec.md` §1.5 states what
# this stack covers that neither `pnpm dev` nor production does.
#
# Invariants:
# - An override of docker-compose.yml, never a stack on its own: `local.sh` runs
#   `docker compose -f docker-compose.yml -f docker-compose.local.yml`, and compose merges this file
#   over that one by its documented rules (https://docs.docker.com/reference/compose-file/merge/).
#   Everything this file does not write is production's, so every key below IS a difference.
# - Paths resolve against docker-compose.yml's directory, the first file named, not this one's.
# - Never renamed to docker-compose.override.yml or compose.override.yaml: compose merges a file of
#   either name unasked, and the server's checkout holds this file.

services:
  frontend:
    # Builds rather than pulls. `!reset` rather than leaving the tag: a build carrying production's
    # image name would tag this tree's image as the published one on this machine.
    image: !reset null
    build:
      context: ./fl_frontend
      dockerfile: Dockerfile
    environment:
      # Overrides whatever `fl_frontend/.env` holds, because inside the compose network the backend is
      # not on localhost -- it is reachable by service name.
      - API_URL=http://backend:8000
      # The stack's own declaration, overriding whatever `fl_frontend/.env` holds, which `pnpm dev`
      # reads as well and may declare otherwise. Nothing else stops this stack mailing the league's
      # real contact people.
      - APP_ENV=local
      # http:// and localhost specifically: `fl_frontend/src/core/config.ts` refuses a non-loopback
      # http URL, because the sign-in library derives the session cookie's Secure prefix from this
      # protocol. Loopback is the one exemption.
      - AUTH_URL=http://localhost:3000
      # The point of this stack is the production behaviour, and the developer's `fl_frontend/.env`
      # legitimately holds `console` for `pnpm dev` -- overridden so the stack always writes the
      # production stream (docs/logging/spec.md).
      - LOG_FORMAT=json
      # This stack runs the production build, so nothing but this line holds the sweep off. An armed
      # pass deletes applications and stamps rows in the copy below; APP_ENV withholds every notice
      # it raises.
      - BEWERBUNG_SWEEP=off
      # Cloudflare's published site key that always passes, which the published secret the frontend
      # reads where no file is handed over verifies; production refuses both at boot
      # (https://developers.cloudflare.com/turnstile/troubleshooting/testing/, read 2026-10-04).
      - TURNSTILE_SITE_KEY=1x00000000000000000000AA
    # Production's list without `auth_resend_key`, `resend_webhook_secret` and `turnstile_secret_key`:
    # this stack mails nothing, is sent no provider event, and verifies the bot check with Cloudflare's
    # published secret. The login is the config below.
    secrets: !override
      - fl_actor_signing_key
      - auth_secret
      - internal_api_key_base
      - internal_api_key_system
      - internal_api_key_admin
    # At the path the frontend reads its login from, which production fills with a secret.
    configs:
      - source: local_mongodb_uri
        target: /run/secrets/frontend_mongodb_uri
    volumes:
      # The mail sink a withheld send writes into, in the checkout so the developer opens the file
      # rather than copying it out. Without it the sink has nowhere to write: `/app` is root-owned
      # and the container runs as `nextjs`.
      - ./.tmp-mail:/app/.tmp-mail
    depends_on:
      mongo:
        condition: service_healthy

  backend:
    image: !reset null
    build:
      context: ./fl_backend
      dockerfile: Dockerfile
    environment:
      # Same reason as the frontend's override above: the stack shows the production stream even
      # when the developer's `fl_backend/.env` selects the console format for `fastapi dev`.
      - LOG_FORMAT=json
    # Production's list without the login, which the config below replaces as the frontend's does.
    secrets: !override
      - sperrliste_schluessel
      - internal_api_key_base
      - internal_api_key_system
      - internal_api_key_admin
    configs:
      - source: local_mongodb_uri
        target: /run/secrets/backend_mongodb_uri
    depends_on:
      # Healthy, not started: the lifespan applies every validator before it yields and refuses the
      # boot if it cannot, so a backend reaching an unelected node fails the whole start.
      mongo:
        condition: service_healthy

  # Production declares no database service and must not gain one (`docs/ops/spec.md :: I174`).
  mongo:
    # The tag `fl_backend/tests/conftest.py` starts the db tier against, and the floor the managed
    # cluster runs, so a copy taken from it restores into a server of its own major version. Pinned
    # here by its digest too (`docs/ops/spec.md` §1.1).
    image: mongo:8.3.11@sha256:d731d77bfd7afd66bd487bdf627b5bf7ce4c3602ec461d635977021db529ebbc
    # A single-node replica set rather than a standalone: every transactional endpoint runs
    # `session.with_transaction`, and a standalone answers one with `IllegalOperation`.
    command: --replSet rs0 --bind_ip_all
    # Pinned so the `rs.initiate()` below composes a member host the other containers resolve. The
    # default is the container id, which nothing else on this network can reach.
    hostname: mongo
    # Skips the entrypoint's chown and its step down from root, which `cap_drop: ALL` would refuse
    # -- the alternative was handing this service back CHOWN, SETUID and SETGID.
    user: mongodb
    restart: unless-stopped
    ports:
      # Loopback only, and the one port outside nginx on either stack: it is here for a database
      # client on the host, and any other interface publishes an unauthenticated mongod.
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
      # What `./scripts/ops/local.sh --seed` restores from. Read-only: the restore reads this directory
      # and nothing inside the container writes it.
      - ./.local-db/dump:/dump:ro
    # The application pair's network, which nginx shares and nothing reaching the edge does.
    networks:
      - frankfurtleague-app
    # docker-compose.yml's `x-logging`, spelled out: a YAML anchor does not reach across files.
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # Initiates the set on the first probe and reports healthy only once the node has elected
      # itself: `replSetInitiate` returns before the election, and the first write then fails with
      # `NotWritablePrimary` (`fl_backend/tests/conftest.py :: mongo_replica_set_url`).
      test: ["CMD-SHELL", "mongosh --quiet --eval 'try { rs.status() } catch (e) { rs.initiate() } db.hello().isWritablePrimary || quit(1)'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # The cadence during start_period, as docker-compose.yml's services set for the same reason.
      start_interval: 3s

  nginx:
    # Production publishes nothing; this stack serves the edge on 3000.
    ports:
      - "3000:80"
    # `!override`, the whole list replaced: nginx/local in nginx/prod's place, a directory for the
    # base file's reason, and no ./certs.
    volumes: !override
      - ./nginx/local:/etc/nginx/conf.d:ro
      - ./nginx/shared:/etc/nginx/shared:ro
      # In the checkout, this stack's Windows hosts having no `/var/log`. `.tmp-*/` is ignored, and
      # `local.sh --fresh` removes it with the database copy: both are records of real people.
      - ./.tmp-nginx-log:/var/log/frankfurtleague/nginx

  # The tunnel is production's only route in; this stack is reached on this host. A profile nothing
  # here activates keeps compose from starting it, where the merge rules offer no way to delete a
  # service the base declares.
  cloudflared:
    profiles:
      - production-tunnel
    # With the top-level entry below: this checkout holds no connector credential for compose to
    # resolve, and a service that never starts needs none.
    secrets: !reset []

# This machine's own files (`docs/ops/runbooks.md` §16), and none for the connector, which never
# starts.
secrets: !override
  fl_actor_signing_key:
    file: ./secrets/fl_actor_signing_key
  auth_secret:
    file: ./secrets/auth_secret
  sperrliste_schluessel:
    file: ./secrets/sperrliste_schluessel
  internal_api_key_base:
    file: ./secrets/internal_api_key_base
  internal_api_key_system:
    file: ./secrets/internal_api_key_system
  internal_api_key_admin:
    file: ./secrets/internal_api_key_admin

# Both logins, inline: the `mongo` service above holds no credential, so this is no secret, and no
# machine keeps a copy of production's login to aim the stack at (`docs/ops/spec.md :: I508`).
configs:
  local_mongodb_uri:
    content: mongodb://mongo:27017/?directConnection=true

# A named volume rather than a bind mount: mongod's storage engine wants POSIX file locking, which
# a Windows host directory does not give it.
volumes:
  mongo-data:
    driver: local
