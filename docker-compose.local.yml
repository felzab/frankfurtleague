# OPS · local stack
#
# The production images, built from source, on your machine, behind nginx. Started by
# `./scripts/local.sh`; serves on http://localhost:3000.
#
# It exists because `pnpm dev` cannot see a whole class of problem -- it exercises neither the
# standalone build, the startup environment gate, nginx, nor the security headers. This is the only
# place a packaging failure is visible BEFORE a deploy.
#
#  INVARIANTS ───────────────────────────────────────────────────────────────────────────────────────
#
#   • Mirrors docker-compose.yml except that it BUILDS rather than pulls, and overrides the two URLs
#     that differ off-server. A difference beyond those two is a difference production will not have
#     caught.
#   • `AUTH_URL` must stay on loopback. `config.ts` refuses a non-loopback http:// value, because
#     @auth/core derives the session cookie's Secure flag from that protocol.
#
#  SEE ALSO ─────────────────────────────────────────────────────────────────────────────────────────
#
#   scripts/README.md -- the three environments and what each does not cover

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    build:
      context: ./fl_frontend
      dockerfile: Dockerfile
    env_file: ./fl_frontend/.env
    environment:
      # Overrides whatever .env holds, because inside the compose network the backend is not on
      # localhost -- it is reachable by service name.
      - API_URL=http://backend:8000
      # http://, not https://, and localhost specifically: config.ts refuses a non-loopback http URL
      # because @auth/core derives the session cookie's Secure flag from this protocol. Loopback is
      # the one exemption, and it exists for exactly this stack.
      - AUTH_URL=http://localhost:3000
      # The point of this stack is the production behaviour, and the developer's .env legitimately
      # holds `console` for `pnpm dev` -- overridden so the stack always writes the production
      # stream (docs/logging.md).
      - LOG_FORMAT=json
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/favicon.ico",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  backend:
    build:
      context: ./fl_backend
      dockerfile: Dockerfile
    env_file: ./fl_backend/.env
    environment:
      # Same reason as the frontend's override above: the stack shows the production stream even
      # when the developer's .env selects the console format for `fastapi dev`.
      - LOG_FORMAT=json
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/system/is_live', timeout=10)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "3000:80"
    volumes:
      - ./nginx/local.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy

networks:
  frankfurtleague-net:
    driver: bridge
