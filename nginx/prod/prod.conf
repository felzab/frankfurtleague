# What production alone serves: the catch-all, the www redirect and the apex's name. Everything the
# local edge serves too is in nginx/shared/.

# Plain HTTP on 80 alone: the tunnel's connector carries the visitor's HTTPS from Cloudflare and hands
# each request over the stack's own network, so no certificate is held here.

include /etc/nginx/shared/http.conf;

# Catch-all for unknown hosts: without it an unrecognised Host is answered by whichever block nginx
# picks first rather than being refused, so a name nobody configured gets a reply.
server {
    listen 80 default_server;

    server_name _;
    # Named in every block: http.conf's `access_log off` leaves a block declaring none unlogged.
    access_log /dev/stdout fl_json;
    return 421;
}


# www -> apex. HSTS's `includeSubDomains` makes a returning browser ask www over https too, which
# Cloudflare answers and the connector hands here like any other request.
server {
    listen 80;

    server_name www.frankfurtleague.de;
    access_log /dev/stdout fl_json;
    # Longer than the connector keeps an idle connection, so nginx never closes one the connector is
    # writing a request onto. The connector reaches this block and the apex's alone, answering a
    # hostname no route names with its own 404.
    keepalive_timeout 100s;

    # The whole set, HSTS among it: a redirect that drops HSTS would let the policy lapse for the
    # subdomain it is meant to cover.
    include /etc/nginx/shared/security_headers.conf;

    return 301 https://frankfurtleague.de$request_uri;
}


server {
    listen 80;

    server_name frankfurtleague.de;

    # What site.conf hands Next as the visitor's protocol: every visitor reached Cloudflare over
    # https, which this hop's own $scheme, plain http, does not say.
    set $forwarded_proto https;

    include /etc/nginx/shared/site.conf;
}
