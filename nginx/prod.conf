# OPS · the production edge. Terminates TLS, sets the security headers and routes everything to the
# Next.js frontend bar one backend path. Mounted read-only by docker-compose.yml; nginx/local.conf is
# the same file without TLS, and every comment block here is the one copy of its reasoning.

# Behind Cloudflare the connecting address is a Cloudflare edge, so every limit_req zone below
# would key every visitor arriving through one point of presence to a single address -- one
# submission would exhaust the limit for all of them.

# Fetched 2026-08-30 from www.cloudflare.com/ips-v4/ and /ips-v6/, and they go stale: Cloudflare
# publishes a change before it goes live.

# These are every Cloudflare customer's ranges, not this account's, so any of them can present a
# header this edge believes. Narrowing that needs Authenticated Origin Pulls or a host
# firewall, neither of which lives in this file.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

# Cloudflare's own recommendation over X-Forwarded-For, and the format is the reason: it carries
# exactly one address, where X-Forwarded-For is a chain whose left-hand entries the client
# wrote.
real_ip_header CF-Connecting-IP;
# A comma chain in CF-Connecting-IP is parsed like any other header, and off takes the last
# element. Declared rather than inherited: a chained value's safety rests on this default.
real_ip_recursive off;

# A whole IPv6 address is worthless as a rate-limit key: a /64 is the smallest block anyone is
# allocated, so keying the /128 lets one customer walk every zone below using addresses they
# already hold. IPv4 has no such room and keys whole.

# nginx compresses the longest run of two or more zero groups, and where that run falls depends on
# the HOST bits, so one /64 can render two ways. Every shape is enumerated: a missed one splits a
# /64 into two buckets and doubles its allowance.

# The three anchored branches cover a `::` with five or six groups after it, where the tail reaches
# back into the prefix. Without them a /64 whose middle groups are zero splits.
map $remote_addr $client_net {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"  $1;
    "~*^([0-9a-f]+)::([0-9a-f]+)(?::[0-9a-f]+){4}$"        "$1:0:0:$2";
    "~*^::([0-9a-f]+):([0-9a-f]+)(?::[0-9a-f]+){4}$"       "0:0:$1:$2";
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){4}$"                   "0:0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                 "$1:0";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0:0";
    "~*^::"                                                "0:0:0:0";
    default                                                $remote_addr;
}

# A /64 is the smallest block anyone is ALLOCATED, but RFC 6177 and RIPE-690 put a residential
# customer at a /56 or a /48, so one subscriber holds up to 65,536 /64s and can walk a zone keyed on
# one. This wider key bounds that walk; both zones apply to every limited location below.

# Three WHOLE groups, because a /56 cannot be taken from these strings at all: nginx prints a group
# without leading zeros, so a character position stops tracking a bit position: 0034 and 00ff share
# a /56 yet print "34" and "ff", while 3400 -- a different /56 -- prints "3400", starting "34" too.

# The anchored branch covers a `::` with exactly six groups after it, the one shape whose third group
# survives the compression. Fewer groups put a zero there, which the trailing branch already answers.
map $remote_addr $client_net48 {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"            $1;
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){5}$"                   "0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0";
    "~*^::"                                                "0:0:0";
    default                                                $remote_addr;
}

# Rate limiting for the sign-in action. handleSignIn is a public, unauthenticated outbound-email
# trigger: its action id ships in a client chunk on /signin, so anyone can POST it. An empty key is
# exempt from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $client_net;
    default "";
}
# The wide key needs the same POST-only shape, and a map cannot take two source variables.
map $request_method $signin_limit_key48 {
    POST    $client_net48;
    default "";
}

# Every zone below is paired: the narrow one keeps ordinary visitors apart, the wide one caps the
# walk across a subscriber's own /64s. Ten times the rate and the burst, so the wide zone never
# decides a lone visitor's request and a walk meets a ceiling ten times its twin, not 65,536 --
# bewerbung48 excepted, which sits lower for the reason recorded at its own line.

# Held apart per endpoint rather than pooled: a Kürzel keystroke and an outbound email cost
# differently, and one shared ceiling would let the cheap traffic spend what guards the expensive.

# 5m against the narrow zones' 10m -- any traffic mix holds fewer /48s than /64s, so the wider key
# needs less room, never more.
limit_req_zone $signin_limit_key   zone=signin:10m      rate=5r/m;
limit_req_zone $signin_limit_key48 zone=signin48:5m     rate=50r/m;
# The client-error ingest is public and unauthenticated too (docs/logging/spec.md); the same
# POST-only key shape keeps it from becoming a log-flooding vector.
limit_req_zone $signin_limit_key   zone=clienterr:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=clienterr48:5m  rate=60r/m;
# The public application form's submission is the same shape again: public, unauthenticated, and
# POST-keyed through the map for the reason above. Its rate is the lowest here because the handler
# mails an address the REQUEST supplied, so every allowed request is a message to a chosen stranger.

# bewerbung48 breaks the ten-times rule deliberately. Around 1025 applications in one season leave the
# admin triage read answering 500, and 6r/m puts that flood roughly three hours out of one allocation
# rather than fifty minutes. It raises the price and repairs nothing: the read itself caps at
# LIST_LIMIT_DEFAULT and reports the answer partial, with saison_id and status the way back to the
# rest. What this risks is a school behind one /48 signing up as a class.
limit_req_zone $signin_limit_key   zone=bewerbung:10m   rate=2r/m;
limit_req_zone $signin_limit_key48 zone=bewerbung48:5m  rate=6r/m;
# The Kürzel check is a GET, and the method map gives a GET an empty key -- which is exempt from
# limit_req entirely. Keyed there it would read as limited and be unlimited, with nothing to say so,
# hence an unconditional key of its own.
limit_req_zone $client_net         zone=kuerzel:10m     rate=30r/m;
limit_req_zone $client_net48       zone=kuerzel48:5m    rate=300r/m;
limit_req_status 429;

# `location /` carries every page and every server action and no limit_req can reach it -- a zone
# there would also meter /_next/static and stall an ordinary page load. A connection ceiling bounds
# the same flood without metering anything.

# Sized for HTTP/2, where nginx counts each CONCURRENT REQUEST as a connection, so one navigation
# spends many at once. It bites a direct-to-origin flood; through Cloudflare, whose edge pools origin
# connections, it is a backstop rather than a per-visitor control.

# Keyed on the narrow net alone, deliberately: the zones above pair because a RATE is a budget spent
# over time, which a walk across a subscriber's /64s multiplies. Concurrency is instantaneous and
# bounded by the attacker's own sockets, so a /48 twin would have to clear what 256 households draw
# at once under that accounting -- high enough to cap nothing.
limit_conn_zone $client_net zone=conn:5m;
# Matching limit_req_status, so one access line's `status` means the same thing whichever refused.
limit_conn_status 429;

# One JSON document per access line, field-compatible with the application logs
# (docs/logging/spec.md). `correlation_id` is nginx's own $request_id, handed to the upstream
# wherever the location inherits the header set below, so this line joins the application's.

# escape=json keeps an attacker-controlled value (user agent, referer) from breaking the document.
# Durations are nginx-native seconds.

# $remote_addr is the visitor rather than the Cloudflare edge -- realip above replaces it before
# this line is written -- while `x_forwarded_for` stays the header exactly as it arrived.
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"correlation_id":"$request_id","message":"$request_method $request_uri -> $status",'
    '"method":"$request_method","path":"$request_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$http_host","referer":"$http_referer","user_agent":"$http_user_agent"}';


server {
  listen 80;
  listen [::]:80;
  server_name frankfurtleague.de www.frankfurtleague.de;

  server_tokens off;
  access_log /var/log/nginx/access.log fl_json; # Redirects are requests too -- every block logs the same format
  return 301 https://frankfurtleague.de$request_uri; # Drop www.
}


# Catch-all for unknown hosts: without it an unrecognised Host is answered by whichever 443 block
# nginx picks first rather than being refused, so a name nobody configured gets a reply.
# ssl_reject_handshake drops the connection before a certificate is needed.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}


# www -> apex, over HTTPS. HSTS's `includeSubDomains` below makes the port-80 redirect unreachable:
# a browser that has seen the header once forces https:// on www.frankfurtleague.de too, and never
# issues the plaintext request.

# Without this block that request matches the catch-all `default_server` and has its TLS handshake
# rejected — a 525 at Cloudflare (observed 2026-08-01), so www breaks for every returning visitor
# while still appearing to work for a first-time one.

# The certificate must therefore cover www as well as the apex; where it does not, this block fails
# the handshake exactly as the catch-all did.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.frankfurtleague.de;
    server_tokens off;
    access_log /var/log/nginx/access.log fl_json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Repeated deliberately: `add_header` in a server block replaces the inherited set rather than
    # extending it (docs/ops/spec.md, invariant I2), and a redirect that drops HSTS would let the
    # policy lapse for the subdomain it is meant to cover.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://frankfurtleague.de$request_uri;
}


# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name frankfurtleague.de;
    server_tokens off;

    # The edge's per-request record, static assets included (docs/logging/spec.md). It is the only
    # surface that sees a cached page hit — a cached page runs no application code — so this line is
    # what makes a correlation id on every request true.
    access_log /var/log/nginx/access.log fl_json;

    client_max_body_size 20M;

    # A header or body arriving a byte at a time holds a worker for as long as nginx will wait, and
    # the published ports take a connection from anywhere. Each bounds the gap between two reads or
    # writes rather than the whole transfer, so a slow mobile upload is unaffected.
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Next compresses first -- `compress` defaults to true and next.config.ts does not set it, so a
    # response reaches nginx already gzipped and `gzip off` here would be a no-op. Keep the origin
    # compressing: Cloudflare passes any Content-Encoding through, and its zstd measured larger.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The single enforced CSP for the whole app, keeping 'unsafe-inline' on script-src because a
    # nonce cannot cover build-time prerendered HTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Minted HERE: a client-supplied X-Correlation-ID is discarded, so nothing a visitor sends can
    # impersonate another request's id in the logs. Carried into any location that declares no
    # proxy_set_header of its own, which is every one that reaches application code
    # (docs/logging/spec.md).
    proxy_set_header X-Correlation-ID $request_id;
    # Cleared at server level: nothing a visitor sends may name the admin a write is attributed to.
    # The frontend reaches the backend over the Docker network instead, so the header the session set
    # is the only one a write ever carries. Inherited by every location that reaches a write.
    proxy_set_header X-FL-Actor "";


    # Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).

    # Both zones are named in EVERY limited location, never once at server level: limit_req is
    # inherited only where the level declares none, so a server-level pair would be dropped whole by
    # each block below -- the replace-rather-than-extend rule `docs/ops/spec.md` invariant I2 records
    # for add_header.
    location = /signin {
        limit_req zone=signin burst=3 nodelay;
        limit_req zone=signin48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Client-error ingest -- a Next route handler. Rate-limited: it is public and unauthenticated by
    # design (docs/logging/spec.md).
    location = /api/client-error {
        limit_req zone=clienterr burst=3 nodelay;
        limit_req zone=clienterr48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    # The public application form's two Next route handlers, public and unauthenticated. Neither
    # declares a proxy_set_header: one drops the whole inherited set, and with it the minted
    # X-Correlation-ID and the blanked X-FL-Actor (docs/logging/spec.md).
    location = /api/bewerbung {
        limit_req zone=bewerbung burst=2 nodelay;
        limit_req zone=bewerbung48 burst=20 nodelay;
        # The one unauthenticated write, against a fixed-shape payload: three contact slots, a school
        # and two counts, with no array a caller can grow. A few kilobytes of JSON, so the server
        # block's 20M is headroom for an attacker alone. Plainly inherited, unlike the two above.
        client_max_body_size 64k;
        proxy_pass http://frontend:3000;
    }

    # Its own zone rather than the POST-keyed one: this is a GET (see the zones above).
    location = /api/bewerbung/kuerzel {
        limit_req zone=kuerzel burst=10 nodelay;
        limit_req zone=kuerzel48 burst=100 nodelay;
        proxy_pass http://frontend:3000;
    }

    # The trailing-slash form of each metered path above. Measured 2026-08-30: each one misses its
    # exact match and lands on `location /`, which carries no limit_req, so a burst of them reached
    # Next unmetered. Next answers every one with a 308 to the canonical path and no handler runs, so
    # metering them changes nothing a visitor sees -- what it closes is unmetered upstream work.

    # Proxied rather than answered here, deliberately: a `return 308` at the edge would be nginx
    # deciding trailing-slash policy, which is Next's. These blocks meter what they forward and
    # nothing else, so the pair stays correct if that policy ever changes.
    location = /signin/ {
        limit_req zone=signin burst=3 nodelay;
        limit_req zone=signin48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    location = /api/client-error/ {
        limit_req zone=clienterr burst=3 nodelay;
        limit_req zone=clienterr48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    location = /api/bewerbung/ {
        limit_req zone=bewerbung burst=2 nodelay;
        limit_req zone=bewerbung48 burst=20 nodelay;
        client_max_body_size 64k;
        proxy_pass http://frontend:3000;
    }

    location = /api/bewerbung/kuerzel/ {
        limit_req zone=kuerzel burst=10 nodelay;
        limit_req zone=kuerzel48 burst=100 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Every Next route handler under /api/admin — one per page-owned editor's undo. Each
    # authorizes itself with the same `getAdminSession()` the server actions use, because
    # /admin/:path* does not match these paths.

    # A prefix, not one exact block per handler. It names where these paths go rather than deciding
    # it -- `location /` reaches the same upstream, so removing this block changes no response. Kept
    # because the routing table is what a reader checks, and an unnamed /api path reads as an
    # oversight.
    location /api/admin/ {
        proxy_pass http://frontend:3000;
    }

    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # The only backend path reachable from the internet, and exact-match so nothing else joins it:
    # `docs/ops/spec.md` §3 answers a backend outage behind a green edge by monitoring this from
    # outside. Chosen because it needs no key and touches no database. `/api/v0/` is hardcoded here
    # -- `docs/ops/spec.md` §4 records the sites a version left behind breaks.

    # $proxy_host is the upstream `proxy_pass` names, so the probe presents itself the way the
    # frontend's own calls do and `api_trusted_hosts` needs no public name in it. A location
    # declaring ANY proxy_set_header drops the whole inherited set, so the server block's are
    # repeated here in full -- the mechanism `docs/ops/spec.md` invariant I2 records for add_header.
    location = /api/v0/system/is_live {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-FL-Actor "";

        # A cached 200 would report a dead backend as live, which is the failure this route exists
        # to catch -- and Cloudflare's cache rules live outside this repo. Setting any add_header
        # replaces the inherited set, so the security headers repeat (I2). No limit_req, unlike the
        # public unauthenticated writes above: a zone would throttle the monitor this route exists
        # for, and a keyless GET touching no database is not what a rate limit protects.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

        proxy_pass http://backend:8000;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;

        expires max;
        # `immutable` only because every URL under here carries a content hash.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # `add_header` in a location REPLACES the inherited set rather than adding to it, so every
        # header the server block sets is repeated here verbatim, the CSP included
        # (docs/ops/spec.md, invariant I2).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    location / {
        limit_conn conn 50;
        proxy_pass http://frontend:3000;
    }
}
