# OPS · the production edge. Terminates TLS, sets the security headers and routes to the Next.js
# frontend and the FastAPI backend. Mounted read-only by docker-compose.yml; nginx/local.conf is the
# same file without TLS, and every comment block here is the one copy of its reasoning.
#
# Rate limiting for the sign-in action. handleSignIn is a public, unauthenticated outbound-email
# trigger: its action id ships in a client chunk on /signin, so anyone can POST it. An empty key is
# exempt from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signin_limit_key zone=signin:10m rate=5r/m;
# The client-error ingest is the only other public, unauthenticated write (docs/logging/spec.md); the
# same POST-only key shape keeps it from becoming a log-flooding vector.
limit_req_zone $signin_limit_key zone=clienterr:10m rate=6r/m;
limit_req_status 429;

# One JSON document per access line, field-compatible with the application logs
# (docs/logging/spec.md). `correlation_id` is nginx's own $request_id, handed to every upstream
# below, so this line joins the application's for one request.

# escape=json keeps an attacker-controlled value (user agent, referer) from breaking the document.
# Durations are nginx-native seconds; behind Cloudflare $remote_addr is a Cloudflare address and the
# visitor is in `x_forwarded_for`.
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"correlation_id":"$request_id","message":"$request_method $request_uri -> $status",'
    '"method":"$request_method","path":"$request_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$http_host","referer":"$http_referer","user_agent":"$http_user_agent"}';


server {
  listen 80;
  listen [::]:80;
  server_name frankfurtleague.de www.frankfurtleague.de;

  server_tokens off;
  access_log /var/log/nginx/access.log fl_json; # Redirects are requests too -- every block logs the same format
  return 301 https://frankfurtleague.de$request_uri; # Drop www.
}


# Catch-all for unknown hosts: without it the block below is the default, so any Host header reaches
# Next and `proxy_set_header Host $http_host` forwards it verbatim. ssl_reject_handshake drops the
# connection before a certificate is needed.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}


# www -> apex, over HTTPS. HSTS's `includeSubDomains` below makes the port-80 redirect unreachable:
# a browser that has seen the header once forces https:// on www.frankfurtleague.de too, and never
# issues the plaintext request.

# Without this block that request matches the catch-all `default_server` and has its TLS handshake
# rejected — a 525 at Cloudflare (observed 2026-08-01), so www breaks for every returning visitor
# while still appearing to work for a first-time one.

# The certificate must therefore cover www as well as the apex; where it does not, this block fails
# the handshake exactly as the catch-all did.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.frankfurtleague.de;
    server_tokens off;
    access_log /var/log/nginx/access.log fl_json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Repeated deliberately: `add_header` in a server block replaces the inherited set rather than
    # extending it (docs/ops/spec.md, invariant I2), and a redirect that drops HSTS would let the
    # policy lapse for the subdomain it is meant to cover.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://frankfurtleague.de$request_uri;
}


# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name frankfurtleague.de;
    server_tokens off;

    # The edge's per-request record, static assets included (docs/logging/spec.md). It is the only
    # surface that sees a cached page hit — a cached page runs no application code — so this line is
    # what makes a correlation id on every request true.
    access_log /var/log/nginx/access.log fl_json;

    client_max_body_size 20M;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Next compresses first -- `compress` defaults to true and next.config.ts does not set it, so a
    # response reaches nginx already gzipped and `gzip off` here would be a no-op. Keep the origin
    # compressing: Cloudflare passes any Content-Encoding through, and its zstd measured larger.
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The single enforced CSP for the whole app, keeping 'unsafe-inline' on script-src because a
    # nonce cannot cover build-time prerendered HTML.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Minted HERE, unconditionally: a client-supplied X-Correlation-ID is discarded, so nothing a
    # visitor sends can impersonate another request's id in the logs. Both upstreams receive the
    # same value this block's access line carries (docs/logging/spec.md).
    proxy_set_header X-Correlation-ID $request_id;


    # Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).
    location = /signin {
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Client-error ingest -- a Next route handler, so it must NOT fall through to the /api block
    # below, which proxies to FastAPI. Rate-limited: it is public and unauthenticated by design
    # (docs/logging/spec.md).
    location = /api/client-error {
        limit_req zone=clienterr burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Every Next route handler under /api/admin — one per page-owned editor's undo. Each
    # authorizes itself with the same `getAdminSession()` the server actions use, because
    # /admin/:path* does not match these paths.

    # A prefix, not one exact block per handler: a handler without a block falls through to FastAPI
    # and 404s, which the client reports as a transport failure that names nothing. Safe because
    # every backend route is mounted under /api/v{API_VERSION}/.
    location /api/admin/ {
        proxy_pass http://frontend:3000;
    }

    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    location /api {
        proxy_pass http://backend:8000;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;

        expires max;
        # `immutable` only because every URL under here carries a content hash.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # `add_header` in a location REPLACES the inherited set rather than adding to it, so every
        # header the server block sets is repeated here verbatim, the CSP included
        # (docs/ops/spec.md, invariant I2).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    location / {
        proxy_pass http://frontend:3000;
    }
}
