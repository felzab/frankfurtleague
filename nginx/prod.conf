# OPS · the production edge. Terminates TLS, sets the security headers and routes everything to the
# Next.js frontend bar one backend path. Mounted read-only by docker-compose.yml with nginx/shared/,
# which holds everything nginx/local.conf serves too; this file holds what production alone does:
# the trusted connector address, the plaintext and www redirects, the TLS catch-all, and TLS itself.

# Behind the tunnel the connecting address is the connector, so every limit_req zone below would
# key every visitor to that one address -- one submission would exhaust the limit for all of them.

# One entry rather than Cloudflare's published ranges: `docker-compose.yml` publishes no port and
# gives the connector a static address, so nothing else reaches this origin, and those ranges are
# every customer's egress rather than this account's.
set_real_ip_from 172.30.0.250;

# Cloudflare's own recommendation over X-Forwarded-For, and the format is the reason: it carries
# exactly one address, where X-Forwarded-For is a chain whose left-hand entries the client
# wrote.
real_ip_header CF-Connecting-IP;
# A comma chain in CF-Connecting-IP is parsed like any other header, and off takes the last
# element. Declared rather than inherited: a chained value's safety rests on this default.
real_ip_recursive off;

# Recovery can fall back silently: where CF-Connecting-IP is absent or does not parse, realip
# leaves the connector's address in $remote_addr and every zone below collapses to one bucket for
# the whole site.

# An address still the connector's after realip ran is that fallback, and the access line marks it
# (realip_fallback). A second copy of the address, because geo takes CIDR and set_real_ip_from
# feeds no variable; both change together.
geo $realip_fallback {
    default          0;
    172.30.0.250/32  1;
}

include /etc/nginx/shared/http.conf;

# Nothing dials 80: the tunnel's origin keeps TLS (`docs/ops/spec.md` §1.8) and no service publishes
# a port (`:: I1`). Delete it and repoint that origin at 80 in Cloudflare's dashboard, and a visitor
# meets a connection refused nothing explains.
server {
  listen 80;
  listen [::]:80;
  server_name frankfurtleague.de www.frankfurtleague.de;

  # Named in every block, the catch-all included: `nginx/shared/http.conf`'s `access_log off` leaves
  # a block declaring none unlogged. The host rotates this file (docs/ops/runbooks.md §7).
  access_log /var/log/frankfurtleague/nginx/access.log fl_json; # Redirects are requests too -- every block logs the same format
  return 301 https://frankfurtleague.de$request_uri; # Drop www.
}


# Catch-all for unknown hosts: without it an unrecognised Host is answered by whichever 443 block
# nginx picks first rather than being refused, so a name nobody configured gets a reply.
# ssl_reject_handshake drops the connection before a certificate is needed.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    ssl_reject_handshake on;
    # Requests do reach this block: a Host naming no server here, over a handshake another block's
    # name completed, is answered 421, and a client offering only a TLS version refused here 400
    # (both driven against `nginx:1.31-alpine`, 2026-09-24).
    access_log /var/log/frankfurtleague/nginx/access.log fl_json;
}


# www -> apex, over HTTPS. HSTS's `includeSubDomains` below makes the port-80 redirect unreachable:
# a browser that has seen the header once forces https:// on www.frankfurtleague.de too, and never
# issues the plaintext request.

# Without this block that request matches the catch-all `default_server` and has its TLS handshake
# rejected — a 525 at Cloudflare (observed 2026-08-01), so www breaks for every returning visitor
# while still appearing to work for a first-time one.

# The certificate must therefore cover www as well as the apex; where it does not, this block fails
# the handshake exactly as the catch-all did.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.frankfurtleague.de;
    access_log /var/log/frankfurtleague/nginx/access.log fl_json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # The whole set, HSTS among it: a redirect that drops HSTS would let the policy lapse for the
    # subdomain it is meant to cover.
    include /etc/nginx/shared/security_headers.conf;

    return 301 https://frankfurtleague.de$request_uri;
}


# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name frankfurtleague.de;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    include /etc/nginx/shared/site.conf;
}
