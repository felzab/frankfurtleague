# Rate limiting for the sign-in action (R3b §S1.1). handleSignIn is a public, unauthenticated
# outbound-email trigger: its action id ships in a client chunk on /signin, so anyone can POST it.
# An empty key is exempt from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signin_limit_key zone=signin:10m rate=5r/m;
# The client-error ingest is the only other public, unauthenticated write (docs/logging.md); the
# same POST-only key shape keeps it from becoming a log-flooding vector.
limit_req_zone $signin_limit_key zone=clienterr:10m rate=6r/m;
limit_req_status 429;

# One JSON document per access line, field-compatible with both application logs (docs/logging.md):
# `correlation_id` is nginx's own $request_id, which the proxy_set_header below hands to every
# upstream -- so this line joins to the application lines for the same request. escape=json makes
# attacker-controlled values (user agent, referer) unable to break the document. Durations are
# nginx-native seconds; behind Cloudflare $remote_addr is a Cloudflare address and the visitor is in
# `x_forwarded_for` (docs/ops/overview.md).
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"correlation_id":"$request_id","message":"$request_method $request_uri -> $status",'
    '"method":"$request_method","path":"$request_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$http_host","referer":"$http_referer","user_agent":"$http_user_agent"}';


# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name frankfurtleague.de www.frankfurtleague.de;

  server_tokens off; # Hide Nginx version number
  access_log /var/log/nginx/access.log fl_json; # Redirects are requests too -- every block logs the same format
  return 301 https://frankfurtleague.de$request_uri; # Drop www.
}


# Catch-all for unknown hosts. Without it the block below serves as the default, so any Host header
# reaches Next -- and `proxy_set_header Host $http_host` forwards it verbatim. Auth.js only ignores it
# today because AUTH_URL is mandatory; this makes that independent of the env file.
# ssl_reject_handshake drops the connection at TLS time, so no certificate is needed here.
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;
    server_tokens off;
    ssl_reject_handshake on;
}


# www -> apex, over HTTPS.
#
# The port-80 block above already redirects www, but that is unreachable for most visitors: the HSTS
# header below carries `includeSubDomains`, so any browser that has seen it once forces https:// on
# www.frankfurtleague.de too and never issues the plaintext request. Without this block that request
# matched the catch-all `default_server` and had its TLS handshake rejected -- observed 2026-08-01 as
# a 525 from Cloudflare, i.e. www was broken for every returning visitor while appearing to work for
# a first-time one.
#
# The certificate must therefore cover www as well as the apex. If it does not, this block fails the
# handshake exactly as the catch-all did, so it is never worse than the previous behaviour.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.frankfurtleague.de;
    server_tokens off;
    access_log /var/log/nginx/access.log fl_json;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Repeated deliberately: `add_header` in a server block replaces the inherited set rather than
    # extending it (spec invariant I3), and a redirect that drops HSTS would let the policy lapse for
    # the subdomain it is meant to cover.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    return 301 https://frankfurtleague.de$request_uri;
}


# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name frankfurtleague.de;
    server_tokens off; # Hide Nginx version number

    # The edge's per-request record: one JSON line for every request, static assets included
    # (docs/logging.md). This is the only surface that sees cached page hits at all -- a cached page
    # runs no application code -- so this line is what makes "a correlation id on every request" true.
    access_log /var/log/nginx/access.log fl_json;

    # Payload & Buffer optimization
    client_max_body_size 20M;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Enable Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on; # Tells CDNs/browsers cache depends on Accept-Encoding
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;
    # SSL
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off; # Let the client choose from the strong list

    # SSL Performance
    ssl_session_cache   shared:SSL:10m; # Holds ~40,000 sessions
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP Stapling -> Speeds up SSL handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' stays on script-src for now: 24 routes ship a build-time prerendered shell whose
    # script tags cannot carry a per-request nonce. Next emits the nonce-based replacement as
    # The single enforced CSP for the whole app (ledger R3b-S9.1, R3b-S9.2). It deliberately keeps
    # 'unsafe-inline' on script-src: a nonce cannot cover build-time prerendered HTML, and the
    # alternative was three mechanisms plus a permanent framework exception. See R3b-S9.1b for the
    # measurements and for the trigger that would justify revisiting it. react/no-danger is the
    # targeted control that replaces what a nonce policy would have mitigated.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    # Global Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Minted HERE, unconditionally: a client-supplied X-Correlation-ID is discarded, so nothing a
    # visitor sends can impersonate another request's id in the logs. Both upstreams receive the
    # same value this block's access line carries (docs/logging.md).
    proxy_set_header X-Correlation-ID $request_id;


    # Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).
    location = /signin {
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Client-error ingest -- a Next route handler, so it must NOT fall through to the /api block
    # below, which proxies to FastAPI. Rate-limited: it is public and unauthenticated by design
    # (docs/logging.md).
    location = /api/client-error {
        limit_req zone=clienterr burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # The match edit's undo -- a Next route handler, so like the ingest above it must NOT fall through
    # to the /api block below, which proxies to FastAPI. It is a route handler rather than a server
    # action because of an upstream Next.js bug (ADR-0055); it authorizes itself with the same
    # `getAdminSession()` the actions use, because /admin/:path* does not match this path.
    location = /api/admin/spiele/undo {
        proxy_pass http://frontend:3000;
    }

    # Passthrough for Auth.js
    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
    }

    # Next.js Static Assets -> Bypass application logs, max out browser cache
    # Nginx serves assets directly from disk. Bypasses Node.js entirely.
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;

        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Necessary to copy all the headers here again
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Keep this identical to the server-level policy above -- add_header in a location replaces
        # the inherited set rather than adding to it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    # Frontend Main
    location / {
        proxy_pass http://frontend:3000;

        # WebSocket Support for Next.js Turbo/HMR (if needed) or general socket logic
        # THIS CAN NOT BE HERE AND HAS TO BE MOVED IF USED
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
