# OPS · the local edge: nginx/shared/ as production serves it, so the local stack exercises what
# production serves -- including which paths the edge refuses to carry. Mounted by
# docker-compose.local.yml; this file holds only what differs from nginx/prod/prod.conf.

include /etc/nginx/shared/http.conf;

# Catch-all for unknown hosts: without it the block below is the default and any Host header reaches
# Next.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    # Named in every block, for the reason prod.conf carries.
    access_log /dev/stdout fl_json;
    return 421;
}


server {
    listen 80;
    listen [::]:80;

    server_name localhost 127.0.0.1;

    # The browser's own protocol, plain http on this host, where production's visitor arrived over
    # https: Next builds a request's URL from what `nginx/shared/site.conf` hands it.
    set $forwarded_proto $scheme;

    include /etc/nginx/shared/site.conf;
}
