# OPS · the local edge: nginx/shared/ as production serves it, without TLS, so the local stack
# exercises what production serves -- including which paths the edge refuses to carry. Mounted by
# docker-compose.local.yml; this file holds only what differs from nginx/prod/prod.conf.

include /etc/nginx/shared/http.conf;

# Catch-all for unknown hosts: without it the block below is the default and any Host header reaches
# Next. There is no TLS here, so 421 on port 80 is the refusal `nginx/prod/prod.conf` spells as a
# rejected handshake.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    # Named in every block, for the reason prod.conf carries; the mount under it is this checkout's
    # `.tmp-nginx-log/` (docker-compose.local.yml).
    access_log /var/log/frankfurtleague/nginx/access.log fl_json;
    return 421;
}


server {
    listen 80;
    listen [::]:80;

    server_name localhost 127.0.0.1;

    include /etc/nginx/shared/site.conf;
}
