# Only what the local edge does differently from production belongs here, so the local stack
# exercises the shared files as production serves them.

include /etc/nginx/shared/http.conf;

# Catch-all for unknown hosts: without it the block below is the default and any Host header reaches
# Next.
server {
    listen 80 default_server;

    server_name _;
    # Named in every block: the http level's `access_log off` leaves a block naming none unlogged.
    access_log /dev/stdout fl_json;
    return 421;
}


server {
    listen 80;

    server_name localhost 127.0.0.1;

    # The browser's own protocol, plain http on this host, where production's visitor arrived over
    # https: Next builds a request's URL from the protocol the shared block forwards.
    set $forwarded_proto $scheme;

    include /etc/nginx/shared/site.conf;
}
