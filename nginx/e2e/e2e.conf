# The local edge with every rate and connection limit counting and refusing nothing: every journey
# reaches this edge from the host, so all of them arrive as one address and would spend one budget of
# every zone between them. The journeys prove the site, and the edge test proves the limits. Both
# switches are documented at http level and inherited by every server and location below
# (https://nginx.org/en/docs/http/ngx_http_limit_req_module.html#limit_req_dry_run,
# https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html#limit_conn_dry_run).
limit_req_dry_run on;
limit_conn_dry_run on;

# docker-compose.e2e.yml mounts nginx/local/ at this path, beside this file.
include /etc/nginx/local/local.conf;
