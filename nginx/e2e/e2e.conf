# OPS · the end-to-end edge: `nginx/local/` as the local stack serves it, plus the one trust the
# Playwright journeys need to arrive as the separate visitors they play. Mounted by
# docker-compose.e2e.yml, which mounts `nginx/local/` beside it at /etc/nginx/local.
#
# Production takes a visitor's address from Cloudflare's CF-Connecting-IP, trusted from the
# connector alone (`nginx/shared/http.conf`). This stack has no connector: every request from the
# host arrives from the gateway of a network nginx stands on, so every journey would share one
# address and one budget of every limit_req zone, the sign-in's five a minute among them. Each
# journey names its own benchmarking-range address in that header instead
# (`fl_frontend/e2e/support/journey.ts`), and the zones judge each as a visitor of its own.

# Exactly the two gateways the published port can forward the host's requests through, one per
# network nginx stands on, which docker-compose.e2e.yml pins: Docker does not say which one a start
# takes. Nothing wider: an address on either network itself is a container, which may never name a
# visitor.
set_real_ip_from 172.30.1.1;
set_real_ip_from 172.30.0.1;

include /etc/nginx/local/local.conf;
