# OPS · the end-to-end edge: `nginx/local/` as the local stack serves it, with every rate and
# connection limit counting and refusing nothing. Mounted by docker-compose.e2e.yml, which mounts
# `nginx/local/` beside it at /etc/nginx/local.
#
# Every journey reaches this edge from the host, so all of them arrive as one address and would
# spend one budget of every zone between them. The journeys prove the site; `nginx/edge_test.sh`
# proves the limits. Both switches are documented at http level and inherited by every server and
# location below (https://nginx.org/en/docs/http/ngx_http_limit_req_module.html#limit_req_dry_run,
# https://nginx.org/en/docs/http/ngx_http_limit_conn_module.html#limit_conn_dry_run).
limit_req_dry_run on;
limit_conn_dry_run on;

include /etc/nginx/local/local.conf;
