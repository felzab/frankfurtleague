# Rate limiting for the sign-in action (R3b §S1.1), mirroring nginx.conf. An empty key is exempt
# from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $binary_remote_addr;
    default "";
}
limit_req_zone $signin_limit_key zone=signin:10m rate=5r/m;
# The client-error ingest is the only other public, unauthenticated write (docs/logging.md).
limit_req_zone $signin_limit_key zone=clienterr:10m rate=6r/m;
limit_req_status 429;

# Mirrors prod.conf so the local stack produces the production stream (docs/logging.md).
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"correlation_id":"$request_id","message":"$request_method $request_uri -> $status",'
    '"method":"$request_method","path":"$request_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$http_host","referer":"$http_referer","user_agent":"$http_user_agent"}';


# Catch-all for unknown hosts, mirroring nginx.conf so the local stack behaves the same way.
# Without it the block below serves as the default and any Host header reaches Next.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log fl_json;
    return 421; # Misdirected Request
}


server {
    listen 80;
    listen [::]:80;


    server_tokens off; # Target localhost for local testing
    server_name localhost 127.0.0.1; # Hide Nginx version number

    # The edge's per-request record: one JSON line for every request, static assets included
    # (docs/logging.md).
    access_log /var/log/nginx/access.log fl_json;

    # Payload & Buffer optimization
    client_max_body_size 20M;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # COMPRESSION
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    # SECURITY
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # 'unsafe-inline' stays on script-src for now: 24 routes ship a build-time prerendered shell whose
    # script tags cannot carry a per-request nonce. Next emits the nonce-based replacement as
    # The single enforced CSP for the whole app (ledger R3b-S9.1, R3b-S9.2). It deliberately keeps
    # 'unsafe-inline' on script-src: a nonce cannot cover build-time prerendered HTML, and the
    # alternative was three mechanisms plus a permanent framework exception. See R3b-S9.1b for the
    # measurements and for the trigger that would justify revisiting it. react/no-danger is the
    # targeted control that replaces what a nonce policy would have mitigated.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    # Global Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Minted HERE, unconditionally: a client-supplied X-Correlation-ID is discarded. Mirrors
    # prod.conf (docs/logging.md).
    proxy_set_header X-Correlation-ID $request_id;

    # Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).
    location = /signin {
        limit_req zone=signin burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Client-error ingest -- a Next route handler, so it must NOT fall through to the /api block
    # below, which proxies to FastAPI. Mirrors prod.conf (docs/logging.md).
    location = /api/client-error {
        limit_req zone=clienterr burst=3 nodelay;
        proxy_pass http://frontend:3000;
    }

    # The match edit's undo -- a Next route handler, so like the ingest above it must NOT fall through
    # to the /api block below, which proxies to FastAPI. It is a route handler rather than a server
    # action because of an upstream Next.js bug (ADR-0055); it authorizes itself with the same
    # `getAdminSession()` the actions use, because /admin/:path* does not match this path.
    location = /api/admin/spiele/undo {
        proxy_pass http://frontend:3000;
    }

    # The club edit's undo -- the second and last route-handler mutation (ADR-0060). Same reasoning
    # as the block above: it must NOT fall through to the /api block, which proxies to FastAPI.
    location = /api/admin/teams/undo {
        proxy_pass http://frontend:3000;
    }

    # Passthrough for Auth.js
    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
    }

    # Next.js Static Assets -> Bypass application logs, max out browser cache
    # Nginx serves assets directly from disk. Bypasses Node.js entirely.
    #
    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;

        expires max;
        add_header Cache-Control "public, max-age=31536000, immutable";

        # Necessary to copy all the headers here again
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        # Keep this identical to the server-level policy above -- add_header in a location replaces
        # the inherited set rather than adding to it.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    # Frontend Main
    location / {
        proxy_pass http://frontend:3000;

        # WebSocket Support for Next.js Turbo/HMR (if needed) or general socket logic
        # THIS CAN NOT BE HERE AND HAS TO BE MOVED IF USED
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
