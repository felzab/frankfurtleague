# OPS · the local edge. The same routing, rate limits and security headers as nginx/prod.conf,
# without TLS, so the local stack exercises what production serves -- including which paths the edge
# refuses to carry. Mounted by docker-compose.local.yml; prod.conf holds the reasoning behind every
# block repeated here.

# Behind Cloudflare the connecting address is a Cloudflare edge, which would key every zone below
# to it. Inert here, and mirrored so the pair stays one configuration; prod.conf carries why,
# the choice of header included.

# Fetched 2026-08-30 from www.cloudflare.com/ips-v4/ and /ips-v6/; they go stale, and prod.conf
# carries what else these ranges cost.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Cloudflare's documented recommendation over X-Forwarded-For; prod.conf carries why.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# A /64 is the smallest block anyone is allocated, so a /128 key would let one customer walk
# every zone below. Mirrors prod.conf, which carries why the shapes are enumerated.
map $remote_addr $client_net {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"  $1;
    "~*^([0-9a-f]+)::([0-9a-f]+)(?::[0-9a-f]+){4}$"        "$1:0:0:$2";
    "~*^::([0-9a-f]+):([0-9a-f]+)(?::[0-9a-f]+){4}$"       "0:0:$1:$2";
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){4}$"                   "0:0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                 "$1:0";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0:0";
    "~*^::"                                                "0:0:0:0";
    default                                                $remote_addr;
}

# The wider key bounding a walk across the /64s one subscriber holds. Mirrors prod.conf, which
# carries why a /56 is not expressible from these strings and why the anchored branch is there.
map $remote_addr $client_net48 {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"            $1;
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){5}$"                   "0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0";
    "~*^::"                                                "0:0:0";
    default                                                $remote_addr;
}

# Rate limiting for the sign-in action, mirroring prod.conf. An empty key is exempt from limit_req,
# so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $client_net;
    default "";
}
# The wide key needs the same POST-only shape, and a map cannot take two source variables.
map $request_method $signin_limit_key48 {
    POST    $client_net48;
    default "";
}

# Every zone is paired, narrow and wide, at ten times the rate and burst; prod.conf carries why they
# are held apart per endpoint and why the wide zones take less memory rather than more.
limit_req_zone $signin_limit_key   zone=signin:10m      rate=5r/m;
limit_req_zone $signin_limit_key48 zone=signin48:5m     rate=50r/m;
# The client-error ingest is public and unauthenticated too (docs/logging/spec.md).
limit_req_zone $signin_limit_key   zone=clienterr:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=clienterr48:5m  rate=60r/m;
# The public application form's submission, mirroring prod.conf, which carries why its rate is the
# lowest here.
limit_req_zone $signin_limit_key   zone=bewerbung:10m   rate=2r/m;
limit_req_zone $signin_limit_key48 zone=bewerbung48:5m  rate=20r/m;
# The Kürzel check is a GET, whose key in the method map is empty and therefore exempt from
# limit_req; prod.conf carries why that makes a zone of its own rather than another map user.
limit_req_zone $client_net         zone=kuerzel:10m     rate=30r/m;
limit_req_zone $client_net48       zone=kuerzel48:5m    rate=300r/m;
limit_req_status 429;

# The connection ceiling for `location /`, which no limit_req can reach; prod.conf carries why it is
# sized for HTTP/2's accounting and what it is worth behind Cloudflare. This stack serves HTTP/1.1,
# so the same number counts whole connections here and concurrent requests there.
limit_conn_zone $client_net zone=conn:5m;
limit_conn_status 429;

# Mirrors prod.conf so the local stack produces the production stream (docs/logging/spec.md).
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"correlation_id":"$request_id","message":"$request_method $request_uri -> $status",'
    '"method":"$request_method","path":"$request_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","x_forwarded_for":"$http_x_forwarded_for",'
    '"host":"$http_host","referer":"$http_referer","user_agent":"$http_user_agent"}';


# Catch-all for unknown hosts: without it the block below is the default and any Host header reaches
# Next. There is no TLS here, so 421 on port 80 is the refusal `nginx/prod.conf` spells as a
# rejected handshake.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    server_tokens off;
    access_log /var/log/nginx/access.log fl_json;
    return 421;
}


server {
    listen 80;
    listen [::]:80;

    server_tokens off;
    server_name localhost 127.0.0.1;

    # The edge's per-request record: one JSON line for every request, static assets included
    # (docs/logging/spec.md).
    access_log /var/log/nginx/access.log fl_json;

    client_max_body_size 20M;

    # Mirrors prod.conf, which carries why each bounds the gap between two reads rather than the
    # whole transfer.
    client_header_timeout 15s;
    client_body_timeout 15s;
    send_timeout 15s;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # The single enforced CSP for the whole app. Identical to prod.conf's, which carries
    # the reasoning: this stack exists to serve the policy production serves.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    # Minted HERE: a client-supplied X-Correlation-ID is discarded, and carried into any location
    # declaring no proxy_set_header of its own. Mirrors prod.conf (docs/logging/spec.md).
    proxy_set_header X-Correlation-ID $request_id;
    # Cleared at server level: a client-supplied X-FL-Actor is discarded, so a browser cannot forge
    # the admin a write is attributed to. Mirrors prod.conf, which carries why.
    proxy_set_header X-FL-Actor "";

    # Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).

    # Both zones are named in EVERY limited location, never once at server level; prod.conf carries
    # why, and mirroring it here is what lets this stack exercise the same pair.
    location = /signin {
        limit_req zone=signin burst=3 nodelay;
        limit_req zone=signin48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    # Client-error ingest -- a Next route handler. Mirrors prod.conf (docs/logging/spec.md).
    location = /api/client-error {
        limit_req zone=clienterr burst=3 nodelay;
        limit_req zone=clienterr48 burst=30 nodelay;
        proxy_pass http://frontend:3000;
    }

    # The public application form's two Next route handlers. Mirrors prod.conf, which carries why
    # neither declares a proxy_set_header and why the Kürzel check needs a zone of its own.
    location = /api/bewerbung {
        limit_req zone=bewerbung burst=2 nodelay;
        limit_req zone=bewerbung48 burst=20 nodelay;
        # The one unauthenticated write, against a fixed-shape payload; prod.conf carries why the
        # server block's 20M is headroom for an attacker alone.
        client_max_body_size 64k;
        proxy_pass http://frontend:3000;
    }

    location = /api/bewerbung/kuerzel {
        limit_req zone=kuerzel burst=10 nodelay;
        limit_req zone=kuerzel48 burst=100 nodelay;
        proxy_pass http://frontend:3000;
    }

    # EVERY Next route handler under /api/admin -- one per page-owned editor's undo. A PREFIX naming
    # where these paths go rather than deciding it; prod.conf carries why, and this must stay
    # identical to it or the local stack cannot catch a routing mistake.
    location /api/admin/ {
        proxy_pass http://frontend:3000;
    }

    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # The only backend path the edge carries, header block included. Mirrors prod.conf, which carries
    # why -- and mirroring it here is the whole point: this stack is the only place the refusal of
    # every other /api path is exercised before a deploy, because nothing parses this file.
    location = /api/v0/system/is_live {
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header X-Correlation-ID $request_id;
        proxy_set_header X-FL-Actor "";

        # A cached 200 would report a dead backend as live, which is the failure this route exists
        # to catch -- and Cloudflare's cache rules live outside this repo. Setting any add_header
        # replaces the inherited set, so the security headers repeat (I2). No limit_req, unlike the
        # public unauthenticated writes above: a zone would throttle the monitor this route exists
        # for, and a keyless GET touching no database is not what a rate limit protects.
        add_header Cache-Control "no-store" always;
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;

        proxy_pass http://backend:8000;
    }

    location /_next/static/ {
        proxy_pass http://frontend:3000;
        proxy_set_header Host $http_host;

        expires max;
        # `immutable` only because every URL under here carries a content hash.
        add_header Cache-Control "public, max-age=31536000, immutable";

        # `add_header` in a location REPLACES the inherited set, so every header the server block
        # sets is repeated here verbatim, the CSP included (docs/ops/spec.md, invariant I2).
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
    }

    location / {
        limit_conn conn 50;
        proxy_pass http://frontend:3000;
    }
}
