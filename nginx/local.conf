# OPS · the local edge: nginx/shared/ as production serves it, without TLS, so the local stack
# exercises what production serves -- including which paths the edge refuses to carry. Mounted by
# docker-compose.local.yml; this file holds only what differs from nginx/prod.conf.

# Behind an edge the connecting address is that edge's, which would key every zone below to it.
# Inert here: nothing stands in front of the local stack. prod.conf trusts the tunnel connector
# alone and carries why, the header choice included.

# Fetched 2026-08-30 from www.cloudflare.com/ips-v4/ and /ips-v6/; they go stale, and prod.conf
# carries why production trusts the connector's one address instead of them.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
# Cloudflare's documented recommendation over X-Forwarded-For; prod.conf carries why.
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Marks a $remote_addr realip left inside the trusted set -- a fallback to shared keying, carried
# on the access line as realip_fallback. Inert here, and wider than prod.conf's one address;
# prod.conf carries what the mark means.
geo $realip_fallback {
    default          0;
    173.245.48.0/20  1;
    103.21.244.0/22  1;
    103.22.200.0/22  1;
    103.31.4.0/22    1;
    141.101.64.0/18  1;
    108.162.192.0/18 1;
    190.93.240.0/20  1;
    188.114.96.0/20  1;
    197.234.240.0/22 1;
    198.41.128.0/17  1;
    162.158.0.0/15   1;
    104.16.0.0/13    1;
    104.24.0.0/14    1;
    172.64.0.0/13    1;
    131.0.72.0/22    1;
    2400:cb00::/32   1;
    2606:4700::/32   1;
    2803:f800::/32   1;
    2405:b500::/32   1;
    2405:8100::/32   1;
    2a06:98c0::/29   1;
    2c0f:f248::/32   1;
}

include /etc/nginx/shared/http.conf;

# Catch-all for unknown hosts: without it the block below is the default and any Host header reaches
# Next. There is no TLS here, so 421 on port 80 is the refusal `nginx/prod.conf` spells as a
# rejected handshake.
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;
    # Named in every block, for the reason prod.conf carries; the mount under it is this checkout's
    # `.tmp-nginx-log/` (docker-compose.local.yml).
    access_log /var/log/frankfurtleague/nginx/access.log fl_json;
    return 421;
}


server {
    listen 80;
    listen [::]:80;

    server_name localhost 127.0.0.1;

    include /etc/nginx/shared/site.conf;
}
