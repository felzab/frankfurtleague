# OPS · the security headers every response of the application carries, written once. Included at
# nginx/shared/site.conf's server level, again in every location there that declares an add_header
# of its own, which replaces the inherited set rather than extending it (docs/ops/spec.md I2), and
# in nginx/prod.conf's www redirect. Header values only: no other directive belongs here.

add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# The single enforced CSP for the whole app, keeping 'unsafe-inline' on script-src because a
# nonce cannot cover build-time prerendered HTML.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
