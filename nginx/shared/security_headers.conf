# The security headers every response of the application carries, written once: each header's
# add_header and the proxy_hide_header dropping an upstream's copy of it. No other directive belongs
# here, since every block that includes this file takes all of it.

# An upstream's own copy of each is dropped, so a response carries the edge's alone: one Next sent
# too would reach the visitor beside it, a second enforcing CSP among them.
proxy_hide_header Strict-Transport-Security;
proxy_hide_header X-Content-Type-Options;
proxy_hide_header Referrer-Policy;
proxy_hide_header Content-Security-Policy;

# No `preload`, so nobody can submit this domain to the browsers' built-in list: a listing takes
# months to undo. https://hstspreload.org/ advises against it, its benefit minimal beside HSTS.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
# By the page asked for: none on a page a mailed link opens, whose address carries its token.
add_header Referrer-Policy $referrer_policy always;
# The single enforced CSP. 'unsafe-inline' stays on script-src: Next cannot nonce or hash a
# prerendered shell's inline hydration scripts, and react/no-danger stands in. Revisit on
# user-supplied markup, or on Next hashing those scripts. It stays on style-src too, with no nonce
# and no hash: React Aria and next-themes each inject a <style> element at runtime, nonced only from
# a per-request value a prerendered shell cannot carry, its text moving with each release.

# Cloudflare's origin in script-src and frame-src is the bot check's script and widget, which the
# sign-in and both public forms submit nothing without.
# `frame-ancestors 'none'` is the one framing rule: CSP3 has it override X-Frame-Options, which a
# browser enforcing this policy ignores.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self'; frame-src 'self' https://challenges.cloudflare.com; frame-ancestors 'none'; base-uri 'self'; object-src 'none'; form-action 'self';" always;
