# OPS · the body of the one server block that serves the application, shared by both edges. Each
# entry file wraps it in a `server` carrying only what differs: its listen, its names and the
# `$forwarded_proto` it sets, `https` in nginx/prod/prod.conf and `$scheme` in nginx/local/local.conf.

# The edge's per-request record, static assets included. It is the only
# surface that sees a cached page hit — a cached page runs no application code — so this line is
# what makes a trace id on every request true.
access_log /dev/stdout fl_json;

# A request or an answer stalled mid-way holds one of a worker's connections for as long as nginx
# waits, here a quarter of its 60 s default. Each bounds the gap between two reads or writes rather
# than the whole transfer, so a slow mobile upload is unaffected.
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 15s;

# Longer than the connector keeps an idle connection to this origin, 90 s by Cloudflare's default
# (`keepAliveTimeout`, its tunnel's origin parameters): closed here first, a request the connector
# writes onto that connection in the same instant fails rather than reaching a fresh one. Per server
# block, the image's own `nginx.conf` declaring the http level's.
keepalive_timeout 100s;

# Sized for the sign-in library's cookies: a response header set larger than the default buffer
# is a 502 nginx raises before the upstream's own answer is read.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# The frontend's responses go to the browser as Next writes them: a streamed page, the static shell
# ahead of the content Suspense holds back, arrives chunk by chunk, where nginx's default buffering
# would hold the whole body until the render ended. Next's streaming guide says a reverse proxy has to
# disable buffering for exactly this. The sizes above still hold the first part of the response, the
# headers.
proxy_buffering off;

# Next compresses first -- `compress` defaults to true and next.config.ts does not set it, so a
# response reaches nginx already gzipped and `gzip off` here would be a no-op. Keep the origin
# compressing: Cloudflare passes any Content-Encoding through, and its zstd measured larger.
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

# The security headers. `add_header` is inherited only by a level that declares none of its own, so
# every location below that adds a header includes this file again.
include /etc/nginx/shared/security_headers.conf;

# Every 429 this edge answers itself, a zone's and the connection ceiling's alike: a page load is sent
# the page, anything else the sentence (`http.conf :: $edge_refusal_target`). Next hands a server
# action's caller that sentence as the error only under exactly `text/plain`, so never with a
# `charset`, and the frontend reads it as a press that wrote nothing
# (`fl_frontend/src/kit/edgeRefusal.ts :: EDGE_REFUSAL_BODY`). Every location inherits this one, none
# declaring an `error_page` of its own.
error_page 429 = $edge_refusal_target;

proxy_set_header Host $http_host;
# The visitor's address reaches no application, none reading it: Cloudflare hands it on in both
# headers, and nginx passes a header set empty to no one.
proxy_set_header X-Forwarded-For "";
proxy_set_header CF-Connecting-IP "";
# Never the visitor's own: the including server sets it.
proxy_set_header X-Forwarded-Proto $forwarded_proto;
proxy_set_header X-Forwarded-Host $http_host;
# Minted HERE: a client-supplied traceparent is discarded, so nothing a visitor sends can
# impersonate another request's trace in the logs. Carried into any location that declares no
# proxy_set_header, which is every one that reaches application code. The edge logs no span of its
# own, so the parent id is one constant: W3C Trace Context forbids only all zeroes, which both
# applications refuse.
proxy_set_header traceparent "00-$request_id-0000000000000001-01";
# Drops an empty `Next-Action`, which nginx would otherwise pass as sent: Next takes one for a server
# action, and `http.conf`'s action meter cannot tell it from none.
proxy_set_header Next-Action $http_next_action;

# Variables, so each name resolves as nginx serves, not once at load.
# Every `proxy_pass` names one: a literal `http://frontend:3000` anywhere is a server group the
# variable matches first, pinned to its address at load.
set $frontend_upstream frontend:3000;
set $backend_upstream backend:8000;
# A Location kept relative, which the browser completes against the origin it asked: completed here, it
# would carry this hop's own scheme, plain http behind the connector.
absolute_redirect off;

# Each zone is named in EVERY limited location, never once at server level: limit_req is inherited
# only where the level declares none, so a server-level zone would be dropped by each block below
# that names one of its own -- the replace-rather-than-extend rule `add_header` follows too.

# The sign-in's landing, a route handler answering a GET with one redirect, past a session read and a
# backend read each. On the library's own zone, keyed per network on every method, so a landing and the
# library's routes spend one budget rather than two a script could alternate between.
location = /signin/continue {
    limit_req zone=authapi burst=10 nodelay;
    proxy_pass http://$frontend_upstream;
}

# Client-error ingest -- a Next route handler. Rate-limited: it is public and unauthenticated by
# design.
location = /api/client-error {
    limit_req zone=form burst=3 nodelay;
    # The report's three strings hold 4,800 characters at most (`fl_frontend/src/app/api/client-error/
    # route.ts :: ClientErrorReportSchema`), and `JSON.stringify` spells none in more than six bytes, so
    # any report the schema takes is under 29 KB as the browser posts it and nginx's default 1m is
    # headroom for an attacker alone.
    client_max_body_size 32k;
    proxy_pass http://$frontend_upstream;
}

# A typed sign-in code's check, the sign-in library's own route, public and unauthenticated. On the
# library's zone as every path of it is, every method spending it, and its POST on the form zone too:
# the library's alone allows a guesser five times that rate.

# Metered per network here; the per-address bound is the application's, the library's own limiter
# being off.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/auth/sign-in/email-otp {
    limit_req zone=authapi burst=10 nodelay;
    limit_req zone=form burst=3 nodelay;
    # An address and six digits, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The mail provider's delivery webhook, public and unauthenticated, and metered by no zone: its
# events land at once from a handful of the provider's addresses, and a refusal starts a thirty-two
# hour retry schedule that, sustained, gets the endpoint disabled. The signature check is the gate,
# an unsigned flood costing one HMAC over a body this block bounds and reaching no database.

# No source-IP allowlist, although the provider publishes five addresses: a hand-kept provider list
# goes stale, and a stale one here rejects every event in silence, which is the failure this endpoint
# exists to remove.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/mail/delivery {
    # One delivery event is about a kilobyte, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# Every path the sign-in library mounts, on one zone the code check above shares: the four a
# browser's passkey ceremonies call, the sign-out, and the rest, which `fl_frontend/src/core/auth/library.ts ::
# BROWSER_PATHS` answers 404 before a route matches -- upstream work a stranger can spend either way.

# No other exact match splits a path out of it, the code's mail leaving from the sign-in server
# action in process rather than over HTTP: a second budget for a ceremony would be an allowance to
# alternate with.
location /api/auth {
    limit_req zone=authapi burst=10 nodelay;
    # nginx's default 1m, as the library bounds no body: the passkey plugin takes a ceremony's
    # response as any value (`@better-auth/passkey :: verifyPasskeyRegistrationBodySchema`), and a
    # tighter figure here would be a guess at what an authenticator sends.
    proxy_pass http://$frontend_upstream;
}

# One of the two backend paths reachable from the internet, each exact-match so nothing else joins it:
# `docs/ops/spec.md` §3 answers a backend outage behind a green edge by monitoring this from
# outside. Chosen because it needs no key and touches no database. `/api/v0/` is hardcoded here
# -- `docs/ops/spec.md` §4 records the sites a version left behind breaks.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/v0/system/is_live {
    # A cached 200 would report a dead backend as live, which is the failure this route exists
    # to catch -- and Cloudflare's cache rules live outside this repo.
    add_header Cache-Control "no-store" always;
    # Any add_header replaces the inherited set, so the security headers are included again.
    include /etc/nginx/shared/security_headers.conf;

    # No limit_req, unlike the public unauthenticated writes above: a zone would throttle the
    # monitor this route exists for, and a keyless GET touching no database is not what a rate
    # limit protects.
    proxy_pass http://$backend_upstream;
}

# The other: whether the backend reaches its database, 200 where it answers a ping and 503 where it
# does not, for a monitor asking from outside. Its block the liveness probe's, for the same reasons,
# but for the zone: each request is a database round trip a stranger can send, so it spends the
# sign-in library's per-network budget, which a monitor asking from one address no oftener than
# every two seconds never reaches.
location = /api/v0/system/is_ready {
    add_header Cache-Control "no-store" always;
    include /etc/nginx/shared/security_headers.conf;

    limit_req zone=authapi burst=10 nodelay;
    proxy_pass http://$backend_upstream;
}

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location /_next/static/ {
    # A POST here reaches no action on Next 16.3.6 (driven 2026-09-27: a 405 whose render fails as a
    # 500) but costs that render each time; the action zone meters it, and no GET, as everywhere.
    limit_req zone=action burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

# Every page a mailed or shared link opens, its token in the query, metered on every request: no
# page links to one, so a visit is one request, or two where the proxy first moves the token into a
# cookie (`fl_frontend/src/core/mailedLink.ts :: MAILED_LINK_PAGES`), rather than a navigation's fan-out.

# `location /`'s ceiling and action zone restated as `/` declares them, both being declared there and not
# at server level. Never at a higher burst: Next runs a server action by its `Next-Action` header at any
# page's path, so a block raising the action burst raises every action's per-network ceiling
# (`scripts/checks/check_public_routes.py :: loosened`). No proxy_set_header, add_header or
# error_page, each replacing an inherited set: the minted traceparent, the security headers, the edge's
# own 429.

# No error line from any block below: nginx writes every one with the request line whole, query,
# referrer and upstream address with it, and the open-source build has no switch over what a line
# carries, so a failed, slow or restarting frontend, a body past the cap and a body spilled to a
# temporary file would each write a live token. `/dev/null`, since `error_log off` names a file called
# `off` and no level keeps out the critical line a full disk writes. Such a failure stays findable: its
# access line carries the path, the status, both durations and the trace id, and the same outage
# writes its error lines on every other location (`scripts/checks/check_public_routes.py ::
# unlogged_links`).

# A PREFIX, every page under it being a link page, so one added there is metered the day it exists.
# nginx matches the normalised URI, so `//`, `/./` and `%63` spellings land here too.
location /confirm/ {
    error_log /dev/null;
    limit_conn conn 50;
    # Sized for the largest squad a season may set (`fl_backend/app/shared/schemas/bounds.py ::
    # KADER_SIZE_MAX`, 50, `max_kader_size`'s published maximum, which
    # `scripts/checks/check_public_routes.py :: unsized_links` holds these bursts to), every pupil of it
    # behind one school's address in one break: each opens
    # the team's invite, sends its form, opens their own link and sends its answer, a retry each. The
    # invite's open is two requests, the proxy's redirect moving its token into a cookie and then the
    # page, a pupil's own link one, and each send one more, a server action posting to the page it
    # stands on, so N pupils are N x (2 + 1 + 1 + 1) x 2 = 10N requests on one key, every link page's
    # block sharing the zone. At the rate's 30 a minute, passing them within two minutes takes a burst
    # of 10N - 60: 500 - 60 = 440 for fifty.
    limit_req zone=linkpage burst=440 nodelay;
    # `location /`'s action zone, unraised: the same squad's sends are N x 2 x 2 = 4N on the action key,
    # 200 for fifty, which pass at its 60 a minute after its burst of 30 in about three minutes, a send
    # past the burst refused with the edge's 429 and sent again by its pupil. The pupil's registration
    # and confirmation, which share this key with every other action, stay bounded by what the
    # application holds them to: the registration's Turnstile check on every send, and the
    # confirmation's single-use token.
    limit_req zone=action burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The two link pages outside that segment, a team's registration invite and the account deletion
# link, each exact: a prefix would meter on every request any later page whose path merely starts with
# either name. A trailing slash falls to `location /`, where Next answers it with a redirect here.
location = /registrierung {
    error_log /dev/null;
    limit_conn conn 50;
    limit_req zone=linkpage burst=440 nodelay;
    limit_req zone=action burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /erasure {
    error_log /dev/null;
    limit_conn conn 50;
    limit_req zone=linkpage burst=440 nodelay;
    limit_req zone=action burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

location / {
    limit_conn conn 50;
    limit_req zone=action burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The answer to every refused request but a page load, a server action's among them. ASCII, so no
# `charset` is needed to read it; it declares no `add_header`, so the server block's security headers
# reach it.
location @edge_refusal {
    default_type text/plain;
    return 429 "Zu viele Versuche.";
}

# The answer to a refused page load: the site's status card, its warn mark, its title and its way to
# the start page, as `fl_frontend/src/kit/StatusCard.tsx` draws one in the classic frame. Inline, as
# `return` answers every method, where a file a named location serves answers a refused POST 405 with
# nginx's own page. Never `$`, `'` or `#` in it:
# nginx expands the first and ends the string at the second, and the docs gate takes the third for a
# comment.

# `no-referrer`, as every link page withholds it: the URL this answers may carry a mailed link's
# token. The colours are the rebuilt site's, under the names `fl_frontend/src/app/tokens.css` gives
# them, each theme declaring the names that file's block for it declares; `nginx/edge_test.sh ::
# PAGE_PALETTE_READ` holds each value to that file, and the ground and the card each to the element
# that wears it. The mark is Lucide's `triangle-alert`, the kit's `warning` glyph, at the 18 px and the
# stroke `fl_frontend/src/kit/Icon.tsx` gives it. The font is the site's fallback, its own faces living
# at addresses each build changes.
location @edge_refusal_page {
    default_type text/html;
    charset utf-8;
    return 429 '<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Zu viele Aufrufe | Frankfurt League</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
:root {
color-scheme: light dark;
--bg: rgb(234 234 234);
--bg-card: rgb(255 255 255);
--fg: rgb(10 10 10);
--border: rgb(153 153 153);
--brand-solid: rgb(3 63 17);
--on-brand: rgb(255 255 255);
--warn: rgb(134 84 0);
}
@media (prefers-color-scheme: dark) {
:root {
--bg: rgb(3 3 3);
--bg-card: rgb(18 18 18);
--fg: rgb(255 255 255);
--border: rgb(51 51 51);
--warn: rgb(236 174 48);
}
}
body {
margin: 0;
min-height: 100vh;
display: grid;
place-items: center;
padding: 1.5rem;
box-sizing: border-box;
background: var(--bg);
color: var(--fg);
font-family: ui-sans-serif, system-ui, sans-serif;
font-size: 1rem;
line-height: 1.5;
}
main {
display: grid;
justify-items: center;
gap: 1rem;
width: 100%;
max-width: 28rem;
padding: 2rem 1.5rem;
box-sizing: border-box;
background: var(--bg-card);
border: 1px solid var(--border);
border-radius: 0.5rem;
text-align: center;
}
@media (width < 64rem) {
main {
justify-items: stretch;
}
}
.mark {
display: flex;
align-items: center;
justify-content: center;
justify-self: center;
width: 2.5rem;
height: 2.5rem;
border-radius: 50%;
background: color-mix(in oklab, var(--warn) 12%, transparent);
color: var(--warn);
}
.mark svg {
width: 1.125rem;
height: 1.125rem;
}
h1 {
margin: 0;
font-size: 1.5rem;
line-height: 2rem;
font-weight: inherit;
letter-spacing: 0.02em;
text-transform: uppercase;
}
a {
display: inline-flex;
align-items: center;
justify-content: center;
height: 2rem;
padding: 0 0.875rem;
border: 1px solid transparent;
border-radius: 0.5rem;
background: var(--brand-solid);
color: var(--on-brand);
font-size: 0.875rem;
line-height: 1.25rem;
font-weight: 500;
text-decoration: none;
white-space: nowrap;
}
@media (pointer: coarse) {
a {
height: 2.5rem;
}
}
a:focus-visible {
outline: 2px solid var(--fg);
outline-offset: 2px;
}
</style>
</head>
<body>
<main>
<span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" /><path d="M12 9v4" /><path d="M12 17h.01" /></svg></span>
<h1>Zu viele Aufrufe</h1>
<a href="/">Zur Startseite</a>
</main>
</body>
</html>
';
}
