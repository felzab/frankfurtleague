# OPS · the body of the one server block that serves the application, shared by both edges. Each
# entry file wraps it in a `server` carrying only what differs: nginx/prod/prod.conf's listen, TLS
# and name, nginx/local/local.conf's plaintext listen and loopback names.

# The edge's per-request record, static assets included. It is the only
# surface that sees a cached page hit — a cached page runs no application code — so this line is
# what makes a trace id on every request true.
access_log /var/log/frankfurtleague/nginx/access.log fl_json;

client_max_body_size 20M;

# A header or body arriving a byte at a time holds a worker for as long as nginx will wait, and
# the published ports take a connection from anywhere. Each bounds the gap between two reads or
# writes rather than the whole transfer, so a slow mobile upload is unaffected.
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 15s;

# Sized for the sign-in library's cookies: a response header set larger than the default buffer
# is a 502 nginx raises before the upstream's own answer is read.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# The frontend's responses go to the browser as Next writes them: a streamed page, the static shell
# ahead of the content Suspense holds back, arrives chunk by chunk, where nginx's default buffering
# would hold the whole body until the render ended. Next's streaming guide says a reverse proxy has to
# disable buffering for exactly this. The sizes above still hold the first part of the response, the
# headers. The backend's one location below turns it back on.
proxy_buffering off;

# nginx's own default, written out because `fl_frontend/src/core/requestScope.ts :: REQUEST_DEADLINE_MS`
# is sized beneath it: lowered alone, it answers 504 while an admin action runs on.
proxy_read_timeout 60s;

# Next compresses first -- `compress` defaults to true and next.config.ts does not set it, so a
# response reaches nginx already gzipped and `gzip off` here would be a no-op. Keep the origin
# compressing: Cloudflare passes any Content-Encoding through, and its zstd measured larger.
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

# The security headers. `add_header` is inherited only by a level that declares none of its own, so
# every location below that adds a header includes this file again.
include /etc/nginx/shared/security_headers.conf;

# Every 429 this edge answers itself, a zone's and the connection ceiling's alike: Next hands a server
# action's caller its body as the error only under exactly `text/plain`, so never with a `charset`.

# The frontend reads that body as a press that wrote nothing
# (`fl_frontend/src/shared/utils/actionError.ts :: EDGE_REFUSAL_BODY`). Every location inherits this one,
# none declaring an `error_page` of its own. A link page's load is sent to its page instead
# (`http.conf :: $edge_refusal_target`).
error_page 429 = $edge_refusal_target;
# Set by each link page's location alone; empty everywhere else.
set $linkseite "";

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $server_port;
# Minted HERE: a client-supplied traceparent is discarded, so nothing a visitor sends can
# impersonate another request's trace in the logs. Carried into any location that declares no
# proxy_set_header, which is every one that reaches application code.
proxy_set_header traceparent "00-$request_id-$edge_span-01";
# Drops an empty `Next-Action`, which nginx would otherwise pass as sent: Next takes one for a server
# action, and `http.conf`'s action meter cannot tell it from none.
proxy_set_header Next-Action $http_next_action;

# Variables, so each name resolves as nginx serves, not once at load.
# Every `proxy_pass` names one: a literal `http://frontend:3000` anywhere is a server group the
# variable matches first, pinned to its address at load.
set $frontend_upstream frontend:3000;
set $backend_upstream backend:8000;
# `proxy_redirect default`, which a variable `proxy_pass` refuses, maps a Location naming the upstream
# to the visitor's origin; spelled out so a redirect reads as it does with a literal one. The
# backend's location carries its own.
proxy_redirect http://frontend:3000/ /;

# Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).

# Both zones are named in EVERY limited location, never once at server level: limit_req is
# inherited only where the level declares none, so a server-level pair would be dropped whole by
# each block below -- the replace-rather-than-extend rule `add_header` follows too.
location = /signin {
    # A rate limit is the only edge control this block may carry: an interactive challenge in
    # front of it breaks the sign-in server action rather than stopping an attacker.
    limit_req zone=signin burst=3 nodelay;
    limit_req zone=signin48 burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

# Client-error ingest -- a Next route handler. Rate-limited: it is public and unauthenticated by
# design.
location = /api/client-error {
    limit_req zone=clienterr burst=3 nodelay;
    limit_req zone=clienterr48 burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The public application form's two Next route handlers, public and unauthenticated. Neither
# declares a proxy_set_header: one drops the whole inherited set, and with it the minted
# traceparent.
location = /api/bewerbung {
    limit_req zone=bewerbung burst=2 nodelay;
    limit_req zone=bewerbung48 burst=20 nodelay;
    # An unauthenticated write against a fixed-shape payload: three contact slots, a school and
    # two counts, with no array a caller can grow. A few kilobytes of JSON, so the server
    # block's 20M is headroom for an attacker alone. Plainly inherited, unlike the two above.
    client_max_body_size 64k;
    proxy_pass http://$frontend_upstream;
}

# Its own zone rather than the POST-keyed one: this is a GET (see the zones above).
location = /api/bewerbung/kuerzel {
    limit_req zone=kuerzel burst=10 nodelay;
    limit_req zone=kuerzel48 burst=100 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The confirmation link's write, public and unauthenticated. Its own zone pair rather than the
# submission's: a live single-use token gates this one, so the two do not share an abuse case.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/bestaetigung/kontakt {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    # A token, a date and two short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# A typed sign-in code's check, public and unauthenticated. The `confirmation` pair rather than
# `signin`'s: a live single-use code gates this write too, where every allowed request on the
# sign-in zones is a message to a chosen stranger.

# Metered per network here; the per-address bound is the application's.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/signin/code {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    # An address and six digits, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The sign-out, a route handler rather than a server action, so the
# action pair never meters it: metered as the code check is.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/signout {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    # An empty body, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The mail provider's delivery webhook, public and unauthenticated. Its zone pair is sized for a
# machine's burst rather than a visitor's -- see the zones above.

# No source-IP allowlist, although the provider publishes five addresses: nginx/prod/prod.conf's
# own Cloudflare block records that a hand-kept provider list goes stale, and a stale one here
# rejects every event in silence, which is the failure this endpoint exists to remove.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/mail/zustellung {
    limit_req zone=delivery burst=300 nodelay;
    limit_req zone=delivery48 burst=3000 nodelay;
    # One delivery event is about a kilobyte, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The confirmation pair at the contact seat's own burst and NOT the pupil page's forty: the
# referees are a handful of adults on one message each, which is the population that zone's
# recorded reason describes.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/bestaetigung/schiedsrichter {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    # A token, a date and three short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# An address change's one link page, answering the new mailbox's link and the stop of the address
# on file: the confirmation pair rather than spielerlink's squad-sized burst, since each change
# mints one link to each mailbox.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/bestaetigung/adresse {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    # A token and one answer, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The pupil registration's write, public and unauthenticated, on a pair of its own -- see the
# zones above.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/registrierung {
    # Sized for the one traffic shape this exists for: twenty pupils of a squad, from one
    # school's network in one break, each retrying once is forty requests, and `nodelay` refuses
    # everything past the burst at once.
    limit_req zone=registrierung burst=40 nodelay;
    limit_req zone=registrierung48 burst=400 nodelay;
    # A token, two names, an address and three short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# The pupil's confirmation link, public and unauthenticated, on a pair of its own -- see the
# zones above.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/bestaetigung/spieler {
    # Its own zone, never confirmation's: nginx "stores the current number of excessive
    # requests" per key per zone, so this squad-sized burst would spend the counter the contact
    # and referee links read at three.

    # Sized for twenty pupils of one squad, arriving minutes after the same mail and each
    # retrying once; `nodelay` refuses everything past the burst at once.
    limit_req zone=spielerlink burst=40 nodelay;
    limit_req zone=spielerlink48 burst=400 nodelay;
    # A token, a date and two short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# A club's answer to a fixture confirmation link, public and unauthenticated, on a pair of its own --
# see the zones above.

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location = /api/bestaetigung/spiel {
    # Its own zone, never confirmation's: a club's batch here would spend the counter the contact and
    # referee links read at three.

    # Ten: the first pass asks about every fixture up to
    # `fl_backend/app/api/spielbestaetigungen/services.py :: letzter_anfrage_tag` at once, and one school's network
    # may answer three fixtures for each of three seats, plus a retry, inside a minute. `nodelay`
    # refuses past it.
    limit_req zone=spielbestaetigung burst=10 nodelay;
    limit_req zone=spielbestaetigung48 burst=100 nodelay;
    # A token, a date, a time and one short line, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# Each metered path's trailing-slash form misses its exact match for `location /` (measured
# 2026-08-30), which meters server actions alone. Next answers it 308 and no handler runs, so a twin
# changes nothing a visitor sees, metering upstream work alone.

# Proxied rather than answered here, deliberately: a `return 308` at the edge would be nginx
# deciding trailing-slash policy, which is Next's. These blocks meter what they forward and
# nothing else, so the pair stays correct if that policy ever changes.
location = /signin/ {
    limit_req zone=signin burst=3 nodelay;
    limit_req zone=signin48 burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /api/client-error/ {
    limit_req zone=clienterr burst=3 nodelay;
    limit_req zone=clienterr48 burst=30 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /api/bewerbung/ {
    limit_req zone=bewerbung burst=2 nodelay;
    limit_req zone=bewerbung48 burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://$frontend_upstream;
}

location = /api/bewerbung/kuerzel/ {
    limit_req zone=kuerzel burst=10 nodelay;
    limit_req zone=kuerzel48 burst=100 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /api/bestaetigung/kontakt/ {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/signin/code/ {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/signout/ {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/mail/zustellung/ {
    limit_req zone=delivery burst=300 nodelay;
    limit_req zone=delivery48 burst=3000 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/bestaetigung/schiedsrichter/ {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/registrierung/ {
    limit_req zone=registrierung burst=40 nodelay;
    limit_req zone=registrierung48 burst=400 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/bestaetigung/spieler/ {
    limit_req zone=spielerlink burst=40 nodelay;
    limit_req zone=spielerlink48 burst=400 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/bestaetigung/adresse/ {
    limit_req zone=confirmation burst=3 nodelay;
    limit_req zone=confirmation48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

location = /api/bestaetigung/spiel/ {
    limit_req zone=spielbestaetigung burst=10 nodelay;
    limit_req zone=spielbestaetigung48 burst=100 nodelay;
    client_max_body_size 8k;
    proxy_pass http://$frontend_upstream;
}

# Every path the sign-in library mounts, on one zone pair: the four a browser's passkey
# ceremonies call, and the rest, which `fl_frontend/src/core/auth.ts :: BROWSER_PATHS` answers
# 404 before a route matches -- upstream work a stranger can spend either way.

# No exact match splits a path out of it, the mail leaving from the sign-in server action in
# process rather than over HTTP: a second budget here would be an allowance to alternate with.
location /api/auth {
    limit_req zone=authapi burst=10 nodelay;
    limit_req zone=authapi48 burst=100 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The only backend path reachable from the internet, and exact-match so nothing else joins it:
# `docs/ops/spec.md` §3 answers a backend outage behind a green edge by monitoring this from
# outside. Chosen because it needs no key and touches no database. `/api/v0/` is hardcoded here
# -- `docs/ops/spec.md` §4 records the sites a version left behind breaks.

# $proxy_host is the upstream `proxy_pass` names, so the probe presents itself the way the
# frontend's own calls do. A location
# declaring ANY proxy_set_header drops the whole inherited set, so the server block's are
# repeated here in full -- the mechanism `add_header` follows too.
location = /api/v0/system/is_live {
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header traceparent "00-$request_id-$edge_span-01";
    proxy_set_header Next-Action $http_next_action;

    # A cached 200 would report a dead backend as live, which is the failure this route exists
    # to catch -- and Cloudflare's cache rules live outside this repo.
    add_header Cache-Control "no-store" always;
    # Any add_header replaces the inherited set, so the security headers are included again.
    include /etc/nginx/shared/security_headers.conf;

    # No limit_req, unlike the public unauthenticated writes above: a zone would throttle the
    # monitor this route exists for, and a keyless GET touching no database is not what a rate
    # limit protects.
    proxy_pass http://$backend_upstream;
    # nginx's default, restated: nothing the backend answers streams, and buffering keeps a slow
    # client from holding uvicorn's connection open.
    proxy_buffering on;
    # The server block's redirect rewrite names the frontend, so the backend's is its own.
    proxy_redirect http://backend:8000/ /;
}

# No proxy_set_header, or the minted traceparent goes with the whole inherited set.
location /_next/static/ {
    # A POST here reaches no action on Next 16.3.6 (driven 2026-09-27: a 405 whose render fails as a
    # 500) but costs that render each time; the action pair meters it, and no GET, as everywhere.
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;

    # `immutable` only because every URL under here carries a content hash. No `expires max`
    # beside it: that directive sets a Cache-Control of its own, so the two shipped as two
    # header lines disagreeing on max-age -- 315360000 against 31536000 -- and a cache combining
    # them takes the first. One directive, one header.
    add_header Cache-Control "public, max-age=31536000, immutable";

    # `add_header` in a location REPLACES the inherited set rather than adding to it, so the
    # server block's security headers are included again.
    include /etc/nginx/shared/security_headers.conf;
}

# Every page a mailed or shared link opens, its token in the query, metered on every request: no
# page links to one, so a visit is one request rather than a navigation's fan-out.

# `location /`'s ceiling and action pair restated, both being declared there and not at server level.
# No proxy_set_header, add_header or error_page, each replacing an inherited set: the minted
# traceparent, the security headers, the edge's own 429.

# A PREFIX, every page under it being a link page, so one added there is metered the day it exists.
# nginx matches the normalised URI, so `//`, `/./` and `%62` spellings land here too.
location /bestaetigung/ {
    limit_conn conn 50;
    set $linkseite 1;
    # Sixty: twenty pupils behind one school's address open the team's invite and then each their
    # own link, a retry each -- eighty opens over a few minutes, which the burst and its refill pass.
    limit_req zone=linkseite burst=60 nodelay;
    limit_req zone=linkseite48 burst=600 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The two link pages outside that segment, a team's registration invite and the account deletion
# link, each exact with its trailing-slash twin: a prefix would meter on every request any later page
# whose path merely starts with either name.
location = /registrierung {
    limit_conn conn 50;
    set $linkseite 1;
    limit_req zone=linkseite burst=60 nodelay;
    limit_req zone=linkseite48 burst=600 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /registrierung/ {
    limit_conn conn 50;
    set $linkseite 1;
    limit_req zone=linkseite burst=60 nodelay;
    limit_req zone=linkseite48 burst=600 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /loeschung {
    limit_conn conn 50;
    set $linkseite 1;
    limit_req zone=linkseite burst=60 nodelay;
    limit_req zone=linkseite48 burst=600 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /loeschung/ {
    limit_conn conn 50;
    set $linkseite 1;
    limit_req zone=linkseite burst=60 nodelay;
    limit_req zone=linkseite48 burst=600 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The account page, whose POSTs are any signed-in person's to repeat, the address change's start among
# them, on a pair of its own -- see the zones above. Its GETs pass, the key being POST-only.
# `location /`'s ceiling and action pair restated, as at the link pages, and no proxy_set_header,
# add_header or error_page, each replacing an inherited set.
location = /bereich/konto {
    limit_conn conn 50;
    # Ten past the first: a start asked for a fresh sign-in is four presses (the start, the code's send,
    # the holder check, the start again), leaving seven for the consents and passkeys of a person going
    # through the page at once, and one more returns every thirty seconds. A script repeating the start
    # meets the refusal at its twelfth press and then mails once every thirty seconds.
    limit_req zone=account burst=10 nodelay;
    limit_req zone=account48 burst=100 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

location = /bereich/konto/ {
    limit_conn conn 50;
    limit_req zone=account burst=10 nodelay;
    limit_req zone=account48 burst=100 nodelay;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

location / {
    limit_conn conn 50;
    limit_req zone=action burst=30 nodelay;
    limit_req zone=action48 burst=300 nodelay;
    proxy_pass http://$frontend_upstream;
}

# The server's own `error_page 429` answer. ASCII, so no `charset` is needed to read it; it declares no
# `add_header`, so the server block's security headers reach it.
location @edge_refusal {
    default_type text/plain;
    return 429 "Zu viele Versuche in kurzer Zeit. Warte einen Moment und versuche es dann erneut.";
}

# Inline, as a file nginx never loads fails every deploy (`docs/ops/spec.md` §1.3). Never `$`, `'` or
# `#` in it: nginx expands the first and ends the string at the second, and the docs gate takes the
# third for a comment.

# `no-referrer`, as every link page withholds it: the URL this answers carries the link's token. The colours are the
# season scheme's, held to it by `nginx/edge_test.sh :: PAGE_PALETTE_READ`.
location @edge_refusal_seite {
    default_type text/html;
    charset utf-8;
    return 429 '<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<meta name="referrer" content="no-referrer" />
<title>Zu viele Aufrufe | Frankfurt League</title>
<link rel="icon" href="/icon.svg" type="image/svg+xml" />
<style>
:root {
color-scheme: light dark;
--surface: rgb(245 245 245);
--card: rgb(255 255 255);
--text: rgb(82 82 82);
--heading: rgb(10 10 10);
--rule: rgb(212 212 212);
--brand: rgb(33 108 45);
}
@media (prefers-color-scheme: dark) {
:root {
--surface: rgb(18 18 18);
--card: rgb(3 3 3);
--text: rgb(163 163 163);
--heading: rgb(255 255 255);
--rule: rgb(51 51 51);
--brand: rgb(141 191 108);
}
}
body {
margin: 0;
min-height: 100vh;
display: flex;
align-items: center;
justify-content: center;
padding: 24px;
box-sizing: border-box;
