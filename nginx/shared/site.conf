# OPS · the body of the one server block that serves the application, shared by both edges. Each
# entry file wraps it in a `server` carrying only what differs: nginx/prod.conf's listen, TLS and
# name, nginx/local.conf's plaintext listen and loopback names.

# The edge's per-request record, static assets included (docs/logging/spec.md). It is the only
# surface that sees a cached page hit — a cached page runs no application code — so this line is
# what makes a trace id on every request true.
access_log /var/log/frankfurtleague/nginx/access.log fl_json;

client_max_body_size 20M;

# A header or body arriving a byte at a time holds a worker for as long as nginx will wait, and
# the published ports take a connection from anywhere. Each bounds the gap between two reads or
# writes rather than the whole transfer, so a slow mobile upload is unaffected.
client_header_timeout 15s;
client_body_timeout 15s;
send_timeout 15s;

# Sized for the sign-in library's cookies: a response header set larger than the default buffer
# is a 502 nginx raises before the upstream's own answer is read.
proxy_buffer_size 128k;
proxy_buffers 4 256k;
proxy_busy_buffers_size 256k;

# Next compresses first -- `compress` defaults to true and next.config.ts does not set it, so a
# response reaches nginx already gzipped and `gzip off` here would be a no-op. Keep the origin
# compressing: Cloudflare passes any Content-Encoding through, and its zstd measured larger.
gzip on;
gzip_proxied any;
gzip_comp_level 6;
gzip_vary on;
gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;

# The security headers. `add_header` is inherited only by a level that declares none of its own, so
# every location below that adds a header includes this file again (docs/ops/spec.md I2).
include /etc/nginx/shared/security_headers.conf;

proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Port $server_port;
# Minted HERE: a client-supplied traceparent is discarded, so nothing a visitor sends can
# impersonate another request's trace in the logs. Carried into any location that declares no
# proxy_set_header, which is every one that reaches application code (docs/logging/spec.md L7).
proxy_set_header traceparent "00-$request_id-$edge_span-01";
# Cleared at server level: nothing a visitor sends may name the admin a write is attributed to.
# The frontend reaches the backend over the Docker network instead, so the header the session set
# is the only one a write ever carries. Inherited by every location that reaches a write.
proxy_set_header X-FL-Actor "";

# Sign-in: rate-limited POSTs, unrestricted GETs (see the map above).

# Both zones are named in EVERY limited location, never once at server level: limit_req is
# inherited only where the level declares none, so a server-level pair would be dropped whole by
# each block below -- the replace-rather-than-extend rule `docs/ops/spec.md` invariant I2 records
# for add_header.
location = /signin {
    # A rate limit is the only edge control this block may carry: an interactive challenge in
    # front of it breaks the sign-in server action rather than stopping an attacker
    # (`docs/ops/spec.md` I177).
    limit_req zone=signin burst=3 nodelay;
    limit_req zone=signin48 burst=30 nodelay;
    proxy_pass http://frontend:3000;
}

# Client-error ingest -- a Next route handler. Rate-limited: it is public and unauthenticated by
# design (docs/logging/spec.md).
location = /api/client-error {
    limit_req zone=clienterr burst=3 nodelay;
    limit_req zone=clienterr48 burst=30 nodelay;
    proxy_pass http://frontend:3000;
}

# The public application form's two Next route handlers, public and unauthenticated. Neither
# declares a proxy_set_header: one drops the whole inherited set, and with it the minted
# traceparent and the blanked X-FL-Actor (docs/logging/spec.md).
location = /api/bewerbung {
    limit_req zone=bewerbung burst=2 nodelay;
    limit_req zone=bewerbung48 burst=20 nodelay;
    # An unauthenticated write against a fixed-shape payload: three contact slots, a school and
    # two counts, with no array a caller can grow. A few kilobytes of JSON, so the server
    # block's 20M is headroom for an attacker alone. Plainly inherited, unlike the two above.
    client_max_body_size 64k;
    proxy_pass http://frontend:3000;
}

# Its own zone rather than the POST-keyed one: this is a GET (see the zones above).
location = /api/bewerbung/kuerzel {
    limit_req zone=kuerzel burst=10 nodelay;
    limit_req zone=kuerzel48 burst=100 nodelay;
    proxy_pass http://frontend:3000;
}

# The confirmation link's write, public and unauthenticated. Its own zone pair rather than the
# submission's: a live single-use token gates this one, so the two do not share an abuse case.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the
# whole inherited set (docs/logging/spec.md).
location = /api/bestaetigung/kontakt {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    # A token, a date and two short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The sign-in link's completion, public and unauthenticated. The `bestaetigung` pair rather than
# `signin`'s: a live single-use token gates this write too, where every allowed request on the
# sign-in zones is a message to a chosen stranger.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the whole
# inherited set (docs/logging/spec.md).
location = /api/signin/bestaetigen {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    # A token and nothing else, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The mail provider's delivery webhook, public and unauthenticated. Its zone pair is sized for a
# machine's burst rather than a visitor's -- see the zones above.

# No source-IP allowlist, although the provider publishes five addresses: nginx/prod.conf's own
# Cloudflare block records that a hand-kept provider list goes stale, and a stale one here
# rejects every event in silence, which is the failure this endpoint exists to remove.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the whole
# inherited set (docs/logging/spec.md).
location = /api/mail/zustellung {
    limit_req zone=zustellung burst=300 nodelay;
    limit_req zone=zustellung48 burst=3000 nodelay;
    # One delivery event is about a kilobyte, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The bestaetigung pair at the contact seat's own burst and NOT the pupil page's forty: the
# referees are a handful of adults on one message each, which is the population that zone's
# recorded reason describes.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the whole
# inherited set (docs/logging/spec.md).
location = /api/bestaetigung/schiedsrichter {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    # A token, a date and three short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The pupil registration's write, public and unauthenticated, on a pair of its own -- see the
# zones above.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the whole
# inherited set (docs/logging/spec.md).
location = /api/registrierung {
    # Sized for the one traffic shape this exists for: twenty pupils of a squad, from one
    # school's network in one break, each retrying once is forty requests, and `nodelay` refuses
    # everything past the burst at once.
    limit_req zone=registrierung burst=40 nodelay;
    limit_req zone=registrierung48 burst=400 nodelay;
    # A token, two names, an address and three short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The pupil's confirmation link, public and unauthenticated, on a pair of its own -- see the
# zones above.

# No proxy_set_header, or the minted traceparent and the blanked X-FL-Actor go with the whole
# inherited set (docs/logging/spec.md).
location = /api/bestaetigung/spieler {
    # Its own zone, never bestaetigung's: nginx "stores the current number of excessive
    # requests" per key per zone, so this squad-sized burst would spend the counter the contact
    # and referee links read at three.

    # Sized for twenty pupils of one squad, arriving minutes after the same mail and each
    # retrying once; `nodelay` refuses everything past the burst at once.
    limit_req zone=spielerlink burst=40 nodelay;
    limit_req zone=spielerlink48 burst=400 nodelay;
    # A token, a date and two short fields, so 8k is headroom for an attacker alone.
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# The trailing-slash form of each metered path above. Measured 2026-08-30: each one misses its
# exact match and lands on `location /`, which carries no limit_req, so a burst of them reached
# Next unmetered. Next answers every one with a 308 to the canonical path and no handler runs, so
# metering them changes nothing a visitor sees -- what it closes is unmetered upstream work.

# Proxied rather than answered here, deliberately: a `return 308` at the edge would be nginx
# deciding trailing-slash policy, which is Next's. These blocks meter what they forward and
# nothing else, so the pair stays correct if that policy ever changes.
location = /signin/ {
    limit_req zone=signin burst=3 nodelay;
    limit_req zone=signin48 burst=30 nodelay;
    proxy_pass http://frontend:3000;
}

location = /api/client-error/ {
    limit_req zone=clienterr burst=3 nodelay;
    limit_req zone=clienterr48 burst=30 nodelay;
    proxy_pass http://frontend:3000;
}

location = /api/bewerbung/ {
    limit_req zone=bewerbung burst=2 nodelay;
    limit_req zone=bewerbung48 burst=20 nodelay;
    client_max_body_size 64k;
    proxy_pass http://frontend:3000;
}

location = /api/bewerbung/kuerzel/ {
    limit_req zone=kuerzel burst=10 nodelay;
    limit_req zone=kuerzel48 burst=100 nodelay;
    proxy_pass http://frontend:3000;
}

location = /api/bestaetigung/kontakt/ {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

location = /api/signin/bestaetigen/ {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

location = /api/mail/zustellung/ {
    limit_req zone=zustellung burst=300 nodelay;
    limit_req zone=zustellung48 burst=3000 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

location = /api/bestaetigung/schiedsrichter/ {
    limit_req zone=bestaetigung burst=3 nodelay;
    limit_req zone=bestaetigung48 burst=30 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

location = /api/registrierung/ {
    limit_req zone=registrierung burst=40 nodelay;
    limit_req zone=registrierung48 burst=400 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

location = /api/bestaetigung/spieler/ {
    limit_req zone=spielerlink burst=40 nodelay;
    limit_req zone=spielerlink48 burst=400 nodelay;
    client_max_body_size 8k;
    proxy_pass http://frontend:3000;
}

# Every Next route handler under /api/admin — one per page-owned editor's undo. Each
# authorizes itself with the same `getAdminSession()` the server actions use, because
# /admin/:path* does not match these paths.

# A prefix, not one exact block per handler. It names where these paths go rather than deciding
# it -- `location /` reaches the same upstream, so removing this block changes no response. Kept
# because the routing table is what a reader checks, and an unnamed /api path reads as an
# oversight.
location /api/admin/ {
    proxy_pass http://frontend:3000;
}

# Every path the sign-in library mounts, on one zone pair: the four a browser's passkey
# ceremonies call, and the rest, which `fl_frontend/src/core/auth.ts :: BROWSER_PATHS` answers
# 404 before a route matches -- upstream work a stranger can spend either way.

# No exact match splits a path out of it, the mail leaving from the sign-in server action in
# process rather than over HTTP: a second budget here would be an allowance to alternate with.
location /api/auth {
    limit_req zone=authapi burst=10 nodelay;
    limit_req zone=authapi48 burst=100 nodelay;
    proxy_pass http://frontend:3000;
}

# The only backend path reachable from the internet, and exact-match so nothing else joins it:
# `docs/ops/spec.md` §3 answers a backend outage behind a green edge by monitoring this from
# outside. Chosen because it needs no key and touches no database. `/api/v0/` is hardcoded here
# -- `docs/ops/spec.md` §4 records the sites a version left behind breaks.

# $proxy_host is the upstream `proxy_pass` names, so the probe presents itself the way the
# frontend's own calls do and `api_trusted_hosts` needs no public name in it. A location
# declaring ANY proxy_set_header drops the whole inherited set, so the server block's are
# repeated here in full -- the mechanism `docs/ops/spec.md` invariant I2 records for add_header.
location = /api/v0/system/is_live {
    proxy_set_header Host $proxy_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_set_header traceparent "00-$request_id-$edge_span-01";
    proxy_set_header X-FL-Actor "";

    # A cached 200 would report a dead backend as live, which is the failure this route exists
    # to catch -- and Cloudflare's cache rules live outside this repo.
    add_header Cache-Control "no-store" always;
    # Any add_header replaces the inherited set, so the security headers are included again
    # (`docs/ops/spec.md` I2).
    include /etc/nginx/shared/security_headers.conf;

    # No limit_req, unlike the public unauthenticated writes above: a zone would throttle the
    # monitor this route exists for, and a keyless GET touching no database is not what a rate
    # limit protects.
    proxy_pass http://backend:8000;
}

location /_next/static/ {
    proxy_pass http://frontend:3000;
    proxy_set_header Host $http_host;

    # `immutable` only because every URL under here carries a content hash. No `expires max`
    # beside it: that directive sets a Cache-Control of its own, so the two shipped as two
    # header lines disagreeing on max-age -- 315360000 against 31536000 -- and a cache combining
    # them takes the first. One directive, one header.
    add_header Cache-Control "public, max-age=31536000, immutable";

    # `add_header` in a location REPLACES the inherited set rather than adding to it, so the
    # server block's security headers are included again (docs/ops/spec.md, invariant I2).
    include /etc/nginx/shared/security_headers.conf;
}

location / {
    limit_conn conn 50;
    proxy_pass http://frontend:3000;
}
