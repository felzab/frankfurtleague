# OPS · the http-level half both edges share: the resolver, the trusted connector, the network keys,
# the rate and connection zones and the access-line format. Included by nginx/prod/prod.conf and nginx/local/local.conf, which add no http-level directive
# of their own.

# Off for every server block either file declares, catch-alls and redirects included.
server_tokens off;

# Docker's embedded DNS, the one resolver that finds `frontend` and `backend` on the stacks' networks.

# `valid` bounds how long a worker proxies to an address a recreated container gave up: nginx holds
# an answer for its TTL otherwise.
resolver 127.0.0.11 valid=10s;
# A stalled lookup answers its request 502 after five seconds rather than nginx's default thirty.
resolver_timeout 5s;

# Behind the tunnel the connecting address is the connector, so every limit_req zone below would
# key every visitor to that one address -- one submission would exhaust the limit for all of them.

# One entry rather than Cloudflare's published ranges: `docker-compose.yml` publishes no port and
# gives the connector a static address, so nothing else reaches this origin, and those ranges are
# every customer's egress rather than this account's.
set_real_ip_from 172.30.0.250;

# Cloudflare's own recommendation over X-Forwarded-For, and the format is the reason: it carries
# exactly one address, where X-Forwarded-For is a chain whose left-hand entries the client
# wrote.
real_ip_header CF-Connecting-IP;
# A comma chain in CF-Connecting-IP is parsed like any other header, and off takes the last
# element. Declared rather than inherited: a chained value's safety rests on this default.
real_ip_recursive off;

# Recovery can fall back silently: where CF-Connecting-IP is absent or does not parse, realip
# leaves the connector's address in $remote_addr and every zone below collapses to one bucket for
# the whole site.

# A whole IPv6 address is worthless as a rate-limit key: a /64 is the smallest block anyone is
# allocated, so keying the /128 lets one customer walk every zone below using addresses they
# already hold. IPv4 has no such room and keys whole.

# nginx compresses the longest run of two or more zero groups, and where that run falls depends on
# the HOST bits, so one /64 can render two ways. Every shape is enumerated: a missed one splits a
# /64 into two buckets and doubles its allowance.

# The three anchored branches cover a `::` with five or six groups after it, where the tail reaches
# back into the prefix. Without them a /64 whose middle groups are zero splits.
map $remote_addr $client_net {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"  $1;
    "~*^([0-9a-f]+)::([0-9a-f]+)(?::[0-9a-f]+){4}$"        "$1:0:0:$2";
    "~*^::([0-9a-f]+):([0-9a-f]+)(?::[0-9a-f]+){4}$"       "0:0:$1:$2";
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){4}$"                   "0:0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                 "$1:0";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0:0";
    "~*^::"                                                "0:0:0:0";
    default                                                $remote_addr;
}

# A /64 is the smallest block anyone is ALLOCATED, but RFC 6177 and RIPE-690 put a residential
# customer at a /56 or a /48, so one subscriber holds up to 65,536 /64s and can walk a zone keyed on
# one. This wider key bounds that walk; both zones apply to every limited location below.

# Three WHOLE groups, because a /56 cannot be taken from these strings at all: nginx prints a group
# without leading zeros, so a character position stops tracking a bit position: 0034 and 00ff share
# a /56 yet print "34" and "ff", while 3400 -- a different /56 -- prints "3400", starting "34" too.

# The anchored branch covers a `::` with exactly six groups after it, the one shape whose third group
# survives the compression. Fewer groups put a zero there, which the trailing branch already answers.
map $remote_addr $client_net48 {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"            $1;
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){5}$"                   "0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0";
    "~*^::"                                                "0:0:0";
    default                                                $remote_addr;
}

# Rate limiting for the sign-in action. handleSignIn is a public, unauthenticated outbound-email
# trigger: its action id ships in a client chunk on /signin, so anyone can POST it. An empty key is
# exempt from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $client_net;
    default "";
}
# The wide key needs the same POST-only shape, and a map cannot take two source variables.
map $request_method $signin_limit_key48 {
    POST    $client_net48;
    default "";
}

# Every zone below is paired: the narrow one keeps ordinary visitors apart, the wide one caps the
# walk across a subscriber's own /64s. Ten times the rate and the burst, so the wide zone never
# decides a lone visitor's request and a walk meets a ceiling ten times its twin, not 65,536.

# Held apart per endpoint rather than pooled: a client-error report and an outbound email cost
# differently, and one shared ceiling would let the cheap traffic spend what guards the expensive.

# 5m against the narrow zones' 10m -- any traffic mix holds fewer /48s than /64s, so the wider key
# needs less room, never more.
limit_req_zone $signin_limit_key   zone=signin:10m      rate=5r/m;
limit_req_zone $signin_limit_key48 zone=signin48:5m     rate=50r/m;
# The client-error ingest is public and unauthenticated too; the same
# POST-only key shape keeps it from becoming a log-flooding vector.
limit_req_zone $signin_limit_key   zone=clienterr:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=clienterr48:5m  rate=60r/m;
# A typed sign-in code's check, rated above `signin` because a live single-use code gates it rather
# than an open form, and a mistyped code is worth a second try.
limit_req_zone $signin_limit_key   zone=confirmation:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=confirmation48:5m  rate=60r/m;
# Every action under /api/auth, keyed on the network maps rather than the POST map: this prefix
# carries GETs, and the method map gives a GET an empty key, which is exempt from limit_req entirely.
# Keyed there it would read as limited and be unlimited, with nothing to say so.
limit_req_zone $client_net         zone=authapi:10m     rate=30r/m;
limit_req_zone $client_net48       zone=authapi48:5m    rate=300r/m;
# Every page a mailed or shared link opens: each request renders a page reading the database, the
# work this pair prices, is the proxy's redirect into one, which nginx cannot tell from it
# (`fl_frontend/src/core/mailedLink.ts`), or is the page's own form sent as a server action, which
# writes. Keyed on the network maps for the reason above, so no method escapes.
limit_req_zone $client_net         zone=linkpage:10m    rate=30r/m;
limit_req_zone $client_net48       zone=linkpage48:5m   rate=300r/m;
# The mail provider's delivery webhook: the only zone here sized for a MACHINE. A season's messages
# produce their events at once, from a handful of the provider's addresses, so they land on one key.

# A limit that bites is no refusal here: a 429 starts a thirty-two hour retry schedule and,
# sustained, gets the endpoint disabled. The signature check is the real gate, an unsigned flood
# costing one HMAC and reaching no database.
limit_req_zone $signin_limit_key   zone=delivery:10m  rate=300r/m;
limit_req_zone $signin_limit_key48 zone=delivery48:5m rate=3000r/m;

# Next 16.4.2 runs a POST as a server action on its `Next-Action` header or on either form content
# type (`next/dist/server/lib/server-action-request-meta.js`), at any path. Every other request's key
# is empty: this pair meters no page load, asset or JSON post.

# The header reduced to whether it carries anything before it joins the key: a visitor's value spelled
# into a `:`-separated string could open with the separator and read as no header. An empty one never
# reaches Next (`site.conf`).
map $http_next_action $next_action_sent {
    ""      0;
    default 1;
}
map "$request_method:$next_action_sent:$content_type" $action_limit_key {
    "~^POST:1:"                                                            $client_net;
    "~*^POST:0:(multipart/form-data|application/x-www-form-urlencoded)"    $client_net;
    default                                                                "";
}
map "$request_method:$next_action_sent:$content_type" $action_limit_key48 {
    "~^POST:1:"                                                            $client_net48;
    "~*^POST:0:(multipart/form-data|application/x-www-form-urlencoded)"    $client_net48;
    default                                                                "";
}
# Rated above any administrator's run of saves, every write here being an action: the application's
# own caps bound the sign-in's mail, and this pair how fast one network spends them.
limit_req_zone $action_limit_key   zone=action:10m   rate=60r/m;
limit_req_zone $action_limit_key48 zone=action48:5m  rate=600r/m;
limit_req_status 429;

# Where `site.conf`'s `error_page 429` sends a refusal: a link page's load to the page, since a bare
# sentence opened from a mail is a dead end; anything else, a server action posting there among it,
# to the sentence Next compares.
map "$link_page:$request_method" $edge_refusal_target {
    "1:GET"  @edge_refusal_page;
    "1:HEAD" @edge_refusal_page;
    default  @edge_refusal;
}
# Below the error log's own level, which is what keeps a refusal's record out of it: that log
# repeats the request line and the referer whole, and no map reaches it (`docs/ops/spec.md` §1.3).
limit_req_log_level info;

# `location /` carries every page no other location names, as `/signin` and the link pages are; only
# its server actions meet a rate zone, one keyed on every request stalling page loads. A connection
# ceiling bounds the page flood.

# Sized for HTTP/2, where nginx counts each CONCURRENT REQUEST as a connection, so one navigation
# spends many at once. Behind a single connector, whose sockets no visitor controls, it is a
# backstop rather than a per-visitor control.

# Keyed on the narrow net alone, deliberately: the zones above pair because a RATE is a budget spent
# over time, which a walk across a subscriber's /64s multiplies. Concurrency is instantaneous and
# bounded by the attacker's own sockets, so a /48 twin would have to clear what 256 households draw
# at once under that accounting -- high enough to cap nothing.
limit_conn_zone $client_net zone=conn:5m;
# Matching limit_req_status, so one access line's `status` means the same thing whichever refused.
limit_conn_status 429;
# Lowered for the reason the rate zones' own level is: a link page past this ceiling would write
# its live token to the error log (`docs/ops/spec.md` §1.3).
limit_conn_log_level info;

# One JSON document per access line, in the application logs' envelope. `trace_id` is nginx's
# $request_id, handed upstream in the traceparent wherever a location inherits `site.conf`'s header
# set, so this line joins the application's.

# `path` is $uri, the path alone: a mailed link carries its credential in the query (`?token=`),
# which no field here writes. $uri is decoded, so a query a visitor spells into the path itself
# (`%3Ftoken%3D`) is written as typed; no link this site mints spells one.

# escape=json keeps an attacker-controlled value (the user agent, the path) from breaking the
# document. Durations are nginx-native seconds. $remote_addr is the visitor rather than the
# Cloudflare edge: realip above replaces it before this line is written.
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"trace_id":"$request_id","message":"$request_method $uri -> $status",'
    '"method":"$request_method","path":"$uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","user_agent":"$http_user_agent"}';

# Cancels the image's own http-level access log, which a block declaring no `access_log` would
# inherit, writing the whole request line, query and referer included, in the image's own format. A
# path here would run beside that one rather than replace it, so each server block names its own,
# on stdout in the format above. The error log is the image's, on stderr at `notice`.
access_log off;
