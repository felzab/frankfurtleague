# OPS · the http-level half both edges share: the network keys, the rate and connection zones, the
# credential redaction, the access-line format and where the logs go. Included by
# nginx/prod/prod.conf and nginx/local/local.conf after each sets its own trusted address set,
# which is the one http-level difference between them.

# Off for every server block either file declares, catch-alls and redirects included.
server_tokens off;

# A whole IPv6 address is worthless as a rate-limit key: a /64 is the smallest block anyone is
# allocated, so keying the /128 lets one customer walk every zone below using addresses they
# already hold. IPv4 has no such room and keys whole.

# nginx compresses the longest run of two or more zero groups, and where that run falls depends on
# the HOST bits, so one /64 can render two ways. Every shape is enumerated: a missed one splits a
# /64 into two buckets and doubles its allowance.

# The three anchored branches cover a `::` with five or six groups after it, where the tail reaches
# back into the prefix. Without them a /64 whose middle groups are zero splits.
map $remote_addr $client_net {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"  $1;
    "~*^([0-9a-f]+)::([0-9a-f]+)(?::[0-9a-f]+){4}$"        "$1:0:0:$2";
    "~*^::([0-9a-f]+):([0-9a-f]+)(?::[0-9a-f]+){4}$"       "0:0:$1:$2";
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){4}$"                   "0:0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)::"                 "$1:0";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0:0";
    "~*^::"                                                "0:0:0:0";
    default                                                $remote_addr;
}

# A /64 is the smallest block anyone is ALLOCATED, but RFC 6177 and RIPE-690 put a residential
# customer at a /56 or a /48, so one subscriber holds up to 65,536 /64s and can walk a zone keyed on
# one. This wider key bounds that walk; both zones apply to every limited location below.

# Three WHOLE groups, because a /56 cannot be taken from these strings at all: nginx prints a group
# without leading zeros, so a character position stops tracking a bit position: 0034 and 00ff share
# a /56 yet print "34" and "ff", while 3400 -- a different /56 -- prints "3400", starting "34" too.

# The anchored branch covers a `::` with exactly six groups after it, the one shape whose third group
# survives the compression. Fewer groups put a zero there, which the trailing branch already answers.
map $remote_addr $client_net48 {
    "~^((?:\d{1,3}\.){3}\d{1,3})$"                         $1;
    "~*^([0-9a-f]+:[0-9a-f]+:[0-9a-f]+)(?::|$)"            $1;
    "~*^::([0-9a-f]+)(?::[0-9a-f]+){5}$"                   "0:0:$1";
    "~*^([0-9a-f]+:[0-9a-f]+)::"                           "$1:0";
    "~*^([0-9a-f]+)::"                                     "$1:0:0";
    "~*^::"                                                "0:0:0";
    default                                                $remote_addr;
}

# Rate limiting for the sign-in action. handleSignIn is a public, unauthenticated outbound-email
# trigger: its action id ships in a client chunk on /signin, so anyone can POST it. An empty key is
# exempt from limit_req, so only POST is limited -- GET /signin stays unrestricted.
map $request_method $signin_limit_key {
    POST    $client_net;
    default "";
}
# The wide key needs the same POST-only shape, and a map cannot take two source variables.
map $request_method $signin_limit_key48 {
    POST    $client_net48;
    default "";
}

# Every zone below is paired: the narrow one keeps ordinary visitors apart, the wide one caps the
# walk across a subscriber's own /64s. Ten times the rate and the burst, so the wide zone never
# decides a lone visitor's request and a walk meets a ceiling ten times its twin, not 65,536 --
# bewerbung48 excepted, which sits lower for the reason recorded at its own line.

# Held apart per endpoint rather than pooled: a Kürzel keystroke and an outbound email cost
# differently, and one shared ceiling would let the cheap traffic spend what guards the expensive.

# 5m against the narrow zones' 10m -- any traffic mix holds fewer /48s than /64s, so the wider key
# needs less room, never more.
limit_req_zone $signin_limit_key   zone=signin:10m      rate=5r/m;
limit_req_zone $signin_limit_key48 zone=signin48:5m     rate=50r/m;
# The client-error ingest is public and unauthenticated too (docs/logging/spec.md); the same
# POST-only key shape keeps it from becoming a log-flooding vector.
limit_req_zone $signin_limit_key   zone=clienterr:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=clienterr48:5m  rate=60r/m;
# The public application form's submission is the same shape again: public, unauthenticated, and
# POST-keyed through the map for the reason above. Its rate is the lowest here because the handler
# mails an address the REQUEST supplied, so every allowed request is a message to a chosen stranger.

# bewerbung48 breaks the ten-times rule deliberately. Around 1025 applications in one season leave the
# admin triage read answering short, and 6r/m puts that flood roughly three hours out of one allocation
# rather than fifty minutes. It raises the price and repairs nothing: the read itself caps at
# LIST_LIMIT_DEFAULT and reports the answer partial, with saison_id and status the way back to the
# rest. What this risks is a school behind one /48 signing up as a class.
limit_req_zone $signin_limit_key   zone=bewerbung:10m   rate=2r/m;
limit_req_zone $signin_limit_key48 zone=bewerbung48:5m  rate=6r/m;
# The confirmation link's write, rated above the submission because a live single-use token gates
# it rather than an open form, and three contacts of one school behind one /64 must all get
# through inside a minute.
limit_req_zone $signin_limit_key   zone=bestaetigung:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=bestaetigung48:5m  rate=60r/m;
# The pupil registration's own pair, POST-keyed for the reason above. Rated against bestaetigung
# rather than bewerbung: this write mails an address the request supplied, but only a live invite
# an administrator minted reaches it.
limit_req_zone $signin_limit_key   zone=registrierung:10m   rate=6r/m;

# Ten times the rate, which is this file's own rule for a wide zone.
limit_req_zone $signin_limit_key48 zone=registrierung48:5m  rate=60r/m;
# The pupil's confirmation link, rated with bestaetigung because the question is the same: a live
# single-use token gates it. Its own pair rather than that zone, for the reason at its location.
limit_req_zone $signin_limit_key   zone=spielerlink:10m   rate=6r/m;
limit_req_zone $signin_limit_key48 zone=spielerlink48:5m  rate=60r/m;
# The Kürzel check is a GET, and the method map gives a GET an empty key -- which is exempt from
# limit_req entirely. Keyed there it would read as limited and be unlimited, with nothing to say so,
# hence an unconditional key of its own.
limit_req_zone $client_net         zone=kuerzel:10m     rate=30r/m;
limit_req_zone $client_net48       zone=kuerzel48:5m    rate=300r/m;
# Every action under /api/auth, keyed on the network maps rather than the POST map for the Kürzel
# check's reason above: this prefix carries GETs, which a POST map would exempt.
limit_req_zone $client_net         zone=authapi:10m     rate=30r/m;
limit_req_zone $client_net48       zone=authapi48:5m    rate=300r/m;
# The mail provider's delivery webhook: the only zone here sized for a MACHINE. A season's messages
# produce their events at once, from a handful of the provider's addresses, so they land on one key.

# A limit that bites is no refusal here: a 429 starts a thirty-two hour retry schedule and,
# sustained, gets the endpoint disabled. The signature check is the real gate, an unsigned flood
# costing one HMAC and reaching no database.
limit_req_zone $signin_limit_key   zone=zustellung:10m  rate=300r/m;
limit_req_zone $signin_limit_key48 zone=zustellung48:5m rate=3000r/m;
limit_req_status 429;
# Below the error log's own level, which is what keeps a refusal's record out of it: that log
# repeats the request line and the referer whole, and no map reaches it (`docs/ops/spec.md` §1.3).
limit_req_log_level info;

# `location /` carries every page and every server action and no limit_req can reach it -- a zone
# there would also meter /_next/static and stall an ordinary page load. A connection ceiling bounds
# the same flood without metering anything.

# Sized for HTTP/2, where nginx counts each CONCURRENT REQUEST as a connection, so one navigation
# spends many at once. Behind a single connector, whose sockets no visitor controls, it is a
# backstop rather than a per-visitor control.

# Keyed on the narrow net alone, deliberately: the zones above pair because a RATE is a budget spent
# over time, which a walk across a subscriber's /64s multiplies. Concurrency is instantaneous and
# bounded by the attacker's own sockets, so a /48 twin would have to clear what 256 households draw
# at once under that accounting -- high enough to cap nothing.
limit_conn_zone $client_net zone=conn:5m;
# Matching limit_req_status, so one access line's `status` means the same thing whichever refused.
limit_conn_status 429;
# Lowered for the reason the rate zones' own level is, and it is this ceiling that stands over
# /signin/bestaetigen?token= -- a page, so `location /` carries it (`docs/ops/spec.md` §1.3).
limit_conn_log_level info;

# A sign-in link is a bearer credential in a query string: the mail carries
# /signin/bestaetigen?token=, so $request_uri would write a live token to this log, and to
# Cloudflare's.

# Every page a mailed link opens is served by `location /` rather than an exact block, so the
# PARAMETER is what has to be caught here: a path spelling normalises and a parameter name does not.

# `[?&]`, not `&`: a parameter can follow a second literal `?`, which a value like
# callbackURL=/x?token= puts there, and an `&`-only separator class walks straight past it.

# The second arm is the backstop for a raw URI holding no literal `?` at all -- %3F, %3D -- where
# there is nothing to split the path from the query at, so the line goes whole. It over-redacts any
# such URI carrying `token=`, which no route of this app mints; that is the safe direction.

# $request_uri is never decoded, so a percent-encoded parameter NAME (%74oken=) defeats both arms.

# Accepted: every module minting a link writes `token=` literally, so no spelling this misses
# carries a credential of ours. Each minter's own test pins that spelling; nothing enumerates the
# minters, so one joining them is held by review.
map $request_uri $credential_free_uri {
    "~*^([^?]*)\?(.*[?&])?(token|email)="  "$1?[redacted]";
    "~*(token|email)(=|%3d)"               "[redacted]";
    default                                $request_uri;
}

# Replaced whole rather than by parameter name, which %74oken= defeats above. Kept on the sign-in
# library's own verification route: this application answers it 404
# (`fl_frontend/src/core/auth.ts :: DISABLED_PATHS`) and a stranger still presents a token to it.

# Keyed on $uri, the DECODED and normalised path nginx routes on, so //api/auth/..., /%61pi/auth/...
# and /api/./auth/... are all caught; case-insensitive, a path's case being the client's.

# Emits a literal, never $uri: a %3F in the path decodes to a `?` and puts the query string back
# inside $uri (`docs/logging/spec.md` L11).
map $uri $logged_uri {
    "~*^/api/auth/magic-link/verify"  "/api/auth/magic-link/verify?[redacted]";
    default                           $credential_free_uri;
}

# Referrer-Policy: strict-origin-when-cross-origin sends the WHOLE URL on a same-origin navigation,
# so this field carries a sign-in query as readily as the request line does.

# No parameter-position test, unlike the request line above: this field is replaced WHOLE either
# way, so demanding a literal `?` buys no operational detail and only adds spellings to miss -- a
# referer of /x%3Ftoken%3D..., or one naming the parameter in its path, passed through entire.
map $http_referer $logged_referer {
    "~*(token|email)(=|%3d)"  "[redacted]";
    default                   $http_referer;
}

# The edge's span is its request id's first sixteen hex: no second random source. No default:
# $request_id is documented as sixteen random hex bytes; a shape it cannot take leaves the header
# malformed, which every hop replaces (docs/logging/spec.md L3).
map $request_id $edge_span {
    "~^(?<edge_span_hex>[0-9a-f]{16})"  $edge_span_hex;
}

# One JSON document per access line, field-compatible with the application logs
# (docs/logging/spec.md). `trace_id` is nginx's $request_id, handed upstream in the traceparent
# wherever a location inherits the header set below, so this line joins the application's;
# `span_id` is this hop's.

# escape=json keeps an attacker-controlled value (user agent, referer) from breaking the document.
# Durations are nginx-native seconds.

# $remote_addr is the visitor rather than the Cloudflare edge -- realip above replaces it before
# this line is written -- while `x_forwarded_for` stays the header exactly as it arrived.
log_format fl_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","service":"nginx",'
    '"trace_id":"$request_id","span_id":"$edge_span","message":"$request_method $logged_uri -> $status",'
    '"method":"$request_method","path":"$logged_uri","status":$status,'
    '"duration_s":$request_time,"upstream_duration_s":"$upstream_response_time",'
    '"bytes":$body_bytes_sent,"client":"$remote_addr","realip_fallback":$realip_fallback,'
    '"x_forwarded_for":"$http_x_forwarded_for","host":"$http_host","referer":"$logged_referer",'
    '"user_agent":"$http_user_agent"}';

# Cancels the image's own http-level access log, which is stdout: Docker's size-bounded stream,
# where a block declaring none of its own would name visitors. A path here adds a log beside that
# one rather than replacing it.
access_log off;

# Every line about a connection or a request names its client, so this level's error log sits beside
# the access log under the host's eight-day rotation (docs/ops/runbooks.md §7), at the image's own
# `notice`. stderr keeps the master's lines alone.
error_log /var/log/frankfurtleague/nginx/error.log notice;
