# The repository's Python rules, applied to the gate's own tooling by `extend` rather than a copy. It
# adds and overrides nothing: a `select` of its own would let this configuration and the backend's
# disagree. No `target-version` either: `extend` carries the backend's `requires-python` across, the
# version the gate's Python runs on.

extend = "../fl_backend/pyproject.toml"
