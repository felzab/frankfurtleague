# The repository's Python rules, applied to the gate's own tooling by `extend` rather than a copy. A
# `select` of its own would let this configuration and the backend's disagree, so it narrows one table
# alone, the banned list. No `target-version` either: `extend` carries the backend's `requires-python`
# across, the version the gate's Python runs on.

extend = "../fl_backend/pyproject.toml"

# Every name the backend bans guards the backend alone, and the gate's tooling reads its own environment by
# design. A child's own `banned-api` replaces the parent's whole table, so an empty one lifts every ban.
[lint.flake8-tidy-imports]
banned-api = {}
