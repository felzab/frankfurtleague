# The repository's Python rules, applied to the gate's own tooling by `extend` rather than a copy. A
# `select` of its own would let this configuration and the backend's disagree, so it narrows one table
# alone, the banned list. No `target-version` either: `extend` carries the backend's `requires-python`
# across, the version the gate's Python runs on.

extend = "../fl_backend/pyproject.toml"

# Every name the backend bans guards the backend alone, and the gate's tooling reads its own environment by
# design. A child's own `banned-api` replaces the parent's whole table, so this list is the folder's alone,
# and the one file that builds argparse's parser on purpose is exempt from it.
[lint]
per-file-ignores = { "lib/checker_kernel.py" = ["TID251"] }

# argparse answers a usage error with 2, which the exit contract reads as a refusal of the input, where only
# this repository's scripts call a checker and a wrong argument is theirs. Every spelling of the name, an
# import of it included.
[lint.flake8-tidy-imports.banned-api]
"argparse.ArgumentParser".msg = "Parse a checker's arguments with `checker_kernel.ArgumentParser`, which answers a usage error of ours as a crash."
