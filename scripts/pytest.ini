# pytest's configuration for scripts/tests, found above the path a run names. No case here is async,
# so pytest-asyncio, which the backend's virtualenv carries for its own suites, is switched off.
# `--dist loadfile` keeps each file on one xdist worker wherever a run passes -n: a module's fixtures
# and the trees it parses once stay with its cases. Without -n it changes nothing.
[pytest]
addopts = -p no:asyncio --dist loadfile
