# OPS · production stack
#
# One host behind a Cloudflare tunnel: the connector and nginx in front, the Next.js frontend and
# the FastAPI backend behind them. Pulls published images and never builds -- `deploy.sh` enforces
# that, because a server that builds is a server that can fail a build with the site down.
#
# Invariants:
# - The host publishes NOTHING. Every service is reachable only over the stack's own networks, the
#   connector included, so anything nginx does not route does not exist for the internet. A
#   `ports:` entry anywhere removes that silently (`docs/ops/spec.md :: I1`).
# - One package per service; the two images are never merged into one (`.claude/CLAUDE.md` §7, images).
# - The base of the local stack too: `./scripts/ops/local.sh` merges docker-compose.local.yml over
#   this file, so a setting here reaches both stacks and a difference exists only where that file
#   writes one. No database service, here or ever (`docs/ops/spec.md :: I174`).
#
# See:
# - docs/ops/spec.md -- the service table and invariants

# Capped so a chatty container cannot fill the server's disk: 30 MB per service, worst case.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    # The package's file alone, the one the deploy's readers judge as the container is handed it
    # (`scripts/checks/check_compose_model.py :: env_files`).
    env_file: ./fl_frontend/.env
    # A moving tag, on each package's image below: `publish.yml` re-points it at every publish, so
    # `deploy.sh` with no argument means the newest published image. A rollback pins the immutable
    # `:sha-<commit>` instead. Both packages are public, so neither pull needs credentials.
    image: ghcr.io/felzab/frankfurtleague-frontend:latest
    restart: unless-stopped
    # Past a request's bound and the work behind its answer, both of which Next's server waits out on a
    # stop: killed sooner, a write or a mail already sent answers as a dropped connection
    # (`docs/ops/spec.md :: I547`).
    stop_grace_period: 61s
    # The signing key is this service's alone: a holder of it mints any actor the backend trusts
    # (`docs/ops/spec.md :: I472`).
    secrets:
      - fl_actor_signing_key
      - frontend_mongodb_uri
      - auth_secret
      - auth_resend_key
      - resend_webhook_secret
      - internal_api_key_base
      - internal_api_key_system
      - internal_api_key_admin
      - turnstile_secret_key
    # The group owning the three internal keys, which the backend's user reads too: compose hands a
    # file secret over with the host file's owner and mode and ignores `uid`, `gid` and `mode`
    # (`docs/ops/spec.md` §1.2).
    group_add:
      - "1003"
    networks:
      - frankfurtleague-app
    logging: *default-logging
    # The container needs no elevated capability at any point: it serves HTTP as a non-root user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # A static asset, not a page: the server answers without rendering a route or touching the
      # backend. The image's own Node sends the HEAD, because Debian slim ships no wget or curl.
      test:
        ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/favicon.ico',{method:'HEAD'}).then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Next's standalone server needs a moment before it answers; without this the early probes
      # fail and the container is marked unhealthy on a perfectly good start.
      start_period: 20s
      # The probe cadence DURING start_period. Without it the engine's own start-period default
      # applies, measured at 5.2 s against this file's 3.2 s (2026-08-11, engine 29.7.2). A deploy
      # leaves nginx up, so that difference is time the edge spends answering 502 rather than
      # proxying, on every deploy.
      # Requires Docker Engine 25 or newer on the host, which is where the healthcheck runs.
      start_interval: 3s
    deploy:
      resources:
        # The frontend renders React on the server, so it is the memory-hungry half. The limit is a
        # blast-radius cap, not a target -- it stops a leak taking the whole host down with it.
        limits:
          cpus: "1.5"
          memory: "2G"
        reservations:
          memory: "512M"

  backend:
    # The frontend's reason.
    env_file: ./fl_backend/.env
    image: ghcr.io/felzab/frankfurtleague-backend:latest
    restart: unless-stopped
    # Past uvicorn's own graceful wait (`fl_backend/Dockerfile :: CMD`), which the engine's 10 s
    # default falls short of: killed sooner, a request still inside its bound sends no abort
    # (`docs/ops/spec.md :: I540`).
    stop_grace_period: 12s
    # The frontend's reason, and its group for the three internal keys.
    secrets:
      - backend_mongodb_uri
      - sperrliste_schluessel
      - internal_api_key_base
      - internal_api_key_system
      - internal_api_key_admin
    group_add:
      - "1003"
    networks:
      - frankfurtleague-app
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # `/system/is_live` is the one probe that needs no key, and it deliberately does not touch
      # MongoDB — a liveness check that needs the database fails for reasons a restart cannot fix.
      # `/system/is_ready` answers that question instead, and is guarded.

      # The API version is hardcoded here and must match
      # `fl_backend/app/core/config.py :: API_VERSION`, which records why it is a constant rather
      # than a setting. `docs/ops/spec.md` §4 records the spellings a bump has to reach.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/system/is_live', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # Same first-probe reason as the frontend's, and the same engine requirement.
      start_interval: 3s
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "512M"
        reservations:
          memory: "128M"

  nginx:
    # Tag and digest (`docs/ops/spec.md` §1.1). The local stack, `nginx/edge_test.sh` and
    # `scripts/gate/verify.sh`'s `nginx -t` read this line.
    image: nginx:1.31.6-alpine@sha256:df221db836e1754089190208cee7eeda94f233197056426eda74a43ab1abeac2
    restart: unless-stopped
    # nginx's Control API, through which `deploy.sh` reloads and reads back the loaded configuration
    # (https://nginx.org/en/docs/switches.html, `-l`, from 1.31.5). A socket, never a port: a port
    # answers on every interface of this network, reloads included.
    command: ["nginx", "-g", "daemon off;", "-l", "unix:/run/nginx-control/control.sock"]
    # A tmpfs: a socket a killed master leaves on disk makes the next start refuse to bind and
    # exit. Mode 700, so no user but root reaches the socket, whatever mode nginx gives it.
    tmpfs:
      - /run/nginx-control:mode=700
    # The config mounts must exist before `up`: Docker mounts a missing directory empty, and nginx
    # then serves none of this stack's edge or refuses its includes. `deploy.sh` checks each file.

    # The access and error logs are host-side so they outlive this container and `logrotate` can
    # bound their age (`docs/ops/runbooks.md` §7). Host and container paths are spelled alike, so
    # the stanza and `nginx/prod/prod.conf` name one string.
    volumes:
      # Directories, never a file: a file mount holds the inode it was created with, and a pull
      # replaces a changed file with a new one, so the reload `deploy.sh` sends would re-read the
      # old file (`docs/ops/spec.md :: I355`).
      - ./nginx/prod:/etc/nginx/conf.d:ro
      # What both edges share, which prod.conf includes by this container path.
      - ./nginx/shared:/etc/nginx/shared:ro
      - ./certs:/etc/nginx/certs:ro
      - /var/log/frankfurtleague/nginx:/var/log/frankfurtleague/nginx
    # The one service on both: it takes the connector's requests on the first and proxies them on
    # the second.
    networks:
      - frankfurtleague-net
      - frankfurtleague-app
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    # Each one added back is one the master, starting as root, fails to start without
    # (`docs/ops/spec.md` §1.1). No NET_BIND_SERVICE: Docker lets every user bind below 1024.
    cap_drop:
      - ALL
    cap_add:
      # Handing the workers its temp directories.
      - CHOWN
      # Becoming the workers' user.
      - SETUID
      - SETGID
      # Opening its logs: the deploying user owns their directory, and root is no owner there.
      - DAC_OVERRIDE
    # `service_healthy`, not just `service_started`: an nginx starting from nothing must not accept
    # traffic before both upstreams answer. A deploy does not pass through here, recreating the
    # application pair alone, so this governs a cold start.
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          memory: "128M"

  # The connector, and the whole of why this host publishes no port: it dials out to Cloudflare and
  # carries every request back over the network below, so nothing reaches the origin any other way.

  # No resource limit, unlike the three above: this process forwards bytes for every request on the
  # site, and a CPU cap nobody has measured throttles the whole of it rather than capping a leak.
  cloudflared:
    # Pinned by tag and digest (`docs/ops/spec.md` §1.1), against the vendor's own `:latest --pull
    # always` example: the component holding the site's one route in would otherwise drift per host,
    # silently.
    image: cloudflare/cloudflared:2026.9.3@sha256:072c067d25ccbe61d46e18f0d0723255f2bb5304f7317caa95b27031520ff92c
    restart: unless-stopped
    # `--no-autoupdate` because the pin above is the version policy: a connector that replaces its
    # own binary is the unpinned tag again, arrived at from inside the container.
    command: tunnel --no-autoupdate run --token-file /run/secrets/tunnel_token
    # `--token-file` rather than `--token` or `TUNNEL_TOKEN`: an argument sits in every process
    # listing and an environment in `docker inspect`, and a mounted file sits in neither.
    secrets:
      - tunnel_token
    networks:
      frankfurtleague-net:
        # High in the subnet so the daemon's own sequential assignment never reaches it first: a
        # static address already handed to another container fails the whole `up`.
        ipv4_address: 172.30.0.250
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # No `condition:` to give: nginx declares no healthcheck, so `service_started` is all there is.
    # It is enough, because nginx itself waits on both upstreams being healthy before it starts.
    depends_on:
      - nginx

# Each a file the host provides, never a variable: `docker inspect` prints an environment and never a
# mount's contents. One name on the host, at `/run/secrets/` and in development, so the two database
# logins take two (`docs/ops/spec.md :: I508`).
secrets:
  tunnel_token:
    file: ./secrets/tunnel_token
  fl_actor_signing_key:
    file: ./secrets/fl_actor_signing_key
  frontend_mongodb_uri:
    file: ./secrets/frontend_mongodb_uri
  backend_mongodb_uri:
    file: ./secrets/backend_mongodb_uri
  auth_secret:
    file: ./secrets/auth_secret
  auth_resend_key:
    file: ./secrets/auth_resend_key
  resend_webhook_secret:
    file: ./secrets/resend_webhook_secret
  sperrliste_schluessel:
    file: ./secrets/sperrliste_schluessel
  internal_api_key_base:
    file: ./secrets/internal_api_key_base
  internal_api_key_system:
    file: ./secrets/internal_api_key_system
  internal_api_key_admin:
    file: ./secrets/internal_api_key_admin
  turnstile_secret_key:
    file: ./secrets/turnstile_secret_key

# Two user-defined bridges, joined by nginx alone (`docs/ops/spec.md :: I471`). Containers resolve each
# other by service name on a network they share -- `http://backend:8000` and `http://frontend:3000` in
# nginx/shared/site.conf are these names, not hosts.
networks:
  # The connector's and nginx's. Its name is the one a running stack already has: a network renamed
  # under the same subnet fails the deploy's `up` with `Pool overlaps` while the old one holds it.
  frankfurtleague-net:
    driver: bridge
    # Declared rather than left to the daemon: `nginx/shared/http.conf :: set_real_ip_from` trusts the
    # connector by address, and a bridge subnet the daemon picks differs per host, silently
    # returning every request to the fail-open path.
    ipam:
      config:
        - subnet: 172.30.0.0/24
  # nginx's and the application pair's. Its subnet is the daemon's to pick: nothing trusts an address
  # on it.
  frankfurtleague-app:
    driver: bridge
