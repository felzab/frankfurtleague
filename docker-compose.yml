x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    env_file: ./fl_frontend/.env
    image: felzab/frankfurtleague:frontend
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000/favicon.ico",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: "2G"
        reservations:
          memory: "512M"

  backend:
    env_file: ./fl_backend/.env
    image: felzab/frankfurtleague:backend
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/system/is_live', timeout=10)",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "512M"
        reservations:
          memory: "128M"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP access from the internet
      - "443:443" # HHTPS access from the internet
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          memory: "128M"

networks:
  frankfurtleague-net:
    driver: bridge
