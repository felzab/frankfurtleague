# OPS · production stack
#
# Three containers on one host: nginx in front, the Next.js frontend and the FastAPI backend behind
# it. Pulls published images and never builds -- `deploy.sh` enforces that, because a server that
# builds is a server that can fail a build with the site down.
#
#  INVARIANTS ───────────────────────────────────────────────────────────────────────────────────────
#
#   • ONLY nginx publishes ports. The application containers are reachable solely from inside
#     `frankfurtleague-net`, so anything nginx does not route simply does not exist for the
#     internet. A `ports:` entry on frontend or backend removes that silently.
#   • nginx waits on both upstreams being HEALTHY, not merely started, so an unhealthy deploy is
#     never served to anyone.
#   • The moving `:latest` tag of each package is what `deploy.sh` pulls with no argument. Rollback
#     pins the immutable `:sha-<commit>` tag instead. One package per service.
#   • Keep this file and docker-compose.local.yml in step. A difference here is a difference the
#     local stack will not have caught.
#
#  SEE ALSO ─────────────────────────────────────────────────────────────────────────────────────────
#
#   docs/ops/spec.md -- the service table and invariants

# Capped so a chatty container cannot fill the server's disk: 30 MB per service, worst case.
x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  frontend:
    env_file: ./fl_frontend/.env
    # A moving tag: `publish.sh` re-points it at every publish, so `deploy.sh` with no argument
    # means the newest published image. A rollback pins the immutable `:sha-<commit>` instead. The
    # package is public, so this pull needs no credentials.
    image: ghcr.io/felzab/frankfurtleague-frontend:latest
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    # The container needs no elevated capability at any point: it serves HTTP as a non-root user.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # A static asset, not a page: it proves the server is answering without rendering a route or
      # touching the backend. `--spider` issues a HEAD, so nothing is downloaded.
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/favicon.ico"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Next's standalone server needs a moment before it answers; without this the early probes
      # fail and the container is marked unhealthy on a perfectly good start.
      start_period: 20s
      # The probe cadence DURING start_period. Without it the engine's own start-period default
      # applies, measured at 5.2 s against this file's 3.2 s (2026-08-11, engine 29.7.2). nginx is
      # gated on `service_healthy`, so it is not serving at all until both upstreams answer, and
      # that difference is dead air on every deploy.
      # Requires Docker Engine 25 or newer on the host, which is where the healthcheck runs.
      start_interval: 3s
    deploy:
      resources:
        # The frontend renders React on the server, so it is the memory-hungry half. The limit is a
        # blast-radius cap, not a target -- it stops a leak taking the whole host down with it.
        limits:
          cpus: "1.5"
          memory: "2G"
        reservations:
          memory: "512M"

  backend:
    env_file: ./fl_backend/.env
    image: ghcr.io/felzab/frankfurtleague-backend:latest
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      # `/system/is_live` is the one probe that needs no key, and it deliberately does not touch
      # MongoDB — a liveness check that needs the database fails for reasons a restart cannot fix.
      # `/system/is_ready` answers that question instead, and is guarded.

      # The API version is hardcoded here and must match
      # `fl_backend/app/core/config.py :: API_VERSION`, which records why it is a constant rather
      # than a setting. Bump both.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v0/system/is_live', timeout=10)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
      # Same first-probe reason as the frontend's, and the same engine requirement.
      start_interval: 3s
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "512M"
        reservations:
          memory: "128M"

  nginx:
    # Pinned to the minor so this proxy and the local one are the same nginx. An unpinned `alpine`
    # tag is whatever each host happened to pull first -- and nothing here pulls nginx again, so the
    # component that terminates TLS and owns the security headers drifts per host, silently. Bump
    # this and docker-compose.local.yml together.
    image: nginx:1.31-alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP, redirected to HTTPS by the server block
      - "443:443" # HTTPS
    # Read-only, and both must exist before `up`. If a mounted file is missing, Docker creates a
    # DIRECTORY at that path and nginx fails with "not a directory" -- `deploy.sh` checks for this
    # before starting rather than letting it surface as a mystery.
    volumes:
      - ./nginx/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    # `service_healthy`, not just `service_started`: nginx must not begin accepting traffic until
    # both upstreams actually answer. This is what makes an unhealthy deploy invisible to visitors
    # rather than a page of 502s.
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: "256M"
        reservations:
          memory: "128M"

# A single user-defined bridge. Containers resolve each other by service name -- `http://backend:8000`
# and `http://frontend:3000` in nginx/prod.conf are these names, not hosts.
networks:
  frankfurtleague-net:
    driver: bridge
