x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"


services:
  frontend:
    env_file: .env.frontend
    image: felzab/frankfurtleague:frontend
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging

  backend:
    env_file: .env.backend
    image: felzab/frankfurtleague:backend
    restart: unless-stopped
    networks:
      - frankfurtleague-net
    logging: *default-logging

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80" # HTTP access from the internet
      - "443:443" # HHTPS access from the internet
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - frankfurtleague-net
    logging: *default-logging
    depends_on:
      - frontend
      - backend

networks:
  frankfurtleague-net:
    driver: bridge
