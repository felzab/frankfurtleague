version: '3.8'

services:
  backend:
    build:
      context: ./digi_backend
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"
    volumes:
      # Maps your local backend folder to /app in the container
      # This is what enables hot-reloading to see your live code changes!
      - ./digi_backend:/app
    
  