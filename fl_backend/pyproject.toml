[project]
name = "fl_backend"
version = "0.1.0"
description = "The backend of https://frankfurtleague.de"
requires-python = ">=3.14"
# What the application imports, plus what starts it. Everything those packages need in turn is
# `uv.lock`'s to pin -- naming a transitive package here freezes a second copy of the graph that
# nothing checks against the real one, and puts a row on the dependabot dashboard for code no
# module in `app/` reaches. Each line below is either an import or a comment saying why it is not.
dependencies = [
    "email-validator>=2.3.0",
    "fastapi>=0.138.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.2",
    # The driver, through `AsyncMongoClient`. Also the home of `bson`, which app/ imports under
    # that name.
    "pymongo>=4.17.0",
    "starlette>=1.3.1",
    # `ZoneInfo("Europe/Berlin")` in app/core/dependencies.py reads the operating system's time-zone
    # database. Windows has none at all and a slim image promises none, so this package is where the
    # zone comes from; without it that call raises `ZoneInfoNotFoundError`.
    "tzdata>=2026.2",
    # The container's entrypoint -- fl_backend/Dockerfile's CMD runs uvicorn itself, so no module
    # imports it and nothing else would declare it.
    #
    # `[standard]`, not bare, because uvicorn's defaults are `--loop auto` and `--http auto`: it
    # uses uvloop and the httptools C parser when it can import them and silently drops to asyncio
    # and h11 when it cannot. uvloop and httptools arrive only through this extra, so a bare
    # `uvicorn` would change what the server runs on with nothing in the gate to show it. The extra
    # also carries packages this application does not use, watchfiles and websockets among them --
    # the alternative is hand-copying uvicorn's own platform markers for uvloop, which does not
    # build on Windows, and owning that copy forever.
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    # `fastapi dev app/asgi.py`, the source-with-reload run `docs/ops/spec.md` records as the dev
    # environment's backend entry point. A developer command, never the container's: the
    # Dockerfile's `uv sync --no-dev` leaves this group -- and the typer/rich console stack under
    # it -- out of the image.
    "fastapi-cli>=0.0.27",
    # `starlette.testclient` imports `httpx2` and reaches `httpx` only under
    # `StarletteDeprecationWarning`. The API tests import both that client and this package's own
    # `ASGITransport`, so they fail at collection without it. No module in app/ touches it.
    "httpx2>=2.12.0",
    # `[nodejs]`: the wrapper takes nodejs-wheel's Node ahead of a PATH node or a nodeenv download,
    # so the lockfile pins the Node pyright runs on. Why the gate runs pyright at all: `[tool.pyright]`.
    "pyright[nodejs]>=1.1.406",
    # Starts a real mongod for the `db`-marked tests. Only those tests import it, and
    # they are deselected by default, so a normal `pytest` run never loads it or touches Docker.
    "testcontainers[mongodb]>=4.15.0",
    # Distributes the `db` tier (`scripts/gate/verify.sh`'s db scope).
    # `tests/conftest.py :: pytest_configure_node` carries `optionalhook` so a venv without this
    # plugin still collects.
    "pytest-xdist>=3.8.0",
    # Lints the workflows for what actionlint leaves alone; a Rust binary shipped as a wheel, so it
    # comes through the lockfile like every other checker.
    "zizmor>=1.30.0",
    # The documentation gate's Markdown reader (`scripts/checks/docs_gate/kernel.py`): CommonMark
    # decides which blocks and spans a page shows as code, rather than patterns kept by hand.
    # Run by the docs and scripts scopes: the `docs` and `scripts` jobs of
    # `.github/workflows/verify.yml`.
    "markdown-it-py>=4.2.0",
    # Holds `dependencies` to what `app/` imports: an import reaching a package only through
    # another's requirements, or a package there nothing imports, fails the backend scope. This group
    # is outside the unused-package rule (DEP002), which deptry applies to `dependencies` alone.
    "deptry>=0.25.1",
]

[tool.deptry.per_rule_ignores]
# Declared though never imported, each for the reason at its line in `dependencies`.
DEP002 = ["tzdata", "uvicorn"]

[tool.uv]
# The uv the Dockerfile copies in, so one resolver builds the gate's venv and the image's;
# setup-uv's `version-file` reads it too. Moves with the Dockerfile's `FROM ghcr.io/astral-sh/uv:`
# line, and `scripts/gate/selfcheck.sh :: UV_PIN` refuses the pair when it does not.
required-version = "==0.12.18"

[tool.ruff]
line-length = 144

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (alphabetizes your imports!)
    "B",  # flake8-bugbear
    # Fixes with no judgment in them -- `re.I` spelled `re.IGNORECASE` is the motivating case.
    # Stable subset only: ruff holds part of FURB behind `preview`, and turning that on moves every
    # other family too.
    "FURB",  # refurb — mechanical modernisations
    # One pass over the whole package rather than per module: a tree half on `collections.abc` and
    # half on `typing` reads as an unfinished rename, and the next writer copies whichever module
    # they opened.
    "UP",  # pyupgrade
    # Docstring FORMATTING only (docs/_standard/standard.md, INC-7). Deliberately NOT the D1xx
    # missing-docstring family: requiring a docstring on every symbol manufactures boilerplate, and
    # the standard asks for prose where there is a reason to record, not coverage for its own sake.
    "D200",  # one-line docstring should fit on one line
    "D205",  # blank line required between summary line and description
    "D209",  # multi-line docstring closing quotes on their own line
    "D210",  # no surrounding whitespace in docstrings
    "D419",  # docstring is empty
    # A `noqa` that suppresses nothing still reads as a reason the line needs one, and the reason
    # written beside it is then untrue. `scripts/ruff.toml` extends this list, so both trees carry it.
    "RUF100",  # unused noqa directive
    "TID251",  # banned-api, the list below
]
ignore = ["B008"]

# A handler reading the environment's settings answers with those whatever the app was built with,
# and the dependency walk in `tests/core/test_config.py` never sees a call inside a body.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# Each permitted import carries its own `noqa`, which RUF100 reports once nothing there needs it;
# the preflight in `scripts/ops/deploy.sh` is a shell string ruff never reads.
"app.core.config.get_config".msg = "Read the request's settings through `get_app_config`; the environment's are for `create_app`, the constraints CLI and the deploy preflight."
# A transport built beside the helper is a copy of it, and drifts from it. The one other permitted
# construction serves apps carrying routes of their own, which the helper never exposes.
"httpx2.ASGITransport".msg = "Serve the app in process through `tests/app_client.py :: app_client`; a transport of your own is a copy of it."

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# importlib is pytest's recommended import mode for new suites: no sys.path manipulation, and test
# modules sharing a basename across directories cannot collide. It is why tests/ needs no
# __init__.py files.
#
# -ra prints a reason line for every non-passing test, so a failure names itself in the summary
# rather than only in the scrollback. --showlocals puts the fixture values in the traceback.
# Deliberately NOT -q: quiet mode suppresses precisely the detail you need when something breaks,
# and this suite is fast enough that verbosity costs nothing.
#
# -m "not db" keeps the default suite off the container tier, and a command-line -m overrides it
# (`docs/backend/spec.md :: 1.6`).
addopts = "--import-mode=importlib --strict-markers --strict-config -ra --showlocals -m \"not db\""
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers turns an unregistered marker into an error, so this line is what makes
# @pytest.mark.db real rather than a silent typo.
markers = [
    "db: needs a real mongod via testcontainers. Deselected by default; run with `pytest -m db`.",
]
# pytest's default is `skip`, so a parametrize list whose discovery found nothing passes as one
# silent skip and takes its whole guarantee with it
# (`scripts/checks/check_test_estate.py :: check_empty_parametrize`).
empty_parameter_set_mark = "fail_at_collect"

[tool.pyright]
# The type checker the EDITOR already runs. ruff lints and pytest executes and neither checks a
# type, so without this section a type error reaches only whoever has the file open in Pylance,
# while `scripts/gate/verify.sh` goes green past it.

# venvPath/venv are what resolve a third-party import, in the gate as in an editor: pyright run by
# this environment's own python (`scripts/gate/verify.sh :: do_backend_pyright`) still reads none of
# it without them. `scripts/pyrightconfig.json` names the same one.
venvPath = "."
venv = ".venv"
# Pinned rather than read from whichever interpreter pyright finds: CI's Linux run judged the tree
# as an older Python and refused a self-reference 3.14's deferred annotations allow, while the
# Windows gate, on the same pyright, accepted it.
pythonVersion = "3.14"
include = ["app", "tests"]
# `basic`, below pyright's `standard` default: at `standard`, every payload schema narrowing a base
# model's field reports `reportIncompatibleVariableOverride` for the shape it exists for.
# `strict` demands an annotation on every symbol, test locals too.
typeCheckingMode = "basic"
