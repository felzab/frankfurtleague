[project]
name = "fl_backend"
version = "0.1.0"
description = "The backend of https://frankfurtleague.de"
requires-python = ">=3.14"
dependencies = [
    "annotated-doc>=0.0.4",
    "annotated-types>=0.7.0",
    "anyio>=4.14.0",
    "certifi>=2026.6.17",
    "click>=8.4.1",
    "colorama>=0.4.6",
    "detect-installer>=0.1.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.138.0",
    "fastapi-cli>=0.0.27",
    "fastapi-cloud-cli>=0.20.0",
    "fastar>=0.11.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httptools>=0.8.0",
    "httpx>=0.28.1",
    "idna>=3.18",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.3",
    "mdurl>=0.1.2",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.2",
    "pygments>=2.20.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rich-toolkit>=0.20.1",
    "rignore>=0.7.6",
    "sentry-sdk>=2.63.0",
    "shellingham>=1.5.4",
    "sniffio>=1.3.1",
    "starlette>=1.3.1",
    "style>=1.1.6",
    "typer>=0.26.7",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
    "tzdata>=2026.2",
    "urllib3>=2.7.0",
    "uvicorn>=0.49.0",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 144

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (alphabetizes your imports!)
    "B",  # flake8-bugbear
]
ignore = ["B008"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# importlib is pytest's recommended import mode for new suites: no sys.path manipulation, and test
# modules sharing a basename across directories cannot collide. It is why tests/ needs no
# __init__.py files.
#
# -ra prints a reason line for every non-passing test, so a failure names itself in the summary
# rather than only in the scrollback. --showlocals puts the fixture values in the traceback, which
# is the difference between "a validation error was expected" and seeing the exact payload that
# produced it. Deliberately NOT -q: quiet mode suppresses precisely the detail you need when
# something breaks, and this suite is fast enough that verbosity costs nothing.
addopts = "--import-mode=importlib --strict-markers --strict-config -ra --showlocals"
testpaths = ["tests"]
pythonpath = ["."]
