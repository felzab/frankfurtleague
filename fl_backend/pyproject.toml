[project]
name = "fl_backend"
version = "0.1.0"
description = "The backend of https://frankfurtleague.de"
requires-python = ">=3.14"
# What the application imports, plus what starts it. Everything those packages need in turn is
# `uv.lock`'s to pin -- naming a transitive package here freezes a second copy of the graph that
# nothing checks against the real one, and puts a row on the dependabot dashboard for code no
# module in `app/` reaches. Each line below is either an import or a comment saying why it is not.
dependencies = [
    # `EmailStr` in app/shared/schemas/kontakt.py resolves through this. Pydantic ships it as the
    # `email` extra rather than a requirement, so nothing else in the tree brings it.
    "email-validator>=2.3.0",
    "fastapi>=0.138.0",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.14.2",
    # The driver, through `AsyncMongoClient`. Also the home of `bson`, which app/ imports under
    # that name.
    "pymongo>=4.17.0",
    "starlette>=1.3.1",
    # `ZoneInfo("Europe/Berlin")` in app/core/dependencies.py reads the operating system's time-zone
    # database. Windows has none at all and a slim image promises none, so this package is where the
    # zone comes from; without it that call raises `ZoneInfoNotFoundError`.
    "tzdata>=2026.2",
    # The container's entrypoint -- fl_backend/Dockerfile's CMD runs uvicorn itself, so no module
    # imports it and nothing else would declare it.
    #
    # `[standard]`, not bare, because uvicorn's defaults are `--loop auto` and `--http auto`: it
    # uses uvloop and the httptools C parser when it can import them and silently drops to asyncio
    # and h11 when it cannot. uvloop and httptools arrive only through this extra, so a bare
    # `uvicorn` would change what the server runs on with nothing in the gate to show it. The extra
    # also carries packages this application does not use, watchfiles and websockets among them --
    # the alternative is hand-copying uvicorn's own platform markers for uvloop, which does not
    # build on Windows, and owning that copy forever.
    "uvicorn[standard]>=0.52.1",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.0",
    # `fastapi dev app/asgi.py`, the source-with-reload run `docs/ops/spec.md` records as the dev
    # environment's backend entry point. A developer command, never the container's: the
    # Dockerfile's `uv sync --no-dev` leaves this group -- and the typer/rich console stack under
    # it -- out of the image.
    "fastapi-cli>=0.0.27",
    # `fastapi.testclient.TestClient` is a thin wrapper over httpx and imports it eagerly, so the
    # tests fail at collection without it. No module in app/ touches it.
    "httpx>=0.28.1",
    # `[nodejs]`: the wrapper takes nodejs-wheel's Node ahead of a PATH node or a nodeenv download,
    # so the lockfile pins the Node pyright runs on. Why the gate runs pyright at all: `[tool.pyright]`.
    "pyright[nodejs]>=1.1.406",
    # Starts a real mongod for the `db`-marked tests. Only those tests import it, and
    # they are deselected by default, so a normal `pytest` run never loads it or touches Docker.
    "testcontainers[mongodb]>=4.15.0",
    # Distributes the `db` tier (`scripts/verify.sh`'s db scope).
    # `tests/conftest.py :: pytest_configure_node` carries `optionalhook` so a venv without this
    # plugin still collects.
    "pytest-xdist>=3.8.0",
    # Lints the workflows for what actionlint leaves alone; a Rust binary shipped as a wheel, so it
    # comes through the lockfile like every other checker.
    "zizmor>=1.30.0",
]

[tool.uv]
# The uv the Dockerfile copies in, so one resolver builds the gate's venv and the image's;
# setup-uv's `version-file` reads it too. Moves with the Dockerfile's `FROM ghcr.io/astral-sh/uv:`
# line, which nothing compares.
required-version = "==0.12.3"

[tool.ruff]
line-length = 144

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (alphabetizes your imports!)
    "B",  # flake8-bugbear
    # Fixes with no judgment in them -- `re.I` spelled `re.IGNORECASE` is the motivating case. Not the
    # `UP` family, which is a real migration. Stable subset only: ruff holds part of FURB behind
    # `preview`, and turning that on moves every other family too.
    "FURB",  # refurb — mechanical modernisations
    # Docstring FORMATTING only (docs/standard.md, INC-7). Deliberately NOT the D1xx
    # missing-docstring family: requiring a docstring on every symbol manufactures boilerplate, and
    # the standard asks for prose where there is a reason to record, not coverage for its own sake.
    "D200",  # one-line docstring should fit on one line
    "D205",  # blank line required between summary line and description
    "D209",  # multi-line docstring closing quotes on their own line
    "D210",  # no surrounding whitespace in docstrings
    "D419",  # docstring is empty
]
ignore = ["B008"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# importlib is pytest's recommended import mode for new suites: no sys.path manipulation, and test
# modules sharing a basename across directories cannot collide. It is why tests/ needs no
# __init__.py files.
#
# -ra prints a reason line for every non-passing test, so a failure names itself in the summary
# rather than only in the scrollback. --showlocals puts the fixture values in the traceback, which
# is the difference between "a validation error was expected" and seeing the exact payload that
# produced it. Deliberately NOT -q: quiet mode suppresses precisely the detail you need when
# something breaks, and this suite is fast enough that verbosity costs nothing.
#
# -m "not db" is what keeps the default suite worth running. The db-marked
# tests start a container, which costs seconds and a Docker daemon; everything else is a dict in and
# a model out and finishes in a third of a second. A command-line -m overrides this one, because
# addopts are prepended to the arguments rather than merged -- so `pytest -m db` runs exactly the
# tests this line excludes.
addopts = "--import-mode=importlib --strict-markers --strict-config -ra --showlocals -m \"not db\""
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers turns an unregistered marker into an error, so this line is what makes
# @pytest.mark.db real rather than a silent typo.
markers = [
    "db: needs a real mongod via testcontainers. Deselected by default; run with `pytest -m db`.",
]

[tool.pyright]
# The type checker the EDITOR already runs, in the gate as well. ruff lints and pytest executes and
# neither checks a type, so without this section a type error reaches only whoever has the file open
# in Pylance, while `scripts/verify.sh` goes green past it.
#
# venvPath/venv are what make this meaningful: without them pyright resolves no third-party import,
# reports ~137 phantom errors and is rightly ignored.
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
# `basic`, below pyright's `standard` default: at `standard`, 21 payload schemas report
# `reportIncompatibleVariableOverride` for narrowing a base model's field, the shape they exist for.
# `strict` demands an annotation on every symbol, test locals too.
typeCheckingMode = "basic"
