[project]
name = "fl_backend"
version = "0.1.0"
description = "The backend of https://frankfurtleague.de"
requires-python = ">=3.15"
# What the application imports, plus what starts it. Everything those packages need in turn is
# `uv.lock`'s to pin -- naming a transitive package here freezes a second copy of the graph that
# nothing checks against the real one, and puts a row on the dependabot dashboard for code no
# module in `app/` reaches. Each line below is either an import or a comment saying why it is not.
dependencies = [
    "anyio>=4.16.0",
    "email-validator>=2.3.0",
    "fastapi>=0.162.4",
    "pydantic>=2.14.3",
    "pydantic-core>=2.50.4",
    "pydantic-settings>=2.16.2",
    # The driver, through `AsyncMongoClient`. Also the home of `bson`, which app/ imports under
    # that name.
    "pymongo>=4.19.0",
    "starlette>=1.10.0",
    # The clock's `ZoneInfo("Europe/Berlin")` reads the operating system's time-zone
    # database. Windows has none at all and a slim image promises none, so this package is where the
    # zone comes from; without it that call raises `ZoneInfoNotFoundError`.
    "tzdata>=2026.6",
    # The container's entrypoint -- the image's CMD runs uvicorn itself, so no module imports it and
    # nothing else would declare it. Bare: the CMD names the loop and the parser it runs on.
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    # `[nodejs]`: the wrapper takes nodejs-wheel's Node ahead of a PATH node or a nodeenv download,
    # so the lockfile pins the Node pyright runs on.
    "pyright[nodejs]>=1.1.414",
    # Distributes the `db` tier and the gate's other suites over workers. The suite's node hook is
    # marked optional, so a venv without this plugin still collects.
    "pytest-xdist>=3.8.0",
    # `starlette.testclient` imports `httpx2` and reaches `httpx` only under
    # `StarletteDeprecationWarning`. The API tests import both that client and this package's own
    # `ASGITransport`, so they fail at collection without it. No module in app/ touches it.
    "httpx2>=2.16.0",
    # Starts a real mongod for the `db`-marked tests, which are deselected by default, so a normal
    # `pytest` run never loads it or touches Docker.
    "testcontainers[mongodb]>=4.15.0",
    # Holds `dependencies` to what `app/` imports: an import reaching a package only through
    # another's requirements, or a package there nothing imports, fails the backend scope. This group
    # is outside the unused-package rule (DEP002), which deptry applies to `dependencies` alone.
    "deptry>=0.25.1",
    # Runs the `async def` cases, each as a task of its own in a copy of pytest's context, on one
    # loop the session shares (`asyncio_default_test_loop_scope` below).
    "pytest-asyncio>=1.5.0",
    # The ops scope's audit of `.github/`.
    "zizmor>=1.32.0",
]

[tool.deptry.per_rule_ignores]
# Declared though never imported, each for the reason at its line in `dependencies`.
DEP002 = ["tzdata", "uvicorn"]

[tool.uv]
# The floor stays at or below the uv Dependabot relocks with, which fails outside this range; the
# ceiling stops before the next minor release, the only kind that may change the lockfile's schema.
required-version = ">=0.12.18,<0.14"
# A release younger than a day is left out of every resolution, the day Dependabot's cooldown waits.
# Relative, so it moves with the clock rather than freezing the graph at a date.
exclude-newer = "1 day"
# zizmor from a wheel alone: its sdist builds with a Rust toolchain and a build backend no hash in
# the lockfile covers.
no-build-package = ["zizmor"]

[tool.ruff]
line-length = 144
# The packages below `app`, the test tree and the gate's three script folders carry no `__init__.py`
# (pytest's importlib mode needs none), and ruff judges a module's name (N999) only inside a package it
# can see. Paths resolve from this file, for the scripts' configuration extending it too, but `src`,
# which it resolves from its own.
namespace-packages = ["app", "tests", "../scripts/checks", "../scripts/lib", "../scripts/tests"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    # FastAPI's dependencies in its one documented form, `Annotated[T, Depends(f)]` (FAST002). FAST001,
    # a `response_model=` restating the return annotation, reports nothing on a Python 3.14 or later target.
    "FAST",  # FastAPI
    # Fixes with no judgment in them. Stable subset only: ruff holds part of FURB behind `preview`,
    # and turning that on moves every other family too.
    "FURB",  # refurb — mechanical modernisations
    # One pass over the whole package rather than per module: a tree half on `collections.abc` and
    # half on `typing` reads as an unfinished rename, and the next writer copies whichever module
    # they opened.
    "UP",  # pyupgrade
    # Docstring formatting only, never the D1xx missing-docstring family: requiring a
    # docstring on every symbol manufactures boilerplate, and prose belongs where there is a reason
    # to record, not coverage for its own sake.
    "D200",  # one-line docstring should fit on one line
    "D205",  # blank line required between summary line and description
    "D209",  # multi-line docstring closing quotes on their own line
    "D210",  # no surrounding whitespace in docstrings
    "D419",  # docstring is empty
    # A `noqa` that suppresses nothing still reads as a reason the line needs one, and the reason
    # written beside it is then untrue.
    "RUF100",  # unused noqa directive
    "TID251",  # banned-api, the list below
    # A log message is a constant `<slice>.<event>` with its values in `extra=` fields: G004 refuses
    # a value formatted into the message.
    "G",  # flake8-logging-format
    # Characters a reviewer cannot see in a diff: a bidirectional control reorders the line around
    # it, and a raw control or zero-width space in a string changes its value unseen. PLE2502 and
    # PLE2515 find nothing the gate's invisible-character grep misses, and stay for the editor,
    # where ruff warns as the character is typed.
    "PLE2502",  # bidirectional-unicode
    "PLE2510",  # invalid-character-backspace
    "PLE2512",  # invalid-character-sub
    "PLE2513",  # invalid-character-esc
    "PLE2514",  # invalid-character-nul
    "PLE2515",  # invalid-character-zero-width-space
    # A module or package name is snake_case, the one case a Python file's name takes here.
    "N999",  # invalid-module-name
]
# The `G` rules read only a call on a receiver they know to be a logger, and `fl_logger.info(f"…")`
# passes unread without these names.
logger-objects = ["app.core.logging.fl_logger"]

[tool.ruff.lint.per-file-ignores]
# Every entry guards the application, and a test reads the clock and the environment freely: it stages stored
# instants against the wall clock it runs under, and it builds settings from the environment to judge them.
"tests/**" = ["TID251"]

# A handler reading the environment's settings answers with those whatever the app was built with.
# The ban reaches every spelling of a read, an import, an attribute through `app.core.config` and a
# dependency alike, which makes it the one guard against a route reading them.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
# A rule's kind is one the contract publishes, so a raise names it through the one helper taking that
# type; a direct one would word a kind the frontend cannot key.
"pydantic_core.PydanticCustomError".msg = "Raise a domain rule through `app.core.exceptions.rule_refusal`, whose `Rule` the contract publishes."
# A box's faults reach the body through one collecting call, so no gate carries one and a judge cannot raise them apart.
"app.core.exceptions.FieldRefusal".msg = "Raise field faults through `app.core.crud.refuse_faults`, which names every fault its independent checks found."
# Each permitted import carries its own `noqa`, which RUF100 reports once nothing there needs it.
"app.core.config.get_config".msg = "Read the request's settings through `get_app_config`; the environment's are for `create_app` and `app/readback.py`."
"os.environ".msg = "Read the request's settings through `get_app_config`; the environment's are for `create_app` and `app/readback.py`."
"os.getenv".msg = "Read the request's settings through `get_app_config`; the environment's are for `create_app` and `app/readback.py`."
# The wall clock, read in one module alone, so every rule judging "now" or "today" reads one instant
# in one zone.
"datetime.datetime.now".msg = "Read the clock through `app.core.clock.now`, or in a request through `get_germany_now`."
"datetime.date.today".msg = "Read the clock through `app.core.clock.now`, or in a request through `get_germany_now`."
"datetime.datetime.today".msg = "Read the clock through `app.core.clock.now`, or in a request through `get_germany_now`."
"datetime.datetime.utcnow".msg = "Read the clock through `app.core.clock.now`, or in a request through `get_germany_now`."
"time.time".msg = "Read the clock through `app.core.clock.now`, or in a request through `get_germany_now`."
# `gather` leaves the other awaitables running once one raises, so a refused read outlives its request.
"asyncio.gather".msg = "Run awaitables together through `app.core.concurrency.concurrently`, which stops the rest when one raises."
# `EmailStr` never turns `allow_smtputf8` off, so a field typed with it stores a Unicode local part
# the league's rule refuses, and a ban keyed on that address misses its folded twin. Both spellings,
# since the ban matches the path an import names.
"pydantic.EmailStr".msg = "Type an address `app.shared.schemas.kontakt.CustomEmail`, which runs the league's address rule."
"pydantic.networks.EmailStr".msg = "Type an address `app.shared.schemas.kontakt.CustomEmail`, which runs the league's address rule."

[tool.pytest.ini_options]
# importlib is pytest's recommended import mode for new suites: no sys.path manipulation, and test
# modules sharing a basename across directories cannot collide. It is why tests/ needs no
# __init__.py files.
#
# -ra prints a reason line for every non-passing test, so a failure names itself in the summary
# rather than only in the scrollback. --showlocals puts the fixture values in the traceback.
# Deliberately NOT -q: quiet mode suppresses precisely the detail you need when something breaks,
# and this suite is fast enough that verbosity costs nothing.
#
# -m "not db" keeps the default suite off the container tier, and a command-line -m overrides it
#
# --dist loadfile keeps each file on one xdist worker wherever a run passes -n, a bare one included:
# MongoDB holds one configuration of a fail point for the whole server the workers share, so the
# fail-point cases spread over workers take each other's. Without -n it changes nothing, xdist
# reading the mode only where it starts workers.

addopts = "--import-mode=importlib --strict-markers --strict-config -ra --showlocals -m \"not db\" --dist loadfile"
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers turns an unregistered marker into an error, so this line is what makes
# @pytest.mark.db real rather than a silent typo.
markers = [
    "db: needs a real mongod via testcontainers. Deselected by default; run with `pytest -m db`.",
]
# pytest's default is `skip`, so a parametrize list whose discovery found nothing passes as one
# silent skip and takes its whole guarantee with it.
empty_parameter_set_mark = "fail_at_collect"
# pytest-asyncio runs every `async def` case and fixture without a mark on each. Both on the session's
# loop, since the suite's shared database client belongs to the loop that opened it.
asyncio_mode = "auto"
asyncio_default_test_loop_scope = "session"
asyncio_default_fixture_loop_scope = "session"

[tool.pyright]
# The type checker the EDITOR already runs. ruff lints and pytest executes and neither checks a
# type, so without this section a type error reaches only whoever has the file open in Pylance,
# while the gate goes green past it.

# venvPath/venv are what resolve a third-party import, in the gate as in an editor: pyright run by
# this environment's own python still reads none of it without them.
venvPath = "."
venv = ".venv"
# Pinned rather than read from whichever interpreter pyright finds: CI's Linux run judged the tree
# as an older Python and refused a self-reference 3.14's deferred annotations allow, while the
# Windows gate, on the same pyright, accepted it.
pythonVersion = "3.15"
include = ["app", "tests"]
# `standard`, pyright's default. `strict` demands an annotation on every symbol, test locals too.
typeCheckingMode = "standard"
# Off alone: every payload schema narrowing a base model's field, the shape it exists for, would
# report it.
reportIncompatibleVariableOverride = false
# A use of what a library or the standard library's stubs mark deprecated, refused while its
# replacement stands beside it rather than found at the release that removes it.
reportDeprecated = "error"

# The application's code names a type for every parameter: one left bare is `Any` to pyright, so a write through a
# collection it is handed passes with nothing reported. Not the tests, which take fixtures and
# parametrised values bare, as pytest's own examples do. Rooted lower than the project, so told where `app.…` resolves from.
[[tool.pyright.executionEnvironments]]
root = "app"
extraPaths = ["."]
reportMissingParameterType = "error"
