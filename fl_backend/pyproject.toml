[project]
name = "fl_backend"
version = "0.1.0"
description = "The backend of https://frankfurtleague.de"
requires-python = ">=3.14"
dependencies = [
    "annotated-doc>=0.0.4",
    "annotated-types>=0.7.0",
    "anyio>=4.14.0",
    "certifi>=2026.6.17",
    "click>=8.4.1",
    "colorama>=0.4.6",
    "detect-installer>=0.1.0",
    "dnspython>=2.8.0",
    "email-validator>=2.3.0",
    "fastapi>=0.138.0",
    "fastapi-cli>=0.0.27",
    "fastapi-cloud-cli>=0.20.0",
    "fastar>=0.11.0",
    "h11>=0.16.0",
    "httpcore>=1.0.9",
    "httptools>=0.8.0",
    "httpx>=0.28.1",
    "idna>=3.18",
    "jinja2>=3.1.6",
    "markdown-it-py>=4.2.0",
    "markupsafe>=3.0.3",
    "mdurl>=0.1.2",
    "motor>=3.7.1",
    "pydantic>=2.13.4",
    "pydantic-core>=2.46.4",
    "pydantic-settings>=2.15.0",
    "pygments>=2.20.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "rich-toolkit>=0.20.1",
    "rignore>=0.8.1",
    "sentry-sdk>=2.63.0",
    "shellingham>=1.5.4",
    "sniffio>=1.3.1",
    "starlette>=1.4.1",
    "style>=1.1.6",
    "typer>=0.27.1",
    "typing-extensions>=4.15.0",
    "typing-inspection>=0.4.2",
    "tzdata>=2026.2",
    "urllib3>=2.7.0",
    "uvicorn>=0.52.1",
    "watchfiles>=1.2.0",
    "websockets>=16.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.2",
    # The type checker the editor already runs as Pylance. In the venv so `verify.sh` runs the SAME
    # one, rather than the gate and the editor disagreeing about whether the code is correct.
    "pyright>=1.1.406",
    # Starts a real mongod for the `db`-marked tests (ADR-0023). Only those tests import it, and
    # they are deselected by default, so a normal `pytest` run never loads it or touches Docker.
    "testcontainers[mongodb]>=4.15.0",
]

[tool.ruff]
line-length = 144

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort (alphabetizes your imports!)
    "B",  # flake8-bugbear
    # Modernisations with a mechanical fix and no judgment in them — `re.I` spelled out as
    # `re.IGNORECASE` is the motivating case, caught by an editor while the gate could not see it.
    # Measured at zero findings across app and tests when selected, so it costs nothing today.
    # This is NOT the `UP` family, which is a real migration and belongs to roadmap item BE-7.
    "FURB",  # refurb — mechanical modernisations
    # Docstring FORMATTING only (docs/_standard/chapters/2-in-code.md, INC-7). Deliberately NOT the D1xx
    # missing-docstring family: requiring a docstring on every symbol manufactures boilerplate, and
    # the standard asks for prose where there is a reason to record, not coverage for its own sake.
    "D200",  # one-line docstring should fit on one line
    "D205",  # blank line required between summary line and description
    "D209",  # multi-line docstring closing quotes on their own line
    "D210",  # no surrounding whitespace in docstrings
    "D419",  # docstring is empty
]
ignore = ["B008"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
# importlib is pytest's recommended import mode for new suites: no sys.path manipulation, and test
# modules sharing a basename across directories cannot collide. It is why tests/ needs no
# __init__.py files.
#
# -ra prints a reason line for every non-passing test, so a failure names itself in the summary
# rather than only in the scrollback. --showlocals puts the fixture values in the traceback, which
# is the difference between "a validation error was expected" and seeing the exact payload that
# produced it. Deliberately NOT -q: quiet mode suppresses precisely the detail you need when
# something breaks, and this suite is fast enough that verbosity costs nothing.
#
# -m "not db" is the half of ADR-0023 that keeps the default suite worth running. The db-marked
# tests start a container, which costs seconds and a Docker daemon; everything else is a dict in and
# a model out and finishes in a third of a second. A command-line -m overrides this one, because
# addopts are prepended to the arguments rather than merged -- so `pytest -m db` runs exactly the
# tests this line excludes.
addopts = "--import-mode=importlib --strict-markers --strict-config -ra --showlocals -m \"not db\""
testpaths = ["tests"]
pythonpath = ["."]
# --strict-markers turns an unregistered marker into an error, so this line is what makes
# @pytest.mark.db real rather than a silent typo.
markers = [
    "db: needs a real mongod via testcontainers. Deselected by default; run with `pytest -m db`.",
]

[tool.pyright]
# The type checker the EDITOR already runs. Without it in the gate, Pylance was the only thing that
# saw these errors and only for whoever had the file open -- three of them reached `main` behind a
# green `verify.sh`, because ruff lints and pytest executes and neither checks a type.
#
# venvPath/venv are what make this meaningful: without them pyright resolves no third-party import,
# reports ~137 phantom errors and is rightly ignored.
venvPath = "."
venv = ".venv"
include = ["app", "tests"]
# `basic` rather than `strict`. Strict demands an annotation on every symbol including test locals,
# which is a different project from "the editor and the gate agree".
typeCheckingMode = "basic"
