# The backend's rules, applied to the test tree by `extend` rather than a copy, with one table narrowed.
# The backend's banned list guards the application: a test stages stored instants against the wall clock
# it runs under, and builds settings from the environment to judge them. A child's `banned-api` replaces
# the parent's whole table, so this one keeps the entry that guards test support as much as a route.

extend = "../pyproject.toml"
# The backend's own root, the default `src` resolving from this file instead: without it, isort reads `app`
# and `tests` as third-party.
src = [".."]

# `gather` leaves the other awaitables running once one raises, and a sibling left on the session's loop
# runs into the next case.
[lint.flake8-tidy-imports.banned-api]
"asyncio.gather".msg = "Run awaitables together through `app.core.concurrency.concurrently`, which stops the rest when one raises."
