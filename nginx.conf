# HTTP -> HTTPS
server {
  listen 80;
  listen [::]:80;
  server_name frankfurtleague.de www.frankfurtleague.de;

  server_tokens off; # Hide Nginx version number
  return 301 https://frankfurtleague.de$request_uri; # Drop www.
}


# HTTPS server
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name frankfurtleague.de;
    server_tokens off; # Hide Nginx version number

    # Payload & Buffer optimization
    client_max_body_size 20M;

    # Expand buffers to prevent 502 Gateway errors with large Auth.js cookies
    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # Enable Gzip compression
    gzip on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_vary on; # Tells CDNs/browsers cache depends on Accept-Encoding
    gzip_types text/plain text/css text/xml application/json application/javascript text/javascript application/rss+xml application/atom+xml image/svg+xml application/manifest+json;
    # SSL
    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off; # Let the client choose from the strong list

    # SSL Performance
    ssl_session_cache   shared:SSL:10m; # Holds ~40,000 sessions
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    # OCSP Stapling -> Speeds up SSL handshakes
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Security
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;

    # Global Proxy Headers
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Port $server_port;


    # Passthrough for Auth.js
    location /api/auth {
        proxy_pass http://frontend:3000;
    }

    # Backend FastAPI
    location /api {
        proxy_pass http://backend:8000;
    }

    # Next.js Static Assets -> Bypass application logs, max out browser cache
    # Nginx serves assets directly from disk. Bypasses Node.js entirely.
    location /_next/static/ {
        alias /app/.next/static/;
        access_log off;
        expires max;

        add_header Cache-Control "public, max-age=31536000, immutable";
        # Necessary to copy all the headers here again
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https:;" always;
    }

    # Frontend Main
    location / {
        proxy_pass http://frontend:3000;

        # WebSocket Support for Next.js Turbo/HMR (if needed) or general socket logic
        # THIS CAN NOT BE HERE AND HAS TO BE MOVED IF USED
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection "upgrade";
    }
}
