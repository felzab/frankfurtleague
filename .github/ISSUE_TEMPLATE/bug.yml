name: Bug report
description: Something on the site behaves wrongly
title: "Area: "
labels: [bug]

body:
  - type: markdown
    attributes:
      value: |
        **Not for security problems.** A suspected vulnerability goes to the address
        [SECURITY.md](https://github.com/felzab/frankfurtleague/blob/main/SECURITY.md) names, never
        to a public issue.

        Keep the title in the shape `Area: symptom`, for example
        `Spielplan: switching Spieltag leaves an empty grid on mobile`.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: One or two sentences.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected instead
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: Numbered steps from a known starting point, including the URL or route.
      placeholder: |
        1. Open /saisons/2026
        2. Switch to Spieltag 4
        3. …
    validations:
      required: true

  - type: dropdown
    id: where
    attributes:
      label: Where
      description: If the problem is specific to one season, say which in the steps above.
      options:
        - Public pages
        - Season pages
        - Admin
        - Team area
        - Personal pages (account, player or referee)
        - Not sure
    validations:
      required: true

  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: >
        A screenshot or console error. **If an error page was shown, include the time it
        happened, to the minute**: the time and the address pin the server's log entry.
    validations:
      required: false

  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: Firefox 141, Android phone, dark theme
    validations:
      required: false
