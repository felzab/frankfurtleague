name: Idea or change request
description: Something the site should be able to do, or should do differently
title: "Area: "
labels: [enhancement]

body:
  - type: markdown
    attributes:
      value: |
        Ideas are welcome here, including ones that aren't fully thought through yet.

        Keep the title in the shape `Area: what should be possible`, for example
        `Spielplan: filter the fixture list by team`.

  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: >
        What are you trying to do, and what makes it hard today? Describe the problem rather than a
        solution: the problem often has a cheaper answer than the one that prompted the request.
    validations:
      required: true

  - type: dropdown
    id: affects
    attributes:
      label: Who it affects
      options:
        - Just me
        - Everyone visiting the site
        - Contact people
        - Pupils
        - Referees
        - Admins
        - One team or one season
    validations:
      required: true

  - type: textarea
    id: workaround
    attributes:
      label: What you do instead today
      description: If there is a workaround, even an annoying one.
    validations:
      required: false

  - type: dropdown
    id: severity
    attributes:
      label: How much it matters
      options:
        - Nice to have
        - Annoying
        - Blocking something
    validations:
      required: true
