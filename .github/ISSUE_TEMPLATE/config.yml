# Blank issues stay enabled: a report that fits no form is better filed shapelessly than not filed
# at all.
blank_issues_enabled: true

contact_links:
  - name: Security vulnerability
    url: https://github.com/felzab/frankfurtleague/security/policy
    about: Never file a suspected vulnerability as a public issue. The security policy names the address to report one to and what to include.
  - name: A question about the league
    url: https://frankfurtleague.de/contact
    about: Questions about the league itself, its seasons, teams or matches, go to the league through its contact page.
