version: 2

# The governing constraint is noise, not coverage: ungrouped weekly updates across the ecosystems
# below would open dozens of pull requests a month, each triggering the full `verify` gate, and none
# would be read. Monthly and grouped per ecosystem for minor and patch bumps; a major stays its own
# pull request, because those are the ones that need a changelog read. `github-actions`, `docker`
# and `docker-compose` are weekly, being the three no security update reaches, the gate's linters
# aside, which production never runs.
#
# Invariants:
# - Security updates arrive from Dependabot alerts, not from here, and ignore this schedule;
#   `github-actions`, `docker` and `docker-compose` get none, and a dependency an `ignore` names
#   whole gets none either.
# - Every ecosystem sets the same cooldown, so a release compromised at publication can be yanked
#   before a pull request proposes it — where its registry dates it, unlike `ghcr.io`. A security
#   update is exempt from it, but pnpm's strict `minimumReleaseAge` still refuses a release under a
#   day old, so a frontend security update goes green on a re-run after 24 hours.
# - Each ecosystem sets a commit prefix, so its messages open with one of the repository's scopes.
# - No ecosystem below reads an image a workflow's step names in a string, so these two are kept by
#   hand: Playwright's and BuildKit's in the verify workflow's `journeys` and `images` jobs. Every
#   image a script or a test runs is read from a file an ecosystem below moves.

updates:
  # --- GitHub Actions -------------------------------------------------------------------------

  # Weekly: GitHub raises no alert for an action pinned to a commit SHA and every `uses:` naming a
  # repository is pinned that way, so for actions this scheduled run IS the coverage rather than a
  # convenience. A fix therefore arrives one interval plus one cooldown after disclosure, at worst.
  #
  # `/` is not the repository for this ecosystem: it means the root `action.yml` plus
  # `.github/workflows/`, and reaches no composite action. The glob over `.github/actions` is what
  # watches a local action added later, without a config edit.
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    # Explicit: the default of 5 is reachable here, and hitting it silently stops version updates --
    # this ecosystem's only security route.
    open-pull-requests-limit: 10
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Frontend (pnpm) ------------------------------------------------------------------------

  # `packageManager`, which pins pnpm itself, and `engines.pnpm`, its floor, are deliberately
  # unmanaged: bumping the package manager is a decision, not a routine update, and the frontend
  # image's `ARG PNPM_VERSION` moves with the pin.
  #
  # A package `patchedDependencies` keys to its version cannot move here: pnpm refuses the update
  # with ERR_PNPM_UNUSED_PATCH, which Dependabot reports in its log under Insights -> Dependency
  # graph -> Dependabot. The move is by hand, once the patch is re-read.
  - package-ecosystem: npm
    directory: /fl_frontend
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Frontend deps"
    # A dependency joins the first group it matches. These two each need a hand step on the bot's
    # branch, the journeys' Playwright image pin and `pnpm run contract`, so they move apart and
    # leave the rest's pull request green.
    groups:
      frontend-hand-steps:
        patterns: ["@playwright/test", "orval"]
        update-types: ["minor", "patch"]
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Held by hand: three majors; an entry goes when its reason does.
      # typescript-eslint's peer range ends below TypeScript 7, which ships without the API it reads.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # eslint-plugin-react, -import and -jsx-a11y, which eslint-config-next brings, end their peer
      # ranges at ESLint 9.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      # 4.x takes its merge configuration only through an entry that ships tailwind-merge's table
      # compiler to the browser, about 14 KB gzip on every page.
      - dependency-name: tailwind-variants
        update-types: ["version-update:semver-major"]

  # --- Backend (uv) ---------------------------------------------------------------------------

  # Requires Dependabot's uv support, which reads uv.lock. Where a run reports the ecosystem as
  # unsupported, read the log under Insights -> Dependency graph -> Dependabot before assuming the
  # paths are wrong.
  - package-ecosystem: uv
    directory: /fl_backend
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Backend deps"
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # pydantic pins pydantic-core exactly, so every update attempt here resolves unsatisfiably;
      # ignoring it loses nothing, because pydantic's own pin still moves it. The entry stands while
      # the application imports pydantic_core directly.
      - dependency-name: pydantic-core

  # --- Base images ----------------------------------------------------------------------------

  # Both Dockerfiles pin their base image, and the backend's `FROM ghcr.io/astral-sh/uv ... AS uv`
  # stage is a second image in the same file. CI's `images` job runs on the pull request itself, so
  # a base-image bump proves both images build before it merges.
  #
  # Each `FROM` names a tag and its digest, and this ecosystem rewrites the two together; the
  # compose ecosystem below does the same for every image either stack names. It moves the `FROM`
  # line alone, so its pull request for a new Node or uv stays red until the pin moves on the same
  # branch.
  #
  # No security update reaches this ecosystem, so a Node or Python security release waits for this
  # schedule and its cooldown: weekly, so eight days at worst.
  - package-ecosystem: docker
    directory: /fl_frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Frontend image"
    groups:
      frontend-image-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # A new major moves the whole frontend, `devEngines` and the lockfile with it, by hand.
      - dependency-name: node
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /fl_backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Backend image"
    groups:
      backend-image-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # A new series moves the whole backend, `fl_backend/.python-version` with it, by hand; a release
      # candidate's tag (`3.15.0rc2`) reads as a minor update, so this keeps it out too.
      - dependency-name: python
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  # The gate's linters: this folder's Dockerfile is never built, and its `FROM` lines are the one
  # place shellcheck, actionlint and lychee are pinned. Monthly, since production runs none of them.
  # A major stays its own pull request, since a linter's major is where new findings arrive.
  - package-ecosystem: docker
    directory: /scripts/gate
    schedule:
      interval: monthly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Repo"
    groups:
      gate-tools-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Stack images ---------------------------------------------------------------------------

  # A separate ecosystem from `docker`, which reads Dockerfiles and Kubernetes manifests and would
  # not open either compose file. This one reads `services.*.image` in both root compose files, so
  # the image the stacks put in front of the application is watched like any other dependency.
  #
  # An image whose tag carries no version yields nothing here -- there is no comparison to make --
  # so a floating tag is a silent opt-out rather than an update nobody sees. This repository's own
  # two images are such, their tag being the `${TAG:?…}` the deploy sets, so no bot proposes a
  # deploy.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 1
    commit-message:
      prefix: "Ops"
    groups:
      stack-images-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The 8.0 series the managed cluster runs, so no test passes on a feature production lacks.
      - dependency-name: mongo
        versions: [">= 8.1"]
