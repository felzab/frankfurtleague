version: 2

# Dependency version updates for a single-maintainer repository.
#
# The governing constraint is noise, not coverage: ungrouped weekly updates across the ecosystems
# below would open dozens of pull requests a month, each triggering the full `verify` gate, and none
# would be read. Monthly and grouped per ecosystem for minor and patch bumps; a major stays its own
# pull request, because those are the ones that need a changelog read.
#
# Invariants:
# - Security updates arrive from Dependabot alerts, not from here, and ignore this schedule.
# - Each ecosystem sets a commit prefix, so messages keep docs/_git/templates.md's shape.

updates:
  # --- GitHub Actions -------------------------------------------------------------------------

  # The highest-value ecosystem here and the cheapest to review: few dependencies, small diffs, and
  # an outdated action is a supply-chain exposure that nothing else in the repo would surface.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "CI"
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Frontend (pnpm) ------------------------------------------------------------------------

  # Dependabot reads pnpm-lock.yaml natively. `packageManager` and `engines.pnpm` pin pnpm itself
  # and are deliberately unmanaged -- bumping the package manager is a decision, not a routine
  # update.
  - package-ecosystem: npm
    directory: /fl_frontend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Frontend deps"
    groups:
      frontend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # --- Backend (uv) ---------------------------------------------------------------------------

  # Requires Dependabot's uv support, which reads uv.lock. Where a run reports the ecosystem as
  # unsupported, read the log under Insights -> Dependency graph -> Dependabot before assuming the
  # paths are wrong.
  - package-ecosystem: uv
    directory: /fl_backend
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "Backend deps"
    groups:
      backend-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # pydantic pins pydantic-core exactly, so every update attempt here resolves unsatisfiably;
      # ignoring it loses nothing, because pydantic's own pin still moves it. The entry stands while
      # `fl_backend/app/shared/schemas/custom.py` imports pydantic_core.
      - dependency-name: pydantic-core

  # --- Base images ----------------------------------------------------------------------------

  # Both Dockerfiles pin their base image. A Dockerfile change triggers the `images` CI job on the
  # pull request itself (.github/workflows/verify.yml), so a base-image bump proves both images
  # build before it merges.
  - package-ecosystem: docker
    directory: /fl_frontend
    schedule:
      interval: monthly
    commit-message:
      prefix: "Frontend image"

  - package-ecosystem: docker
    directory: /fl_backend
    schedule:
      interval: monthly
    commit-message:
      prefix: "Backend image"
