name: verify

on:
  pull_request:
  push:
    # A push run is the one writer of its branch's caches, which every pull request into that branch
    # restores, and on main alone it publishes.
    branches: [main, follow-up]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. Only the publish job widens it, for its push.
permissions:
  contents: read

# The keyword, never a hand-copied `bash -eo pipefail {0}`: GitHub expands `bash` to that plus
# `--noprofile --norc`, and a builtin cannot drift.
defaults:
  run:
    shell: bash

env:
  # How long a cache restore waits on a stuck download before the job goes on without the cache, in
  # minutes. Its default, 10, outlasts the jobs given 5 or 8, which a stuck restore would cancel
  # instead; every job's `timeout-minutes` stays above it. A warm restore takes seconds.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on a push, whose run writes the caches its branch's
  # pull requests restore, and on main publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job's `timeout-minutes` bounds a hang rather than predicting a duration: four times the job's
# slowest time in the green runs of this workflow on record when it was set, room for a runner four times
# slower, rounded up to whole minutes and never under 5.
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
      # No script or test of the scope imports the application.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the scripts scope
        run: ./scripts/gate/verify.sh --scripts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the docs scope
        run: ./scripts/gate/verify.sh --docs

  # prettier and its plugins are dependencies of fl_frontend, so the check needs that install even
  # though what it reads is mostly outside it.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the format scope
        run: ./scripts/gate/verify.sh --format

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: pyright and the suite import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
          # The uv cache's one writer: on a miss every saving job would archive the whole cache.
          save-cache: true
      - name: Run the backend scope
        run: ./scripts/gate/verify.sh --backend

  # Both db tiers: the `db`-marked backend tests and the frontend's `*.db.test.*` files; and the
  # contract check, which regenerates openapi.json and the client from it and diffs both, needing
  # both toolchains.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: the db tier's tests import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the db scope
        run: ./scripts/gate/verify.sh --db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Every `next` command a step runs.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scope's typegen, tsc, lint and knip read the installed tree, so it is the job.
      - uses: ./.github/actions/frontend-toolchain
        with:
          # The pnpm store's one writer, and on a push alone: every install rewrites the patched
          # dependency's record in the store, so pnpm/setup's check for an unchanged store never holds
          # and every save is a new entry of about 225 MB. A pull request restores a store its base
          # branch's push or main's wrote, both of which GitHub lets it read, and fetches what its own
          # lockfile adds on each of its runs.
          save-cache: ${{ github.event_name == 'push' }}
      - name: Run the frontend scope
        run: ./scripts/gate/verify.sh --frontend
      - name: Fail if the frontend scope rewrote tsconfig.json
        # `next typegen` writes fl_frontend/tsconfig.json for any compilerOptions key that is absent
        # and carries on; on a runner the repaired copy is discarded with the workspace, so a
        # framework upgrade reaches this with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::the frontend scope rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm typegen' and commit the result."
            exit 1
          fi

  frontend-units:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the frontend-units scope
        run: ./scripts/gate/verify.sh --frontend-units

  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkers' interpreter, which needs no package, and zizmor beside it.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the ops scope
        # zizmor runs its online audits here alone, reading GitHub's API with the job's read-only
        # token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./scripts/gate/verify.sh --ops

  # Both images, built side by side in one bake through Docker's own action, which carries the Actions
  # layer cache. Each is written to a file and loaded, so a push hands the publish job exactly the
  # bytes checked here.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    # What the publish job holds the artifact to. A job's outputs are written by that job alone, where
    # any job of the run holding its runtime token can delete the artifact and upload another under
    # its name, as upload-artifact's `overwrite` does.
    outputs:
      frontend-tag: ${{ steps.bind.outputs.frontend-tag }}
      frontend-sha256: ${{ steps.bind.outputs.frontend-sha256 }}
      backend-tag: ${{ steps.bind.outputs.backend-tag }}
      backend-sha256: ${{ steps.bind.outputs.backend-sha256 }}
    env:
      FRONTEND_IMAGE: ghcr.io/felzab/frankfurtleague-frontend
      BACKEND_IMAGE: ghcr.io/felzab/frankfurtleague-backend
      VERIFY_TAG: frankfurtleague-verify
      # No build summary, and with it no build record exported and uploaded in the build's post step:
      # nothing reads either, and both sit on the path every later job waits on.
      DOCKER_BUILD_SUMMARY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The docker driver cannot export a build cache; the container driver this creates can. Its
      # BuildKit daemon writes both tarballs before `bind` hashes them, so it is pinned by tag and
      # digest like every image the stack runs; no Dependabot ecosystem reads this string, so a bump is
      # by hand.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.34.2@sha256:c5f8862f52499773af85bc07695b2379ef08e8002352b0df2c4864c91d78dabe
          # The runner is discarded with the job, builder and all, so removing the builder in the
          # post step would buy nothing but the wait for it.
          cleanup: false
      # `sha-<commit>` as the version, the tag a deploy pins and the one each image is stamped with,
      # and the OCI labels both images carry. No `images`, so the version is the one tag it computes,
      # and each image's target names its own repository before it.
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          tags: type=sha
      - name: Build both images
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          APP_VERSION: ${{ steps.meta.outputs.version }}
          TARBALL_DIR: ${{ runner.temp }}
          # A push reads no cache, so no planted cache entry reaches an image a push publishes, and a
          # push alone writes one, into its branch's scope. A pull request restores its own merge ref's
          # caches, its base branch's and the default branch's, so what it wrote would serve its own
          # later runs alone, each paying the export.
          READ_CACHE: ${{ github.event_name != 'push' }}
          WRITE_CACHE: ${{ github.event_name == 'push' }}
        with:
          # The checkout as the build context, where the action's default is a Git context BuildKit
          # fetches for itself.
          source: .
          files: |
            ./docker-bake.hcl
            cwd://${{ steps.meta.outputs.bake-file-labels }}
      # On every event, so a pull request's run proves the outputs a push publishes by.
      - name: Record each tarball's digest and each image's tag
        id: bind
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          record() { # $1 the output prefix, $2 the image's reference, $3 the tarball
            local digest
            digest="$(sha256sum "$3" | cut -d ' ' -f 1)"
            printf '%s-tag=%s\n%s-sha256=%s\n' "$1" "$2" "$1" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s: %s, tarball sha256 %s\n' "$1" "$2" "$digest"
          }
          record frontend "${FRONTEND_IMAGE}:${VERSION}" "${RUNNER_TEMP}/frontend.tar"
          record backend "${BACKEND_IMAGE}:${VERSION}" "${RUNNER_TEMP}/backend.tar"
      - name: Load both images
        run: |
          docker load --input "${RUNNER_TEMP}/frontend.tar"
          docker load --input "${RUNNER_TEMP}/backend.tar"
      - name: Run the images scope
        env:
          VERIFY_IMAGES_BUILT: "1"
        run: ./scripts/gate/verify.sh --images
      # On every event, the images the journeys job raises its stack from; on a push, also the images
      # the publish job pushes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            ${{ runner.temp }}/frontend.tar
            ${{ runner.temp }}/backend.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are compressed already.
          compression-level: 0

  # The Playwright journeys against the end-to-end stack, raised from the images the images job built
  # from this commit, with the made-up seed.
  journeys:
    # Its images, built once by buildx: a compose build here runs on the runner's Docker Engine, whose
    # own Dockerfile frontend refuses the frontend Dockerfile's `COPY --exclude`, a Dockerfile 1.19
    # option that the images job's pinned BuildKit takes.
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 14
    # Two legs, each on a runner and a stack of its own, every case on every event. The journeys
    # split by Playwright project: a project's seeded people are its own, where a `--shard` would
    # split the cases of one project across two databases. `fail-fast: false`, or a red leg cancels
    # the other and its verdict is lost. `first-pass` depends on `administrator` alone, so it rides
    # the desktop leg.
    strategy:
      fail-fast: false
      matrix:
        include:
          - leg: desktop
            projects: --project=desktop --project=first-pass
          - leg: phone
            projects: --project=phone
    name: journeys (${{ matrix.leg }})
    env:
      # Chromium, WebKit and every library they load, so no run waits on the runner's apt mirror. Its
      # tag is the lockfile's Playwright, whose browser builds no other release finds, and no
      # Dependabot ecosystem reads this string, so a bump is by hand.
      PLAYWRIGHT_IMAGE: mcr.microsoft.com/playwright:v1.65.1-noble@sha256:1507cbfc550a63a6b7396791ca4f00df17beb56342d2447b3f106c306f525579
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Left running, so the pull of 26 to 41 s overlaps the install, the images and the stack's start
      # rather than waiting alone; a step's background process lives until the job ends. Its output
      # is dropped, since the step's own streams would otherwise stay open: where it failed, the
      # journeys' `docker run` pulls the image itself and says why it cannot.
      - name: Start pulling the image holding the browsers
        run: docker pull "$PLAYWRIGHT_IMAGE" > /dev/null 2>&1 &
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      # Under the names docker-compose.e2e.yml gives the two built services; the stack's script passes
      # `--no-build` to every `up`, so a name that does not match fails rather than building.
      - name: Load both images as the stack's
        run: |
          docker load --input "${RUNNER_TEMP}/images/frontend.tar"
          docker load --input "${RUNNER_TEMP}/images/backend.tar"
          docker tag frankfurtleague-verify:frontend frankfurtleague-e2e-frontend
          docker tag frankfurtleague-verify:backend frankfurtleague-e2e-backend
      # Chromium reads every address change in its network namespace as the network changing and fails
      # the requests still waiting for a connection with `net::ERR_NETWORK_CHANGED`, loopback's too, so
      # a page loses a chunk and never hydrates. The journeys share the runner's namespace, where the
      # bridge and the veths of a container gain a link-local address whose duplicate check ends one to
      # two seconds after the link comes up: nginx starts last, so that is the first journey's first
      # page. `default` reaches only interfaces made from here on, before any of Docker's for this
      # stack, and leaves the runner's own IPv6 as it is. No Docker option reaches a veth's host side,
      # and Chromium ignores no interface on Linux. A wait for the check would leave a restarted
      # container's address to fail a later journey.
      - name: Keep Docker's interfaces from changing an address under the browser
        run: sudo sysctl --write net.ipv6.conf.default.addr_gen_mode=1
      # The stack as `local.sh --e2e` raises it, its keys and its mail sink included, from the images
      # loaded above. The database and the backend start without a wait, so the database's pull and
      # both starts overlap the install below.
      - name: Start the database and the backend
        run: ./scripts/ops/e2e_stack.sh start
      # The image holds no Playwright package, so the journeys run from this install.
      - uses: ./.github/actions/frontend-toolchain
      # Each leg names its projects by hand, so a project added to playwright.config.ts alone would run
      # in no leg, every job green. Playwright's `--list` runs no test, and its JSON report gives every
      # project the config defines and the project of every test the legs' flags reach, their
      # `dependencies` included (https://playwright.dev/docs/test-reporters#json-reporter).
      - name: Fail if a Playwright project runs in no leg
        if: matrix.leg == 'desktop'
        working-directory: fl_frontend
        run: |
          legs="$(yq -r '.jobs.journeys.strategy.matrix.include[].projects' ../.github/workflows/verify.yml | tr '\n' ' ')"
          read -r -a flags <<< "$legs"
          defined="$(pnpm exec playwright test --list --reporter=json | jq -r '.config.projects[].name' | sort -u)"
          run="$(pnpm exec playwright test --list --reporter=json "${flags[@]}" | jq -r '.. | .projectName? // empty' | sort -u)"
          unrun="$(comm -23 <(printf '%s\n' "$defined") <(printf '%s\n' "$run"))"
          if [ -n "$unrun" ]; then
            echo "::error::Playwright projects no journeys leg runs: $(printf '%s' "$unrun" | tr '\n' ' ')"
            exit 1
          fi
      - name: Seed the stack and start the rest
        run: ./scripts/ops/e2e_stack.sh serve
      # A runner image or an engine that gives a veth its address after all would otherwise surface as a
      # journey failing now and then on a chunk, naming nothing of this.
      - name: Judge that no veth holds an IPv6 address
        run: |
          # `ip address show type veth` printed lo and eth0 on the runner, so the name decides: Docker names its host side veth*.
          addresses="$(ip -6 -oneline address show | grep -E '^[0-9]+: veth' || true)"
          if [ -n "$addresses" ]; then
            printf '%s\n' "$addresses"
            echo "::error::A veth holds an IPv6 address, so Chromium can read a change of it as the network changing."
            exit 1
          fi
      # One step in the image, never a job-level `container:`: that job's steps would hold no docker to
      # raise the stack with, and its `options` refuse `--network`. The runner's network, because the
      # journeys' origin is `localhost`, the passkeys' relying party. The runner's user, so the mail
      # sink reads as it reads on the runner, and the report steps read what the run writes. The
      # checkout's own path, because the install's links are absolute and the `github` reporter's
      # annotations name files relative to it. The install's own launcher, because the image holds no
      # pnpm; it runs under the Node `devEngines` pins rather than the image's.
      - name: Run the journeys
        env:
          PROJECTS: ${{ matrix.projects }}
        run: |
          # The leg's flags, one word each.
          read -r -a projects <<< "$PROJECTS"
          docker run --rm --init --ipc=host --network=host \
            --user "$(id -u):$(id -g)" \
            --volume "${GITHUB_WORKSPACE}:${GITHUB_WORKSPACE}" \
            --workdir "${GITHUB_WORKSPACE}/fl_frontend" \
            --env CI --env GITHUB_WORKSPACE \
            "$PLAYWRIGHT_IMAGE" \
            node_modules/.bin/playwright test "${projects[@]}"
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # One name per leg: upload-artifact refuses a second artifact under a name the run holds.
          name: journeys-report-${{ matrix.leg }}
          path: .tmp-playwright/
          # A dot directory, which the action leaves out by default: without this a failed run
          # uploads nothing and says so in a warning alone.
          include-hidden-files: true
          retention-days: 7
      - name: The stack's logs, on a failure
        if: failure()
        env:
          # The files and the tag `scripts/ops/e2e_stack.sh` raises the stack with.
          COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml:docker-compose.e2e.yml
          TAG: e2e
        run: docker compose logs --no-color --tail=200

  # THE REQUIRED STATUS CHECK, which the ruleset names. `always()`: the verdict is the steps below,
  # never GitHub's reading of a job skipped over a failed need.
  verify:
    needs: [scripts, docs, format, backend, db, frontend, frontend-units, ops, images, journeys]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # First, so it prints whether or not the verdict below refuses: a red `verify` names no job.
      - name: Report each scope's result
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/verify.yml
          sparse-checkout-cone-mode: false
      # A job left out of `needs:` never decides a merge, and nothing in a diff says so. `publish`
      # runs after this job, on a push alone, so it is the one job this one may not need.
      - name: Fail if a job is missing from verify's needs
        run: |
          workflow=.github/workflows/verify.yml
          jobs="$(yq -r '.jobs | keys | .[] | select(. != "verify" and . != "publish")' "$workflow" | sort)"
          needed="$(yq -r '.jobs.verify.needs[]' "$workflow" | sort)"
          if [ "$jobs" != "$needed" ]; then
            echo "::error::verify's needs and the workflow's jobs differ, so a job that is not needed decides no merge -- every job but verify and publish belongs in needs."
            diff <(printf '%s\n' "$jobs") <(printf '%s\n' "$needed") || true
            exit 1
          fi
          echo "verify needs every job: $(printf '%s' "$jobs" | tr '\n' ' ')"
      # Every event runs every scope (`docs/decisions.md`, **ci**), so a skip is a condition someone
      # added. Pure expressions, no shell parsing of the needs context.
      - name: Fail if any scope job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A scope job failed, was cancelled or was skipped -- the scope results above name it, and its own log has the findings."
          exit 1

  # On a push to main that `verify` passed, both images the images job built and checked are pushed
  # under their `sha-<commit>` tags, building and checking nothing again.
  publish:
    # `images` for its outputs, which only a job named here can read.
    needs: [verify, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Not set from a measured time, as every other job's is: it runs on main alone, so no pull request's
    # run times it.
    timeout-minutes: 15
    # A job-level grant replaces the workflow's whole: the push alone, which the package grants this
    # repository's workflows. The artifact comes through the run's own runtime token.
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      # Before the registry login, so a replaced tarball never reaches a step holding the push grant.
      # download-artifact's own digest check reads the run's artifact listing, which describes a
      # replacement as faithfully as the original. `--strict` refuses an empty output's line.
      - name: Refuse a tarball other than the one the images job checked
        env:
          FRONTEND_SHA256: ${{ needs.images.outputs.frontend-sha256 }}
          BACKEND_SHA256: ${{ needs.images.outputs.backend-sha256 }}
        run: |
          printf '%s  %s\n' \
            "$FRONTEND_SHA256" "${RUNNER_TEMP}/images/frontend.tar" \
            "$BACKEND_SHA256" "${RUNNER_TEMP}/images/backend.tar" \
            | sha256sum --strict --check -
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The one reference the images job recorded for each, never `--all-tags`: a tarball may name
      # any tag, and only the one the images job checked is published.
      - name: Push both images
        env:
          FRONTEND_TAG: ${{ needs.images.outputs.frontend-tag }}
          BACKEND_TAG: ${{ needs.images.outputs.backend-tag }}
        run: |
          docker load --input "${RUNNER_TEMP}/images/frontend.tar"
          docker load --input "${RUNNER_TEMP}/images/backend.tar"
          docker push "$FRONTEND_TAG"
          docker push "$BACKEND_TAG"
