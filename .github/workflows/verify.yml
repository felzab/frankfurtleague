name: verify

# The gate that `scripts/verify.sh` is, run as parallel jobs mapped to the surfaces a change
# touches. The `changes` job diffs the pull request against its base and turns paths into scope
# flags; each job below runs one `verify.sh` scope and starts only when its scope is touched --
# except `frontend`, which runs the same mapping itself and skips its own steps on a false.
#
# Invariants:
# - A push to main runs every scope unconditionally, which also backstops the path mapping.
# - Every job is held to the wall-clock budget its row in .github/gate-wall-clock.tsv gives it, by
#   the aggregate job and on every event; nothing about the budget is advisory.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. This workflow publishes nothing and comments on nothing.
permissions:
  contents: read

# The keyword, never a hand-copied `bash -eo pipefail {0}`: GitHub expands `bash` to that plus
# `--noprofile --norc`, and a builtin cannot drift. It replaces an UNSPECIFIED shell, whose `-e`
# alone lets a mid-pipe failure be masked by the last stage.

# What the expansion does NOT carry is `-u`, and this does not add it: it makes each unset variable
# in a `run:` block a hard failure, a walk only actionlint could vouch for.
defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on main: a main run answers whether the tree is
  # deployable, and cancelling one leaves that question open. It is not a result per commit — a
  # concurrency group holds a single pending run, so three merges in quick succession replace the
  # middle one's queued run with the newest before it ever starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The path-to-scope mapping lives in scripts/ci_scopes.sh — one copy, covered by selfcheck and
  # shellcheck — and this job only feeds its stdout to $GITHUB_OUTPUT. It errs conservative: an
  # unrecognised path turns every scope on.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.map.outputs.scripts }}
      docs: ${{ steps.map.outputs.docs }}
      backend: ${{ steps.map.outputs.backend }}
      db: ${{ steps.map.outputs.db }}
      frontend: ${{ steps.map.outputs.frontend }}
      ops: ${{ steps.map.outputs.ops }}
      images: ${{ steps.map.outputs.images }}
      format: ${{ steps.map.outputs.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
          # Full history: the mapping diffs against the merge base with the target branch.
          fetch-depth: 0

      - name: Map changed paths to scopes
        id: map
        # Values reach the script through env, never by interpolating `${{ }}` into `run:`; the
        # reason is written out in .github/workflows/pr-body.yml.
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./scripts/ci_scopes.sh "origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci_scopes.sh --all >> "$GITHUB_OUTPUT"
          fi

      - name: Report the branch's line delta
        # The re-bloat glance: a per-bucket line delta in the run summary, so growth is visible on
        # the pull request adding it. Advisory by construction — no threshold, no verdict, and
        # continue-on-error keeps a failure away from this job's outputs.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # --no-renames: a rename counts as its full add and delete in one bucket, netting zero,
          # where a rename spec's combined spelling would classify as neither side.
          git diff --numstat --no-renames "$base" HEAD | awk -F'\t' -v base="$base" '
            $1 == "-" { next }
            {
              b = "product code"
              if ($3 == "fl_backend/openapi.json" || $3 ~ /(^|\/)(pnpm-lock\.yaml|uv\.lock)$/) b = "generated"
              else if ($3 ~ /^(fl_backend|scripts)\/tests\// || $3 ~ /\.test\.(ts|tsx)$/) b = "tests"
              else if ($3 ~ /\.md$/ || $3 ~ /^docs\//) b = "documentation"
              else if ($3 ~ /^(scripts|nginx|certs)\/|^\.|^docker-compose|(^|\/)(Dockerfile|\.[^\/]+)$/) b = "tooling"
              seen[b] = 1; add[b] += $1; del[b] += $2
            }
            END {
              n = split("product code,tests,documentation,tooling,generated", names, ",")
              net = 0
              for (i = 1; i < n; i++) net += add[names[i]] - del[names[i]]
              printf "### Line delta against merge base %.7s\n\n", base
              printf "**Net: %+d lines** (generated files excluded)\n\n", net
              print "| Bucket | Added | Removed | Net |"
              print "| --- | ---: | ---: | ---: |"
              for (i = 1; i <= n; i++) {
                b = names[i]
                if (seen[b]) printf "| %s%s | %d | %d | %+d |\n", b, (i == n ? " (excluded)" : ""), add[b], del[b], add[b] - del[b]
              }
            }
          ' >> "$GITHUB_STEP_SUMMARY"

  # Commit messages are checked in a job of their own, not in the docs job and not in `changes`:
  # they are the one thing with no path, so a frontend-only pull request would skip the docs scope
  # and merge unchecked -- while nothing waits on this job, so its backend install sits off the
  # critical path every scope job's `needs: changes` puts a step on.
  commits:
    # A push to main has no branch to measure, so the whole job is skipped rather than installing a
    # toolchain for a step that would not run.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the check reads this branch's commits against the merge base.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # setup-uv reads `[tool.uv] required-version` from the repository root alone, and the pin
          # lives in fl_backend's manifest. Without this line CI's uv is that day's latest, and
          # every `uv sync` below refuses the moment the two differ.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # The commit check runs on the interpreter fl_backend pins, never on whichever Python the
        # runner image happens to ship: one floor for every caller, so a check cannot pass here and
        # fail on a development machine over a language version.

        # `--locked` at every `uv sync` in this workflow: a bare sync REWRITES uv.lock in the working
        # tree, so a branch with a stale committed lockfile passes every later check against the
        # rewritten file. `--locked` refuses it; `--frozen` would accept it.

        # `--only-group dev` where no step imports the application: the checkers under scripts/ are
        # standard library, so the project and its graph stay uninstalled here. `docs`, `backend`
        # and `backend-db` keep `--dev`, those scopes importing `app`.
        working-directory: fl_backend
        run: uv sync --locked --only-group dev
      - name: Check the branch's commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: fl_backend/.venv/bin/python scripts/check_commits.py --base "origin/${BASE_REF}"
      - name: Hold a moved gate budget to its measurement
        # A budget or a reference raised in .github/gate-wall-clock.tsv carries a new measurement
        # stamp, or the pull request is refused here. This job, because it already has the venv
        # and the full history the base comparison reads, and nothing waits on it.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: fl_backend/.venv/bin/python scripts/check_gate_budget.py --base "origin/${BASE_REF}"

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # The scripts scope lints scripts/*.py with the repository's own ruff, which lives in this
        # venv. verify.sh resolves .venv/bin/python (Linux) itself.

        # The dev group alone, as at `commits`: scripts/pyrightconfig.json names no venv because
        # nothing there imports past the standard library, and scripts/tests imports the same set.
        working-directory: fl_backend
        run: uv sync --locked --only-group dev
      - name: Install the shellcheck the gate pins
        # The runner image ships its own shellcheck, and selfcheck.sh prefers a binary on PATH over
        # the image it pins -- so without this CI lints the branch against a different rule set from
        # a development machine, and says so only as an advisory that leaves the run green. The
        # version and the digest are read from selfcheck.sh rather than repeated here: a second copy
        # is a pair nothing compares, and that file carries the note about bumping both by hand.
        #
        # The digest is checked before anything is unpacked: a release asset can be replaced without
        # its tag moving, and this lands as root in a directory on PATH beside a checkout. Fetched to
        # a file rather than piped into tar, so a truncated stream is a mismatch rather than a
        # partial write nothing hashed.
        run: |
          version="$(sed -n 's/^SHELLCHECK_VERSION="\([0-9.]*\)"$/\1/p' scripts/selfcheck.sh)"
          digest="$(sed -n 's/^SHELLCHECK_LINUX_X86_64_SHA256="\([0-9a-f]*\)"$/\1/p' scripts/selfcheck.sh)"
          if [ -z "$version" ] || [ -z "$digest" ]; then
            echo "::error::no SHELLCHECK_VERSION or SHELLCHECK_LINUX_X86_64_SHA256 in scripts/selfcheck.sh -- a pin moved or its spelling changed."
            exit 1
          fi
          tarball="${RUNNER_TEMP}/shellcheck-v${version}.linux.x86_64.tar.xz"
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          if ! printf '%s  %s\n' "$digest" "$tarball" | sha256sum -c -; then
            echo "::error::the shellcheck tarball does not match the digest in scripts/selfcheck.sh -- nothing was installed."
            exit 1
          fi
          sudo tar -xJf "$tarball" --strip-components=1 -C /usr/local/bin "shellcheck-v${version}/shellcheck"
          shellcheck --version
      # Only typescript is wanted here, and a pnpm install is the only way to get it at the pinned
      # version. Without it the comment classifier's TypeScript half — the delicate one, and why it
      # parses rather than matching a regex — is exercised nowhere.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the scripts scope
        run: ./scripts/verify.sh --scripts

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the documentation gate diffs the branch against the merge base for its
          # branch-scoped checks and resolves commit ids prose names, neither of which a shallow
          # clone can do.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # verify.sh resolves .venv/bin/python (Linux) or .venv/Scripts/python.exe (Windows) itself.
        # `--dev`, not the dev group alone: this scope runs fl_backend/tests/openapi_document.py,
        # which imports the application.
        working-directory: fl_backend
        run: uv sync --locked --dev
      # The scope check classifies a changed .ts file through `scripts/check_scope.py`, whose
      # TypeScript half needs `scripts/ts_normalize.mjs`. Without the installed tree the answer
      # degrades to "code", and the run is asked for scopes it does not owe.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the docs scope
        run: ./scripts/verify.sh --docs

  # Prettier in check mode, for changes outside fl_frontend — docs, workflows, compose files —
  # which the formatter still governs. When the frontend job runs it already includes the same
  # check, so this one stands down.
  format:
    needs: changes
    if: needs.changes.outputs.format == 'true' && needs.changes.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # prettier and its plugins are dependencies of fl_frontend, so the check needs that install
      # even though what it reads is mostly outside it.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the format scope
        run: ./scripts/verify.sh --format

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        working-directory: fl_backend
        run: uv sync --locked --dev
      - name: Run the backend scope
        run: ./scripts/verify.sh --backend

  # The `db`-marked backend tests, which start a real mongod. A separate job rather than
  # a step in `backend`: jobs run concurrently, so the mongod pull costs no wall-clock time. The
  # marker belongs to the suite, not to this pipeline.
  backend-db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        working-directory: fl_backend
        run: uv sync --locked --dev
      - name: Pull the mongod image the db tier starts
        # INSTRUMENTATION, not a saving: the pull is inside the job span either way. As its own step
        # the download is attributed in the log rather than hidden in pytest's span -- a slow tier
        # told from a slow registry. The tag is read from the conftest.

        # No image cache beside this: the **ci** clause in `.claude/rules/ops.md` constrains exactly
        # that, so none is added here.

        # This job is a required status check and this step decides nothing, so it may not fail one
        # -- testcontainers pulls the image anyway. Same flag, same reason, as the advisory steps
        # below.
        continue-on-error: true
        # One process, no pipe: `sed | head` exits 141 under `pipefail` when the reader closes
        # first, which is a bare 141 with nothing printed, the guard below never having run.
        run: |
          image="$(awk -F'"' '/Container\("mongo:/ { print $2; exit }' fl_backend/tests/conftest.py)"
          if [ -z "$image" ]; then
            echo "::error::no mongo image tag found in fl_backend/tests/conftest.py -- the spelling this step reads has moved."
            exit 1
          fi
          docker pull "$image"
      - name: Run the db scope
        run: ./scripts/verify.sh --db

  # Off `needs: changes`, alone among the scope jobs: the longest job is the run's binder, and
  # waiting on a whole job for one boolean cost it that job's span plus a queue. Its first step runs
  # scripts/ci_scopes.sh itself and gates every later step.

  # A job that maps its scope off and ends green has the semantics `skipped` already has in the
  # aggregate below, decided by the same mapping -- which stays one copy, in one script.

  # §7's "let the comment classifier shrink a CI job" does not bind this: the mapping is
  # ci_scopes.sh's PATH mapping, the one `changes` already shrinks every other job by, and not
  # scripts/check_scope.py's comment classifier.

  # The `changes` job still emits `frontend`, because `format`'s condition reads it -- without that,
  # `format` would run beside this job and prettier twice per push.
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # CI runs `pnpm build` on the runner host, never inside the image, so none of the Dockerfile's
    # ENV lines apply. These reproduce them across its base and builder stages;
    # `fl_frontend/Dockerfile` is the authority, and the two move together.
    env:
      # `next build` evaluates modules that read the environment, and a clean checkout has no .env,
      # so the startup gate rejects every variable and the build dies. The schema is still enforced
      # for real by local.sh and on every deploy.
      SKIP_ENV_VALIDATION: "true"
      # Needed even with validation skipped: `fl_frontend/src/core/db.ts` constructs a MongoClient at
      # MODULE SCOPE, and `new MongoClient(undefined)` throws. Same placeholder the Dockerfile uses.
      MONGODB_URI: mongodb://localhost:27017/placeholder
      # The Dockerfile disables telemetry in its base stage; the runner is not that image.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, where depth 1 served before: ci_scopes.sh diffs against the merge base
          # with the target branch and refuses without one. The extra fetch is a real subtraction
          # from what skipping `changes` saves -- the pack is small, not free.
          fetch-depth: 0
      - name: Map changed paths to scopes
        id: map
        # The two arms are the `changes` job's, verbatim: a pull request diffs against its base, a
        # push to main turns every scope on. Values reach the script through env, never `${{ }}`
        # in `run:`; the reason is written out in .github/workflows/pr-body.yml.
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./scripts/ci_scopes.sh "origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci_scopes.sh --all >> "$GITHUB_OUTPUT"
          fi
      - if: steps.map.outputs.frontend == 'true'
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # NOT unused, and this is the job where that is hardest to see: no step here runs python,
        # yet `scripts/gate_pool.py` -- which starts this scope's checks together -- needs one at
        # the checkers' floor, above this image's own.

        # Without it `scripts/_lib.sh :: any_python` falls back to the runner's python3, the pool
        # probe zeroes `scripts/verify.sh :: STEP_JOBS`, and the scope silently costs the sum of
        # its checks rather than the longest.

        # The dev group alone, as at `images`, the other job wanting this venv for the pool alone.
        if: steps.map.outputs.frontend == 'true'
        working-directory: fl_backend
        run: uv sync --locked --only-group dev
      # The scope builds the application, so the installed tree is the job.
      - if: steps.map.outputs.frontend == 'true'
        uses: ./.github/actions/frontend-toolchain
      # The source trees are in the key, not the lockfile alone: a key coarser than what the cache
      # depends on hits exactly every run, and actions/cache does not write on an exact hit. The
      # prefix restore is safe because the Next cache is content-addressed.
      - if: steps.map.outputs.frontend == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fl_frontend/.next/cache
          key: nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-${{ hashFiles('fl_frontend/src/**', 'fl_frontend/next.config.ts') }}
          restore-keys: |
            nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-
      - name: Run the frontend scope
        if: steps.map.outputs.frontend == 'true'
        run: ./scripts/verify.sh --frontend
      - name: Fail if the frontend scope rewrote tsconfig.json
        if: steps.map.outputs.frontend == 'true'
        # `next typegen` and `next build` both write fl_frontend/tsconfig.json for any compilerOptions
        # key that is absent -- one presence check, Next's `writeConfigurationDefaults`, documented at
        # that file's `allowJs` line -- then carry on.

        # The scope runs typegen first, so it is typegen's write this diff sees and the build then
        # finds nothing to add; either way every reader after it checked a config the committed file
        # does not hold.

        # Locally the dirty tree is visible; on a runner the repaired copy is discarded with the
        # workspace, and a framework upgrade reaches this condition with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::the frontend scope rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm typegen' and commit the result."
            exit 1
          fi

  # The compose files and nginx's prod.conf have no compiler and no test suite; this scope is the
  # only thing standing between a typo in either and a failed deploy.
  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # `any_python` falls back to the runner's python3, which is under the checkers' floor on
        # this image, and the ops scope degrades "could not run" to a skip — so without this venv
        # the job is green having never compared the compose files.

        # The dev group alone, as at `commits`: the mirror check is standard library.
        working-directory: fl_backend
        run: uv sync --locked --only-group dev
      - name: Run the ops scope
        run: ./scripts/verify.sh --ops

  # Both image builds plus the instrumentation.js presence check — the failures no other scope can
  # see, because the frontend scope builds on the runner and never inside the image.
  # `scripts/ci_scopes.sh` lists the packaging inputs that select it.
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at `commits`.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # The two builds start together only through `scripts/gate_pool.py`, which needs a python at
        # the checkers' floor -- above this image's own. Without this venv the scope costs their sum
        # rather than the longer of the two, against the timeout above.

        # The dev group alone, as at `commits`: the pool is standard library, and each Dockerfile
        # installs its own tree inside the build.
        working-directory: fl_backend
        run: uv sync --locked --only-group dev
      # buildx talks to the Actions cache service itself, so there is no actions/cache
      # step and no cache directory to carry. This action exists because the runner injects the
      # service credentials into JavaScript actions alone.
      - uses: ./.github/actions/actions-runtime-env
      - name: Create a cache-capable builder
        # The default docker driver cannot export a build cache; the container driver can, and the
        # script's --load brings the built image back to the daemon for the instrumentation check.
        run: docker buildx create --use
      - name: Run the images scope
        env:
          VERIFY_IMAGES_CACHE: gha
        run: ./scripts/verify.sh --images

  # THE REQUIRED STATUS CHECK. The ruleset on main requires a check named `verify`; this job is it.
  # It runs on every event, so path filtering can never leave the required check hanging.
  verify:
    needs: [changes, commits, scripts, docs, format, backend, backend-db, frontend, ops, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level grant replaces the workflow-level one whole, so `contents` is spelled again here
    # for the sparse checkout below; the runs API the wall-clock report and the budget check read
    # needs `actions`.
    permissions:
      actions: read
      contents: read
    steps:
      # First, so it prints whether or not the verdict below refuses. A green `verify` says nothing
      # about which scopes ran, and a mapping that turned every scope off looks identical to a
      # change that genuinely touched nothing — this is where the difference is readable.
      - name: Report each scope's result
        # This job IS the required status check, so nothing diagnostic in it may decide a merge. The
        # verdict is the step below and only that step; a report that cannot format its own output
        # is annotated in the run and changes no outcome.
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Read the wall-clock reference and the budget check
        # Three files out of the tree, sparse rather than a full checkout: this job runs on every
        # event and owes the required check its start time. Without `continue-on-error`, because
        # the budget step at the end of this job decides: a checkout it cannot read from is that
        # step refusing, never a verdict skipped. The report still answers a missing reference by
        # saying so and stopping.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout, for the reason the changes job gives above.
          persist-credentials: false
          sparse-checkout: |
            .github/gate-wall-clock.tsv
            scripts/check_gate_budget.py
            scripts/checker_kernel.py
          sparse-checkout-cone-mode: false

      - name: Report the gate's wall clock
        # The re-bloat glance for time: per-job medians over the last window of main runs against a
        # reference table held in the tree. Advisory by construction — nothing here decides an
        # outcome, and continue-on-error keeps it away from the verdict this job is.
        continue-on-error: true
        # Main pushes only, because they alone run every scope: a pull request's jobs are
        # path-filtered, so no window cut from them compares like for like.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          window=12
          reference=.github/gate-wall-clock.tsv
          state="${RUNNER_TEMP}/wall-clock-state"
          # An annotation as well as a summary block. This step cannot fail — it sits inside the
          # required check and decides nothing — so to anyone reading the checks list rather than
          # the summary, a run that could compare nothing looks exactly like a clean one. That is
          # not a rare state: a window is short until twelve main runs are on record, and runs age
          # out of the API on their own.
          no_comparison() {
            echo "::warning title=Gate wall clock::${1}"
            {
              printf '### Gate wall clock — no comparison\n\n'
              printf '%s\n\n' "$1"
              printf 'Nothing in this run says whether the gate has got slower.\n'
            } >> "$GITHUB_STEP_SUMMARY"
          }
          if [ ! -s "$reference" ]; then
            no_comparison "The reference table $reference was not read, so there is nothing to compare against."
            exit 0
          fi
          # `completed`, not `success`: a run that failed still carries jobs that succeeded, and
          # discarding the whole run throws their timings away. It excludes the run doing the
          # reporting, which is still in flight.
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?branch=main&event=push&status=completed&per_page=${window}" --jq '.workflow_runs[].id')"
          count="$(printf '%s\n' "$runs" | awk 'NF' | wc -l)"
          if [ "$count" -lt "$window" ]; then
            no_comparison "$count completed main runs are on record and $window are needed for a window, so no median was computed and no floor was tested."
            exit 0
          fi
          for id in $runs; do
            # First step's start to last step's end, rather than the job's own timestamps, which
            # carry the wait for a runner — pool queueing is noise about GitHub, not about the gate.
            # `verify` is this report and `changes` is a checkout plus a path mapping: neither is
            # the gate's work, and one rule has to cover both.
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" --jq '
              .jobs[]
              | select(.name != "verify" and .name != "changes")
              | if .conclusion == "skipped"
                then ["skipped", .name, 0]
                elif .conclusion == "success"
                   and ([.steps[]? | select(.started_at != null)] | length) > 0
                   and ([.steps[]? | select(.completed_at != null)] | length) > 0
                then ["ok", .name,
                      (([.steps[] | select(.completed_at != null) | .completed_at | fromdateiso8601] | max)
                       - ([.steps[] | select(.started_at != null) | .started_at | fromdateiso8601] | min))]
                else ["dropped", .name, 0]
                end
              | @tsv'
          done | awk -F'\t' -v w="$window" -v ref="$reference" -v state="$state" '
            BEGIN { whole = 1 }
            # The reference table first, one row per job: name, seconds, floor percent.
            FNR == NR {
              if ($0 ~ /^#/ || NF < 3) next
              # A `-` in the seconds column is a job budgeted and never referenced -- one that runs
              # on pull requests alone, so no main window holds it -- not a reference of zero.
              if ($2 !~ /^[0-9]+$/) next
              base[$1] = $2 + 0
              limit[$1] = $3 + 0
              if ($1 != "total") names[++nn] = $1
              next
            }
            # A job whose scope the mapping turned off, which never started and so failed at
            # nothing: counted apart, or a job skipped on every main push reads as a run that broke.
            $1 == "skipped" { skipped++; next }
            $1 == "dropped" { dropped++; next }
            $1 == "ok" {
              k = $2
              # Reported rather than measured: a job added to the gate with no row here would
              # otherwise be counted into nothing and vanish from the report silently.
              if (!(k in base)) {
                if (!(k in extra)) { extra[k] = 1; unref = unref (unref == "" ? "" : ", ") k }
                next
              }
              c = ++n[k]
              # Insertion into the group in order, so the median needs no external sort at all.
              while (c > 1 && v[k, c - 1] > $3) { v[k, c] = v[k, c - 1]; c-- }
              v[k, c] = $3
            }
            # Median, not mean: the images job swings more than tenfold between a warm layer cache
            # and a cold one, and one cold run would carry a mean nobody could read past.
            function med(k,   c) {
              c = n[k]
              if (c == 0) return -1
              if (c % 2) return int(v[k, (c + 1) / 2] + 0.5)
              return int((v[k, c / 2] + v[k, c / 2 + 1]) / 2 + 0.5)
            }
            END {
              for (i = 1; i <= nn; i++) {
                j = names[i]
                m = med(j)
                if (m < 0) { gone = gone (gone == "" ? "" : ", ") j; whole = 0; continue }
                total += m
                # A reference of zero has no percentage to give, and dividing by it would take the
                # whole redirect group down under set -e, leaving a header and no rows. Named in
                # the trailer rather than dropped, a zero here being a hand edit somebody left half
                # done.
                if (base[j] <= 0) {
                  unref = unref (unref == "" ? "" : ", ") j
                  continue
                }
                d = (m - base[j]) * 100 / base[j]
                a = (d < 0) ? -d : d
                # The quiet state: under its own floor a job says nothing at all, so a row in this
                # table is always a figure somebody has to account for.
                if (a <= limit[j]) continue
                line = sprintf("| `%s` | %ds | %ds | %+ds (%+.1f%%) | %d%% |", j, m, base[j], m - base[j], d, limit[j])
                k = ++loud
                while (k > 1 && rank[k - 1] < m) { rank[k] = rank[k - 1]; row[k] = row[k - 1]; k-- }
                rank[k] = m
                row[k] = line
              }
              # Only where every referenced job was observed: a window missing one leaves a sum
              # that is short rather than one that is faster.
              if (whole && ("total" in base) && base["total"] > 0) {
                d = (total - base["total"]) * 100 / base["total"]
                a = (d < 0) ? -d : d
                if (a > limit["total"]) {
                  loud++
                  row[loud] = sprintf("| **the whole gate** | **%ds** | **%ds** | **%+ds (%+.1f%%)** | **%d%%** |", total, base["total"], total - base["total"], d, limit["total"])
                }
              }
              if (loud == 0 && whole) {
                printf "**Gate wall clock:** every job median over the last %d main runs sits inside its own floor.\n", w
              } else if (loud == 0) {
                # Not the clean sentence: a job with no run in this window was compared against
                # nothing, and "every job median sits inside its own floor" would cover it over.
                printf "**Gate wall clock:** nothing that could be measured has moved past its own floor, and a job named below was not measured at all, so this is not a clean comparison.\n"
              } else {
                print "### Gate wall clock"
                print ""
                printf "Medians over the last %d main runs that have moved past their own floor:\n", w
                print ""
                print "| Job | median | reference | delta | floor |"
                print "| --- | ---: | ---: | ---: | ---: |"
                for (i = 1; i <= loud; i++) print row[i]
              }
              printf "\nThe reference is `%s`, a fixed table updated by hand and never recomputed from the recent past, which is what would let a slowdown become the new normal one window at a time. Each floor is the p95 movement of that median when a %d-run window is resampled from the reference population, so a delta under it is a reshuffle and not a change. A figure spans a job from its first step to its last, leaving the wait for a runner out.\n", ref, w
              printf "\n%d job run(s) in this window did not succeed and are outside the sample, so a scope slow enough to fail or to reach its timeout is invisible here.\n", dropped
              if (skipped) printf "\n%d job run(s) never started, their scope turned off by the path mapping rather than by anything they did.\n", skipped
              if (gone != "") printf "\nNo successful run in this window: %s.\n", gone
              if (unref != "") printf "\nMeasured with no reference to compare against: %s.\n", unref
              # Which of the three states this report reached, for the annotation below: the
              # summary is where they are told apart in full, and a file is how that verdict
              # leaves an awk whose stdout is the summary itself.
              verdict = loud ? "regressed" : (whole ? "clean" : "partial")
              print verdict > state
            }
          ' "$reference" - >> "$GITHUB_STEP_SUMMARY"
          # Outside the summary for `no_comparison`'s reason, and with its polarity: a clean report
          # is the only one of the three that annotates nothing, so silence on the checks list
          # means the comparison ran and found nothing rather than that it never ran.
          case "$(cat "$state" 2>/dev/null || true)" in
            regressed) echo "::warning title=Gate wall clock::A job median has moved past its own floor. The run summary holds the table." ;;
            partial)   echo "::warning title=Gate wall clock::A job in the reference has no successful run in this window, so this is not a clean comparison. The run summary names it." ;;
          esac

      - name: Fail if any scope job failed or was cancelled
        # A skipped job is a pass here: path filtering skipped it on purpose. Pure expressions, no
        # shell parsing of the needs context.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A scope job failed -- its own log has the findings."
          exit 1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The checkers' floor is 3.14 (`scripts/checker_kernel.py :: PYTHON_FLOOR`) and the runner's
        # default python is not; the toolcache holds 3.14, so this is a lookup rather than a
        # download. Not a `uv sync`: the check imports the standard library alone, and an install
        # would sit on the required check's critical path for nothing.
        with:
          python-version: "3.14"
      - name: Hold every job to its wall-clock budget
        # THE BUDGET. Not advisory: a job over its row in .github/gate-wall-clock.tsv fails the
        # required check, naming the job and both figures, and so does a job that ran with no row.
        # After the scope verdict and under its `success()`, so a failed gate is reported as the
        # failure it is and a job's length is judged only where the job passed. This run's own
        # jobs come from the API the report reads past runs from, so the two describe one
        # population. `gh api` is released from `-e` so that a payload it could not fetch reaches
        # the checker, whose refusal is the exit code, rather than ending the step on gh's own.
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/jobs.json" || true
          python scripts/check_gate_budget.py --jobs "${RUNNER_TEMP}/jobs.json"
