name: verify

# The gate that `scripts/verify.sh` is, run as parallel jobs mapped to the surfaces a change
# touches. The `changes` job diffs the pull request against its base and turns paths into scope
# flags; each job below runs one `verify.sh` scope and starts only when its scope is touched.
#
# Invariants:
# - A push to main runs every scope unconditionally, which also backstops the path mapping.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. This workflow publishes nothing and comments on nothing.
permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on main: a main run answers whether the tree is
  # deployable, and cancelling one leaves that question open. It is not a result per commit — a
  # concurrency group holds a single pending run, so three merges in quick succession replace the
  # middle one's queued run with the newest before it ever starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # The path-to-scope mapping lives in scripts/ci_scopes.sh — one copy, covered by selfcheck and
  # shellcheck — and this job only feeds its stdout to $GITHUB_OUTPUT. It errs conservative: an
  # unrecognised path turns every scope on.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      scripts: ${{ steps.map.outputs.scripts }}
      docs: ${{ steps.map.outputs.docs }}
      backend: ${{ steps.map.outputs.backend }}
      db: ${{ steps.map.outputs.db }}
      frontend: ${{ steps.map.outputs.frontend }}
      ops: ${{ steps.map.outputs.ops }}
      images: ${{ steps.map.outputs.images }}
      format: ${{ steps.map.outputs.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
          # Full history: the mapping diffs against the merge base with the target branch.
          fetch-depth: 0

      - name: Map changed paths to scopes
        id: map
        # Values reach the script through env, never by interpolating `${{ }}` into `run:`; the
        # reason is written out in .github/workflows/pr-body.yml.
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./scripts/ci_scopes.sh "origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci_scopes.sh --all >> "$GITHUB_OUTPUT"
          fi

      - name: Report the branch's line delta
        # The re-bloat glance: a per-bucket line delta in the run summary, so growth is visible on
        # the pull request adding it. Advisory by construction — no threshold, no verdict, and
        # continue-on-error keeps a failure away from this job's outputs.
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # --no-renames: a rename counts as its full add and delete in one bucket, netting zero,
          # where a rename spec's combined spelling would classify as neither side.
          git diff --numstat --no-renames "$base" HEAD | awk -F'\t' -v base="$base" '
            $1 == "-" { next }
            {
              b = "product code"
              if ($3 == "fl_backend/openapi.json" || $3 ~ /(^|\/)(pnpm-lock\.yaml|uv\.lock)$/) b = "generated"
              else if ($3 ~ /^(fl_backend|scripts)\/tests\// || $3 ~ /\.test\.(ts|tsx)$/) b = "tests"
              else if ($3 ~ /\.md$/ || $3 ~ /^docs\//) b = "documentation"
              else if ($3 ~ /^(scripts|nginx|certs)\/|^\.|^docker-compose|(^|\/)(Dockerfile|\.[^\/]+)$/) b = "tooling"
              seen[b] = 1; add[b] += $1; del[b] += $2
            }
            END {
              n = split("product code,tests,documentation,tooling,generated", names, ",")
              net = 0
              for (i = 1; i < n; i++) net += add[names[i]] - del[names[i]]
              printf "### Line delta against merge base %.7s\n\n", base
              printf "**Net: %+d lines** (generated files excluded)\n\n", net
              print "| Bucket | Added | Removed | Net |"
              print "| --- | ---: | ---: | ---: |"
              for (i = 1; i <= n; i++) {
                b = names[i]
                if (seen[b]) printf "| %s%s | %d | %d | %+d |\n", b, (i == n ? " (excluded)" : ""), add[b], del[b], add[b] - del[b]
              }
            }
          ' >> "$GITHUB_STEP_SUMMARY"

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        # The commit check below runs on the interpreter fl_backend pins, never on whichever Python
        # the runner image happens to ship: one floor for every caller, so a check cannot pass here
        # and fail on a development machine over a language version. Warm, this costs a few seconds.
        working-directory: fl_backend
        run: uv sync --dev

      # Commit messages are checked here, not in the docs job: they are the one thing with no path,
      # so a frontend-only pull request would skip the docs scope and merge unchecked.
      - name: Check the branch's commit messages
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: fl_backend/.venv/bin/python scripts/check_commits.py --base "origin/${BASE_REF}"

  scripts:
    needs: changes
    if: needs.changes.outputs.scripts == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        # The scripts scope lints scripts/*.py with the repository's own ruff, which lives in this
        # venv. verify.sh resolves .venv/bin/python (Linux) itself.
        working-directory: fl_backend
        run: uv sync --dev
      - name: Install the shellcheck the gate pins
        # The runner image ships its own shellcheck, and selfcheck.sh prefers a binary on PATH over
        # the image it pins -- so without this CI lints the branch against a different rule set from
        # a development machine, and says so only as an advisory that leaves the run green. The
        # version is read from selfcheck.sh rather than repeated here: a second copy is a pair
        # nothing compares, and that file carries the note about bumping it by hand.
        run: |
          version="$(sed -n 's/^SHELLCHECK_VERSION="\([0-9.]*\)"$/\1/p' scripts/selfcheck.sh)"
          if [ -z "$version" ]; then
            echo "::error::no SHELLCHECK_VERSION in scripts/selfcheck.sh -- the pin moved or its spelling changed."
            exit 1
          fi
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz" |
            sudo tar -xJ --strip-components=1 -C /usr/local/bin "shellcheck-v${version}/shellcheck"
          shellcheck --version
      # Only typescript is wanted here, and a pnpm install is the only way to get it at the pinned
      # version. Without it the comment classifier's TypeScript half — the delicate one, and why it
      # parses rather than matching a regex — is exercised nowhere.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the scripts scope
        run: ./scripts/verify.sh --scripts

  docs:
    needs: changes
    if: needs.changes.outputs.docs == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the documentation gate diffs the branch against the merge base for its
          # branch-scoped checks and resolves commit ids prose names, neither of which a shallow
          # clone can do.
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        # verify.sh resolves .venv/bin/python (Linux) or .venv/Scripts/python.exe (Windows) itself.
        working-directory: fl_backend
        run: uv sync --dev
      # The scope check classifies a changed .ts file through `scripts/check_scope.py`, whose
      # TypeScript half needs `scripts/ts_normalize.mjs`. Without the installed tree the answer
      # degrades to "code", and the run is asked for scopes it does not owe.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the docs scope
        run: ./scripts/verify.sh --docs

  # Prettier in check mode, for changes outside fl_frontend — docs, workflows, compose files —
  # which the formatter still governs. When the frontend job runs it already includes the same
  # check, so this one stands down.
  format:
    needs: changes
    if: needs.changes.outputs.format == 'true' && needs.changes.outputs.frontend != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # prettier and its plugins are dependencies of fl_frontend, so the check needs that install
      # even though what it reads is mostly outside it.
      - uses: ./.github/actions/frontend-toolchain
      - name: Check formatting
        working-directory: fl_frontend
        run: pnpm format:check

  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        working-directory: fl_backend
        run: uv sync --dev
      - name: Run the backend scope
        run: ./scripts/verify.sh --backend

  # The `db`-marked backend tests, which start a real mongod. A separate job rather than
  # a step in `backend`: jobs run concurrently, so the mongod pull costs no wall-clock time. The
  # marker belongs to the suite, not to this pipeline.
  backend-db:
    needs: changes
    if: needs.changes.outputs.db == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        working-directory: fl_backend
        run: uv sync --dev
      - name: Run the db scope
        run: ./scripts/verify.sh --db

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # CI runs `pnpm build` on the runner host, never inside the image, so none of the Dockerfile's
    # ENV lines apply. These reproduce them across its base and builder stages;
    # `fl_frontend/Dockerfile` is the authority, and the two move together.
    env:
      # `next build` evaluates modules that read the environment, and a clean checkout has no .env,
      # so the startup gate rejects every variable and the build dies. The schema is still enforced
      # for real by local.sh and on every deploy.
      SKIP_ENV_VALIDATION: "true"
      # Needed even with validation skipped: `fl_frontend/src/core/db.ts` constructs a MongoClient at
      # MODULE SCOPE, and `new MongoClient(undefined)` throws. Same placeholder the Dockerfile uses.
      MONGODB_URI: mongodb://localhost:27017/placeholder
      # The Dockerfile disables telemetry in its base stage; the runner is not that image.
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scope builds the application, so the installed tree is the job.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the frontend scope
        run: ./scripts/verify.sh --frontend
      - name: Fail if the build rewrote tsconfig.json
        # `next build` writes fl_frontend/tsconfig.json for any compilerOptions key that is absent --
        # a presence check, documented at that file's `allowJs` line -- then repairs it and carries
        # on, so the build stays green having read a different config from the tsc step before it.
        # Locally the dirty tree is visible; on a runner the repaired copy is discarded with the
        # workspace, and a framework upgrade reaches this condition with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::next build rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm build' and commit the result."
            exit 1
          fi

  # The compose files and nginx's prod.conf have no compiler and no test suite; this scope is the
  # only thing standing between a typo in either and a failed deploy.
  ops:
    needs: changes
    if: needs.changes.outputs.ops == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
      - name: Create the backend virtualenv
        # `any_python` falls back to the runner's python3, which is under the checkers' floor on
        # this image, and the ops scope degrades "could not run" to a skip — so without this venv
        # the job is green having never compared the compose files.
        working-directory: fl_backend
        run: uv sync --dev
      - name: Run the ops scope
        run: ./scripts/verify.sh --ops

  # Both image builds plus the instrumentation.js presence check — the failures no other scope can
  # see, because the frontend scope builds on the runner and never inside the image.
  # `scripts/ci_scopes.sh` lists the packaging inputs that select it.
  images:
    needs: changes
    if: needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # buildx talks to the Actions cache service itself, so there is no actions/cache
      # step and no cache directory to carry. This action exists because the runner injects the
      # service credentials into JavaScript actions alone.
      - uses: ./.github/actions/actions-runtime-env
      - name: Create a cache-capable builder
        # The default docker driver cannot export a build cache; the container driver can, and the
        # script's --load brings the built image back to the daemon for the instrumentation check.
        run: docker buildx create --use
      - name: Run the images scope
        env:
          VERIFY_IMAGES_CACHE: gha
        run: ./scripts/verify.sh --images

  # THE REQUIRED STATUS CHECK. The ruleset on main requires a check named `verify`; this job is it.
  # It runs on every event, so path filtering can never leave the required check hanging.
  verify:
    needs: [changes, scripts, docs, format, backend, backend-db, frontend, ops, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # First, so it prints whether or not the verdict below refuses. A green `verify` says nothing
      # about which scopes ran, and a mapping that turned every scope off looks identical to a
      # change that genuinely touched nothing — this is where the difference is readable.
      - name: Report each scope's result
        # This job IS the required status check, so nothing diagnostic in it may decide a merge. The
        # verdict is the step below and only that step; a report that cannot format its own output
        # is annotated in the run and changes no outcome.
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Fail if any scope job failed or was cancelled
        # A skipped job is a pass here: path filtering skipped it on purpose. Pure expressions, no
        # shell parsing of the needs context.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A scope job failed -- its own log has the findings."
          exit 1
