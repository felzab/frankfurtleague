name: verify

# The gate that `scripts/gate/verify.sh` is, every scope on every event, one job per scope, and the
# end-to-end journeys beside it; and, on a push to main that passed them, the publish of the two
# images the images job built and checked.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. Only the publish job widens it, for its push.
permissions:
  contents: read

# The keyword, never a hand-copied `bash -eo pipefail {0}`: GitHub expands `bash` to that plus
# `--noprofile --norc`, and a builtin cannot drift.
defaults:
  run:
    shell: bash

env:
  # How long a cache restore waits on a stuck download before the job goes on without the cache, in
  # minutes (actions/cache's README). Its default, 10, outlasts the jobs given 5 or 6, which a stuck
  # restore would cancel instead; every job's `timeout-minutes` stays above it
  # (`scripts/tests/test_ci_timeouts.py`). A warm restore takes seconds.
  SEGMENT_DOWNLOAD_TIMEOUT_MINS: 2

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on main, whose run publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Each job's `timeout-minutes` bounds a hang rather than predicting a duration: four times the job's
# slowest time in the 30 runs of this workflow on record when it was set, room for a runner four times
# slower, rounded up to whole minutes and never under 5.
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
      # The application too: the deploy's preflight snippets run for real in
      # `scripts/tests/test_deploy_streams.py`, and one imports it.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Run the scripts scope
        run: ./scripts/gate/verify.sh --scripts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The route checker's interpreter.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the docs scope
        run: ./scripts/gate/verify.sh --docs

  # prettier and its plugins are dependencies of fl_frontend, so the check needs that install even
  # though what it reads is mostly outside it.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the format scope
        run: ./scripts/gate/verify.sh --format

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: pyright and the suite import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
          # The uv cache's one writer: on a miss every saving job would archive the whole cache. Its key
          # carries the runner's OS release, so a writer on the db job's ubuntu-22.04 would serve no
          # ubuntu-latest job.
          save-cache: true
      - name: Run the backend scope
        run: ./scripts/gate/verify.sh --backend

  # Both db tiers: the `db`-marked backend tests and the frontend's `*.db.test.*` files; and the
  # contract check, which regenerates openapi.json and the client from it and diffs both, needing
  # both toolchains.
  db:
    # mongod 8.3.13 refuses ubuntu-24.04's 7.0.0 kernel at start (SERVER-121912); 22.04's 6.8 it accepts.
    # Back to ubuntu-latest once the image pins move to 8.3.14, which carries SERVER-131779's fix. Until
    # then this job restores none of the backend job's uv cache, whose key carries the runner's OS
    # release, and installs from the registry on every run.
    runs-on: ubuntu-22.04
    timeout-minutes: 21
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: the db tier's tests import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the db scope
        run: ./scripts/gate/verify.sh --db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    # Every `next` command a step runs, the build's own variables set on its command alone.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scope builds the application, so the installed tree is the job.
      - uses: ./.github/actions/frontend-toolchain
        with:
          # The pnpm store's one writer, so a lockfile change uploads one store rather than one per job.
          save-cache: true
      # Next's CI cache (https://nextjs.org/docs/app/guides/ci-build-caching). The source trees are in
      # the key, not the lockfile alone: actions/cache writes nothing on an exact hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fl_frontend/.next/cache
          key: nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-${{ hashFiles('fl_frontend/src/**', 'fl_frontend/next.config.ts') }}
          # A prefix restore is safe for both things the path holds: the Next cache is
          # content-addressed, and tsc's build info re-checks a file whose text hash moved.
          restore-keys: |
            nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-
      - name: Run the frontend scope
        run: ./scripts/gate/verify.sh --frontend
      - name: Fail if the frontend scope rewrote tsconfig.json
        # `next typegen` and `next build` both write fl_frontend/tsconfig.json for any compilerOptions
        # key that is absent and carry on; on a runner the repaired copy is discarded with the
        # workspace, so a framework upgrade reaches this with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::the frontend scope rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm typegen' and commit the result."
            exit 1
          fi

  frontend-units:
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the frontend-units scope
        run: ./scripts/gate/verify.sh --frontend-units

  # The compose files and the nginx configuration have no compiler; this scope parses and serves
  # them, and is the only thing standing between a typo in either and a failed deploy.
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkers' interpreter, and the uv that runs zizmor.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the ops scope
        run: ./scripts/gate/verify.sh --ops

  # Both images, built through Docker's own action, which carries the Actions layer cache. Each is
  # written to a file and loaded, so a push to main hands the publish job exactly the bytes checked
  # here (https://docs.docker.com/build/ci/github-actions/share-image-jobs/).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 17
    # What the publish job holds the artifact to. A job's outputs are written by that job alone, where
    # any job of the run holding its runtime token can delete the artifact and upload another under
    # its name, as upload-artifact's `overwrite` does.
    outputs:
      frontend-tag: ${{ steps.bind.outputs.frontend-tag }}
      frontend-sha256: ${{ steps.bind.outputs.frontend-sha256 }}
      backend-tag: ${{ steps.bind.outputs.backend-tag }}
      backend-sha256: ${{ steps.bind.outputs.backend-sha256 }}
    env:
      FRONTEND_IMAGE: ghcr.io/felzab/frankfurtleague-frontend
      BACKEND_IMAGE: ghcr.io/felzab/frankfurtleague-backend
      VERIFY_TAG: frankfurtleague-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The docker driver cannot export a build cache; the container driver this creates can. Its
      # BuildKit daemon writes both tarballs before `bind` hashes them, so it is pinned by tag and
      # digest like every image the stack runs; no Dependabot ecosystem reads this string, so a bump is
      # by hand.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          driver-opts: image=moby/buildkit:v0.33.1@sha256:cec9f139f45e93c5c69c60f8b07cfad9f43f4ef6b6a6cd917527fea5ff2e3dea
      # `sha-<commit>` beside the scope's own tag, and the OCI labels `scripts/ops/deploy.sh` reads.
      - id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: type=sha
          flavor: latest=false
      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: type=sha
          flavor: latest=false
      # One cache scope per image, buildx overwriting rather than merging a key, and `version` left to
      # buildx, which picks the live cache service.

      # The push that publishes reads no cache, so no planted cache entry reaches a pushed image. It
      # still writes one: a pull request restores only its own merge ref's caches and the default
      # branch's (https://docs.github.com/en/actions/reference/workflows-and-actions/dependency-caching),
      # and those builds publish nothing.
      - name: Build the frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: fl_frontend
          file: fl_frontend/Dockerfile
          tags: |
            ${{ env.VERIFY_TAG }}:frontend
            ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta-frontend.outputs.version }}
          outputs: type=docker,dest=${{ runner.temp }}/frontend.tar
          cache-from: ${{ github.event_name != 'push' && 'type=gha,scope=frontend' || '' }}
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build the backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: fl_backend
          file: fl_backend/Dockerfile
          tags: |
            ${{ env.VERIFY_TAG }}:backend
            ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          build-args: APP_VERSION=${{ steps.meta-backend.outputs.version }}
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
          cache-from: ${{ github.event_name != 'push' && 'type=gha,scope=backend' || '' }}
          cache-to: type=gha,scope=backend,mode=max
      # On every event, so a pull request's run proves the outputs a push to main publishes by.
      - name: Record each tarball's digest and each image's one tag
        id: bind
        env:
          FRONTEND_TAGS: ${{ steps.meta-frontend.outputs.tags }}
          BACKEND_TAGS: ${{ steps.meta-backend.outputs.tags }}
        run: |
          record() { # $1 the output prefix, $2 the repository, $3 the metadata step's tags, $4 the tarball
            local digest
            # Exactly the `sha-` tag: the publish job pushes this one reference, so a second tag the
            # metadata step gained would otherwise go unpublished without a word.
            if [[ "$3" == *$'\n'* || "$3" != "$2:sha-"* ]]; then
              printf '::error::the %s image carries the tags %q, where the publish job pushes exactly one, %s:sha-<commit>.\n' "$1" "$3" "$2"
              return 1
            fi
            digest="$(sha256sum "$4" | cut -d ' ' -f 1)"
            printf '%s-tag=%s\n%s-sha256=%s\n' "$1" "$3" "$1" "$digest" >> "$GITHUB_OUTPUT"
            printf '%s: %s, tarball sha256 %s\n' "$1" "$3" "$digest"
          }
          record frontend "$FRONTEND_IMAGE" "$FRONTEND_TAGS" "${RUNNER_TEMP}/frontend.tar"
          record backend "$BACKEND_IMAGE" "$BACKEND_TAGS" "${RUNNER_TEMP}/backend.tar"
      - name: Load both images
        run: |
          docker load --input "${RUNNER_TEMP}/frontend.tar"
          docker load --input "${RUNNER_TEMP}/backend.tar"
      - name: Run the images scope
        env:
          VERIFY_IMAGES_BUILT: "1"
        run: ./scripts/gate/verify.sh --images
      # On every event, the images the journeys job raises its stack from; on a push to main, also the
      # images the publish job pushes.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            ${{ runner.temp }}/frontend.tar
            ${{ runner.temp }}/backend.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are compressed already.
          compression-level: 0

  # The Playwright journeys (`fl_frontend/playwright.config.ts`) against the end-to-end stack, raised
  # from the images the images job built from this commit, with the made-up seed.
  journeys:
    # Its images, built once by buildx: compose's own builder refuses the frontend Dockerfile's `COPY --exclude`.
    needs: images
    # mongod 8.3.13 refuses ubuntu-24.04's 7.0.0 kernel at start (SERVER-121912), as the db job says.
    runs-on: ubuntu-22.04
    timeout-minutes: 19
    env:
      # The three files `local.sh --e2e` merges; local.sh itself refuses Linux (`require_platform windows`).
      COMPOSE_FILE: docker-compose.yml:docker-compose.local.yml:docker-compose.e2e.yml
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Install Chromium, WebKit and their system libraries
        working-directory: fl_frontend
        run: pnpm exec playwright install --with-deps chromium webkit
      - name: Generate the stack's throwaway keys
        # `scripts/ops/local.sh :: write_e2e_keys`, each file readable by the containers' own users,
        # which the runner's user is not. Nothing is printed.
        run: |
          mkdir -p .tmp-e2e/secrets .tmp-e2e/mail .tmp-e2e/nginx-log
          chmod 777 .tmp-e2e/mail .tmp-e2e/nginx-log
          for name in auth_secret sperrliste_schluessel internal_api_key_base internal_api_key_system internal_api_key_admin; do
            openssl rand -hex 32 | tr -d '\n' > ".tmp-e2e/secrets/${name}"
          done
          chmod 644 .tmp-e2e/secrets/*
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      # Under the names docker-compose.e2e.yml gives the two built services; every `up` below passes
      # `--no-build`, so a name that does not match fails rather than building.
      - name: Load both images as the stack's
        run: |
          docker load --input "${RUNNER_TEMP}/images/frontend.tar"
          docker load --input "${RUNNER_TEMP}/images/backend.tar"
          docker tag frankfurtleague-verify:frontend frankfurtleague-e2e-frontend
          docker tag frankfurtleague-verify:backend frankfurtleague-e2e-backend
      - name: Start the database and the backend
        run: docker compose up -d --no-build --wait --wait-timeout 180 mongo backend
      - name: Load the made-up seed and judge it
        run: |
          base="$(docker compose exec -T backend sh -c 'printf %s "$DB_BASE_NAME"')"
          docker compose exec -T mongo sh -c 'cat > /tmp/made-up-seed.js' < scripts/ops/seed/seed.js
          docker compose exec -T mongo mongosh --quiet "mongodb://127.0.0.1:27017/${base}?directConnection=true" --file /tmp/made-up-seed.js
          docker compose exec -T backend python -m app.core.readback
      - name: Start the stack
        run: docker compose up -d --no-build --force-recreate --wait --wait-timeout 240
      - name: Run the journeys
        working-directory: fl_frontend
        run: pnpm run e2e
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: journeys-report
          # The report and the e2e edge's own logs, the only record of the address it judged each
          # request by (`nginx/e2e/e2e.conf`).
          path: |
            .tmp-playwright/
            .tmp-e2e/nginx-log/
          # Both directories are dot directories, which the action leaves out by default: without
          # this a failed run uploads nothing and says so in a warning alone.
          include-hidden-files: true
          retention-days: 7
      - name: The stack's logs, on a failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - name: Stop the stack
        if: always()
        run: docker compose down -v --remove-orphans

  # THE REQUIRED STATUS CHECK, which the ruleset names. `always()`: the verdict is the steps below,
  # never GitHub's reading of a job skipped over a failed need.
  verify:
    needs: [scripts, docs, format, backend, db, frontend, frontend-units, ops, images, journeys]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # First, so it prints whether or not the verdict below refuses: a red `verify` names no job.
      - name: Report each scope's result
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/verify.yml
          sparse-checkout-cone-mode: false
      # A job left out of `needs:` never decides a merge, and nothing in a diff says so. `publish`
      # runs after this job, on main alone, so it is the one job this one may not need.
      - name: Fail if a job is missing from verify's needs
        run: |
          workflow=.github/workflows/verify.yml
          jobs="$(yq -r '.jobs | keys | .[] | select(. != "verify" and . != "publish")' "$workflow" | sort)"
          needed="$(yq -r '.jobs.verify.needs[]' "$workflow" | sort)"
          if [ "$jobs" != "$needed" ]; then
            echo "::error::verify's needs and the workflow's jobs differ, so a job that is not needed decides no merge -- every job but verify and publish belongs in needs."
            diff <(printf '%s\n' "$jobs") <(printf '%s\n' "$needed") || true
            exit 1
          fi
          echo "verify needs every job: $(printf '%s' "$jobs" | tr '\n' ' ')"
      # Every event runs every scope (`docs/decisions.md`, **ci**), so a skip is a condition someone
      # added. Pure expressions, no shell parsing of the needs context.
      - name: Fail if any scope job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A scope job failed, was cancelled or was skipped -- the scope results above name it, and its own log has the findings."
          exit 1

  # On a push to main that `verify` passed, the two images the images job built and checked are pushed
  # under their `sha-<commit>` tags, building and checking nothing again.
  publish:
    # `images` for its outputs, which only a job named here can read.
    needs: [verify, images]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Not set from a measured time, as every other job's is: it runs on main alone, so no pull request's
    # run times it.
    timeout-minutes: 15
    # A job-level grant replaces the workflow's whole: the push alone, which the package grants this
    # repository's workflows. The artifact comes through the run's own runtime token.
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      # Before the registry login, so a replaced tarball never reaches a step holding the push grant.
      # download-artifact's own digest check reads the run's artifact listing, which describes a
      # replacement as faithfully as the original. `--strict` refuses an empty output's line.
      - name: Refuse a tarball other than the one the images job checked
        env:
          FRONTEND_SHA256: ${{ needs.images.outputs.frontend-sha256 }}
          BACKEND_SHA256: ${{ needs.images.outputs.backend-sha256 }}
        run: |
          printf '%s  %s\n' \
            "$FRONTEND_SHA256" "${RUNNER_TEMP}/images/frontend.tar" \
            "$BACKEND_SHA256" "${RUNNER_TEMP}/images/backend.tar" \
            | sha256sum --strict --check -
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The one reference the images job recorded for each, never `--all-tags`: a tarball may name
      # any tag, `:latest` included, which a bare `scripts/ops/deploy.sh` pulls.
      - name: Push both images
        env:
          FRONTEND_TAG: ${{ needs.images.outputs.frontend-tag }}
          BACKEND_TAG: ${{ needs.images.outputs.backend-tag }}
        run: |
          docker load --input "${RUNNER_TEMP}/images/frontend.tar"
          docker load --input "${RUNNER_TEMP}/images/backend.tar"
          docker push "$FRONTEND_TAG"
          docker push "$BACKEND_TAG"
