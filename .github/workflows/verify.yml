name: verify

# The gate that `scripts/gate/verify.sh` is, every scope on every event, one job per scope; and, on a
# push to main that passed it, the publish of the two images the images job built and checked.

on:
  pull_request:
  push:
    branches: [main]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. Only the publish job widens it, for its push.
permissions:
  contents: read

# The keyword, never a hand-copied `bash -eo pipefail {0}`: GitHub expands `bash` to that plus
# `--noprofile --norc`, and a builtin cannot drift.
defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on main, whose run publishes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Every job's `timeout-minutes` is its wall-clock ceiling: about twice what the job takes, so a hung
# job ends rather than holding the run.
jobs:
  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
      # The application too: the deploy's preflight snippets run for real in
      # `scripts/tests/test_deploy_streams.py`, and one imports it.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Run the scripts scope
        run: ./scripts/gate/verify.sh --scripts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: this scope runs fl_backend/tests/openapi_document.py, which imports it.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
          # The uv cache's one writer: on a miss every saving job would archive the whole cache.
          save-cache: true
      - name: Run the docs scope
        run: ./scripts/gate/verify.sh --docs

  # prettier and its plugins are dependencies of fl_frontend, so the check needs that install even
  # though what it reads is mostly outside it.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the format scope
        run: ./scripts/gate/verify.sh --format

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: pyright and the suite import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Run the backend scope
        run: ./scripts/gate/verify.sh --backend

  # Both db tiers: the `db`-marked backend tests and the frontend's `*.db.test.*` files.
  db:
    # mongod 8.3.13 refuses ubuntu-24.04's 7.0.0 kernel at start (SERVER-121912); 22.04's 6.8 it accepts.
    # Back to ubuntu-latest once the image pins move to 8.3.14, which carries SERVER-131779's fix.
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: the db tier's tests import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the db scope
        run: ./scripts/gate/verify.sh --db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Every `next` command a step runs, the build's own variables set on its command alone.
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The scope builds the application, so the installed tree is the job.
      - uses: ./.github/actions/frontend-toolchain
        with:
          # The pnpm store's one writer, so a lockfile change uploads one store rather than one per job.
          save-cache: true
      # Next's CI cache (https://nextjs.org/docs/app/guides/ci-build-caching). The source trees are in
      # the key, not the lockfile alone: actions/cache writes nothing on an exact hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fl_frontend/.next/cache
          key: nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-${{ hashFiles('fl_frontend/src/**', 'fl_frontend/next.config.ts') }}
          # A prefix restore is safe for both things the path holds: the Next cache is
          # content-addressed, and tsc's build info re-checks a file whose text hash moved.
          restore-keys: |
            nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-
      - name: Run the frontend scope
        run: ./scripts/gate/verify.sh --frontend
      - name: Fail if the frontend scope rewrote tsconfig.json
        # `next typegen` and `next build` both write fl_frontend/tsconfig.json for any compilerOptions
        # key that is absent and carry on; on a runner the repaired copy is discarded with the
        # workspace, so a framework upgrade reaches this with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::the frontend scope rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm typegen' and commit the result."
            exit 1
          fi

  frontend-units:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the frontend-units scope
        run: ./scripts/gate/verify.sh --frontend-units

  # The compose files and the nginx configuration have no compiler; this scope parses and serves
  # them, and is the only thing standing between a typo in either and a failed deploy.
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The checkers' interpreter, and the uv that runs zizmor.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the ops scope
        run: ./scripts/gate/verify.sh --ops

  # Both images, built through Docker's own action, which carries the Actions layer cache. Each is
  # written to a file and loaded, so a push to main hands the publish job exactly the bytes checked
  # here (https://docs.docker.com/build/ci/github-actions/share-image-jobs/).
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FRONTEND_IMAGE: ghcr.io/felzab/frankfurtleague-frontend
      BACKEND_IMAGE: ghcr.io/felzab/frankfurtleague-backend
      VERIFY_TAG: frankfurtleague-verify
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The docker driver cannot export a build cache; the container driver this creates can.
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # `sha-<commit>` beside the scope's own tag, and the OCI labels `scripts/ops/deploy.sh` reads.
      - id: meta-frontend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.FRONTEND_IMAGE }}
          tags: type=sha
          flavor: latest=false
      - id: meta-backend
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.BACKEND_IMAGE }}
          tags: type=sha
          flavor: latest=false
      # One cache scope per image, buildx overwriting rather than merging a key, and `version` left to
      # buildx, which picks the live cache service.
      - name: Build the frontend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: fl_frontend
          file: fl_frontend/Dockerfile
          tags: |
            ${{ env.VERIFY_TAG }}:frontend
            ${{ steps.meta-frontend.outputs.tags }}
          labels: ${{ steps.meta-frontend.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/frontend.tar
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,scope=frontend,mode=max
      - name: Build the backend
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: fl_backend
          file: fl_backend/Dockerfile
          tags: |
            ${{ env.VERIFY_TAG }}:backend
            ${{ steps.meta-backend.outputs.tags }}
          labels: ${{ steps.meta-backend.outputs.labels }}
          outputs: type=docker,dest=${{ runner.temp }}/backend.tar
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max
      - name: Load both images
        run: |
          docker load --input "${RUNNER_TEMP}/frontend.tar"
          docker load --input "${RUNNER_TEMP}/backend.tar"
      - name: Run the images scope
        env:
          VERIFY_IMAGES_BUILT: "1"
        run: ./scripts/gate/verify.sh --images
      # On a push to main alone, the run that publishes.
      - if: github.event_name == 'push'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: images
          path: |
            ${{ runner.temp }}/frontend.tar
            ${{ runner.temp }}/backend.tar
          if-no-files-found: error
          retention-days: 1
          # The layers are compressed already.
          compression-level: 0

  # THE REQUIRED STATUS CHECK, which the ruleset names. `always()`: the verdict is the steps below,
  # never GitHub's reading of a job skipped over a failed need.
  verify:
    needs: [scripts, docs, format, backend, db, frontend, frontend-units, ops, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # First, so it prints whether or not the verdict below refuses: a red `verify` names no job.
      - name: Report each scope's result
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/workflows/verify.yml
          sparse-checkout-cone-mode: false
      # A job left out of `needs:` never decides a merge, and nothing in a diff says so. `publish`
      # runs after this job, on main alone, so it is the one job this one may not need.
      - name: Fail if a job is missing from verify's needs
        run: |
          workflow=.github/workflows/verify.yml
          jobs="$(yq -r '.jobs | keys | .[] | select(. != "verify" and . != "publish")' "$workflow" | sort)"
          needed="$(yq -r '.jobs.verify.needs[]' "$workflow" | sort)"
          if [ "$jobs" != "$needed" ]; then
            echo "::error::verify's needs and the workflow's jobs differ, so a job that is not needed decides no merge -- every job but verify and publish belongs in needs."
            diff <(printf '%s\n' "$jobs") <(printf '%s\n' "$needed") || true
            exit 1
          fi
          echo "verify needs every job: $(printf '%s' "$jobs" | tr '\n' ' ')"
      # Every event runs every scope (`.claude/CLAUDE.md` §7, **ci**), so a skip is a condition someone
      # added. Pure expressions, no shell parsing of the needs context.
      - name: Fail if any scope job failed, was cancelled or was skipped
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "::error::A scope job failed, was cancelled or was skipped -- the scope results above name it, and its own log has the findings."
          exit 1

  # On a push to main that `verify` passed, the two images the images job built and checked are pushed
  # under their `sha-<commit>` tags, building and checking nothing again (D243).
  publish:
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A job-level grant replaces the workflow's whole: the push alone, which the package grants this
    # repository's workflows. The artifact comes through the run's own runtime token.
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: images
          path: ${{ runner.temp }}/images
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `--all-tags` pushes the `sha-` tag the metadata step gave each image, and nothing else carries
      # either repository's name on this runner.
      - name: Push both images
        run: |
          docker load --input "${RUNNER_TEMP}/images/frontend.tar"
          docker load --input "${RUNNER_TEMP}/images/backend.tar"
          docker push --all-tags ghcr.io/felzab/frankfurtleague-frontend
          docker push --all-tags ghcr.io/felzab/frankfurtleague-backend
