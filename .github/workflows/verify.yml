name: verify

# The gate that `scripts/gate/verify.sh` is, every scope on every event, one parallel job per scope.

on:
  pull_request:
  # A pull request's run tests the merge ref, so the commit that lands is tested again here, and
  # this run is the one the publish reads (`scripts/checks/check_publish_verdict.py`).
  push:
    branches: [main]

# Least privilege, declared here so a permissive repository default cannot silently widen what a
# compromised dependency reaches. This workflow publishes nothing and comments on nothing.
permissions:
  contents: read

# The keyword, never a hand-copied `bash -eo pipefail {0}`: GitHub expands `bash` to that plus
# `--noprofile --norc`, and a builtin cannot drift. The alternative is an unspecified shell, whose
# `-e` alone lets the last stage mask a mid-pipe failure.

# What the expansion does NOT carry is `-u`, and this does not add it: it makes each unset variable
# in a `run:` block a hard failure, a walk only actionlint could vouch for.
defaults:
  run:
    shell: bash

concurrency:
  group: verify-${{ github.ref }}
  # Supersede an in-flight run on a PR, but never on main: a main run answers whether the tree is
  # deployable, and cancelling one leaves that question open. It is not a result per commit — a
  # concurrency group holds a single pending run, so three merges in quick succession replace the
  # middle one's queued run with the newest before it ever starts.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # A pull request's commit messages, moved budgets and line delta, each read against the base. A
  # push to main has no branch to measure, so the whole job is skipped.
  commits:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout. Leaving it in .git/config would expose it to
          # every later step, including anything a dependency's install script decides to run.
          persist-credentials: false
          # Full history: every step here reads this branch against the merge base.
          fetch-depth: 0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The commit check runs on the interpreter fl_backend pins, never on whichever Python the
        # runner image happens to ship: one floor for every caller, so a check cannot pass here and
        # fail on a development machine over a language version.

        # An interpreter and no virtualenv: both checks import the standard library alone, and the
        # toolcache holds the pin, so this is a lookup rather than the install setup-uv and a sync
        # would be.
        with:
          python-version-file: fl_backend/.python-version
      - name: Check the branch's commit messages
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/checks/check_commits.py --base "origin/${BASE_REF}"
      - name: Hold a moved gate budget to its measurement
        # A budget or a reference raised in .github/gate-wall-clock.tsv carries a new measurement
        # stamp, or the pull request is refused here. This job, because it already has the
        # interpreter and the full history the base comparison reads.
        env:
          BASE_REF: ${{ github.base_ref }}
        run: python scripts/checks/check_gate_budget.py --base "origin/${BASE_REF}"
      - name: Report the branch's line delta
        # The re-bloat glance: a per-bucket line delta in the run summary, so growth is visible on
        # the pull request adding it. Advisory by construction — no threshold, no verdict, and
        # continue-on-error keeps a failure away from this job's conclusion.
        continue-on-error: true
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          base="$(git merge-base "origin/${BASE_REF}" HEAD)"
          # --no-renames: a rename counts as its full add and delete in one bucket, netting zero,
          # where a rename spec's combined spelling would classify as neither side.
          git diff --numstat --no-renames "$base" HEAD | awk -F'\t' -v base="$base" '
            $1 == "-" { next }
            {
              b = "product code"
              if ($3 == "fl_backend/openapi.json" || $3 ~ /(^|\/)(pnpm-lock\.yaml|uv\.lock)$/) b = "generated"
              else if ($3 ~ /^(fl_backend|scripts)\/tests\// || $3 ~ /\.test\.(ts|tsx)$/) b = "tests"
              else if ($3 ~ /\.md$/ || $3 ~ /^docs\//) b = "documentation"
              else if ($3 ~ /^(scripts|nginx|certs)\/|^\.|^docker-compose|(^|\/)(Dockerfile|\.[^\/]+)$/) b = "tooling"
              seen[b] = 1; add[b] += $1; del[b] += $2
            }
            END {
              n = split("product code,tests,documentation,tooling,generated", names, ",")
              net = 0
              for (i = 1; i < n; i++) net += add[names[i]] - del[names[i]]
              printf "### Line delta against merge base %.7s\n\n", base
              printf "**Net: %+d lines** (generated files excluded)\n\n", net
              print "| Bucket | Added | Removed | Net |"
              print "| --- | ---: | ---: | ---: |"
              for (i = 1; i <= n; i++) {
                b = names[i]
                if (seen[b]) printf "| %s%s | %d | %d | %+d |\n", b, (i == n ? " (excluded)" : ""), add[b], del[b], add[b] - del[b]
              }
            }
          ' >> "$GITHUB_STEP_SUMMARY"

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The sha check's test walks recent commits for one whose short form carries a digit and
          # a letter; at depth 1 there is only the merge commit, and its form is that by chance.
          fetch-depth: 20
      # The venv carries the repository's own ruff, pyright and pytest for the python under scripts/,
      # and the markdown-it-py the documentation gate reads with. The dev group alone: no checker
      # and no case imports the application.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Install the shellcheck the gate pins
        # The runner image ships its own shellcheck, and selfcheck.sh prefers a binary on PATH over
        # the image it pins -- so without this CI lints the branch against a different rule set from
        # a development machine, and says so only as an advisory that leaves the run green.
        run: |
          # Read out of selfcheck.sh rather than repeated here: a second copy is a pair nothing
          # compares, and that file carries the note about bumping both by hand.
          version="$(sed -n 's/^SHELLCHECK_VERSION="\([0-9.]*\)"$/\1/p' scripts/gate/selfcheck.sh)"
          digest="$(sed -n 's/^SHELLCHECK_LINUX_X86_64_SHA256="\([0-9a-f]*\)"$/\1/p' scripts/gate/selfcheck.sh)"
          if [ -z "$version" ] || [ -z "$digest" ]; then
            echo "::error::no SHELLCHECK_VERSION or SHELLCHECK_LINUX_X86_64_SHA256 in scripts/gate/selfcheck.sh -- a pin moved or its spelling changed."
            exit 1
          fi
          tarball="${RUNNER_TEMP}/shellcheck-v${version}.linux.x86_64.tar.xz"
          # Fetched to a file rather than piped into tar, so a truncated stream is a digest mismatch
          # rather than a partial write nothing hashed.
          curl -fsSL -o "$tarball" "https://github.com/koalaman/shellcheck/releases/download/v${version}/shellcheck-v${version}.linux.x86_64.tar.xz"
          # Checked before anything is unpacked: a release asset can be replaced without its tag
          # moving, and this lands as root in a directory on PATH beside a checkout.
          if ! printf '%s  %s\n' "$digest" "$tarball" | sha256sum -c -; then
            echo "::error::the shellcheck tarball does not match the digest in scripts/gate/selfcheck.sh -- nothing was installed."
            exit 1
          fi
          sudo tar -xJf "$tarball" --strip-components=1 -C /usr/local/bin "shellcheck-v${version}/shellcheck"
          shellcheck --version
      # The self-check's hook probes need a `node` and no package, so they take the runner image's own
      # rather than the pinned install the frontend jobs make.
      - name: Run the scripts scope
        run: ./scripts/gate/verify.sh --scripts

  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history: the documentation gate diffs the branch against the merge base for its
          # branch-scoped checks, which a shallow clone cannot do.
          fetch-depth: 0
      # The application too: this scope runs fl_backend/tests/openapi_document.py, which imports it.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Run the docs scope
        run: ./scripts/gate/verify.sh --docs

  # Prettier in check mode over the whole repository: with `GITHUB_ACTIONS` set, `--frontend` leaves prettier to this job (`scripts/gate/verify.sh`),
  # which runs beside the frontend job rather than on its path.
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # prettier and its plugins are dependencies of fl_frontend, so the check needs that install
      # even though what it reads is mostly outside it.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the format scope
        run: ./scripts/gate/verify.sh --format

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: pyright and the suite import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Run the backend scope
        run: ./scripts/gate/verify.sh --backend

  # Both db tiers: the `db`-marked backend tests and the frontend's `*.db.test.*` files. A separate
  # job rather than a step in `backend`: jobs run concurrently, so the mongod pull costs no
  # wall-clock time.

  # The marker belongs to the suite, not to this pipeline.
  db:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The application too: the db tier's tests import `app`.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: true
      - name: Pull the mongod image the db tier starts
        # INSTRUMENTATION, not a saving: the pull is inside the job span either way. As its own step
        # the download is attributed in the log rather than hidden in pytest's span -- a slow tier
        # told from a slow registry.

        # No image cache beside this: the **ci** clause in `.claude/rules/ops.md` constrains exactly
        # that, so none is added here.

        # This job is a required status check and this step decides nothing, so it may not fail one
        # -- testcontainers pulls the image anyway. Same flag, same reason, as the advisory steps
        # below.
        continue-on-error: true
        # One process, no pipe: `sed | head` exits 141 under `pipefail` when the reader closes
        # first, which is a bare 141 with nothing printed, the guard below never having run.

        # Every container the conftest starts takes its image from one module-level `MONGO_IMAGE`.
        # Python's parser reads it, so no comment or string passes for the binding, and nothing
        # prints unless exactly one binding is found.
        run: |
          image="$(python3 -c '
          import ast, sys
          tree = ast.parse(open(sys.argv[1], encoding="utf-8").read())
          tags = [
              node.value.value
              for node in tree.body
              if isinstance(node, ast.Assign)
              and [getattr(target, "id", None) for target in node.targets] == ["MONGO_IMAGE"]
              and isinstance(node.value, ast.Constant)
              and str(node.value.value).startswith("mongo:")
          ]
          if len(tags) == 1:
              print(*tags)
          ' fl_backend/tests/conftest.py)"
          if [ -z "$image" ]; then
            echo "::error::no single MONGO_IMAGE binding found in fl_backend/tests/conftest.py -- the binding this step reads has moved or split."
            exit 1
          fi
          docker pull "$image"
      # The db scope runs the frontend's db-tier files too (`pnpm run test:db`), so this job installs
      # the frontend beside the backend's virtualenv.
      - uses: ./.github/actions/frontend-toolchain
      - name: Run the db scope
        run: ./scripts/gate/verify.sh --db

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # CI runs `pnpm build` on the runner host, never inside the image, so none of the Dockerfile's
    # ENV lines apply. These reproduce them across its base and builder stages;
    # `fl_frontend/Dockerfile` is the authority, and the two move together.
    env:
      SKIP_ENV_VALIDATION: "true"
      MONGODB_URI: mongodb://localhost:27017/placeholder
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # NOT unused, and this is the job where that is hardest to see: no step here runs python,
        # yet `scripts/gate/gate_pool.py` -- which starts this scope's checks together -- needs one at
        # the checkers' floor, above this image's own.

        # Without it `scripts/lib/_lib.sh :: any_python` falls back to the runner's python3, the pool
        # probe zeroes `scripts/gate/verify.sh :: STEP_JOBS`, and the scope silently costs the sum of
        # its checks rather than the longest.

        # An interpreter and no virtualenv, for the reason written at `commits`; here the lookup is
        # on the run's critical path.
        with:
          python-version-file: fl_backend/.python-version
      # The scope builds the application, so the installed tree is the job.
      - uses: ./.github/actions/frontend-toolchain
      # The source trees are in the key, not the lockfile alone: a key coarser than what the cache
      # depends on hits exactly every run, and actions/cache does not write on an exact hit.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: fl_frontend/.next/cache
          key: nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-${{ hashFiles('fl_frontend/src/**', 'fl_frontend/next.config.ts') }}
          # A prefix restore is safe for both things the path holds: the Next cache is
          # content-addressed, and tsc's build info (`tsBuildInfoFile`) re-checks a file whose text
          # hash moved, and every file where the compiler options or the TypeScript version did.
          restore-keys: |
            nextjs-${{ hashFiles('fl_frontend/pnpm-lock.yaml') }}-
      - name: Run the frontend scope
        run: ./scripts/gate/verify.sh --frontend
      - name: Fail if the frontend scope rewrote tsconfig.json
        # `next typegen` and `next build` both write fl_frontend/tsconfig.json for any compilerOptions
        # key that is absent -- one presence check, Next's `writeConfigurationDefaults`, documented at
        # that file's `allowJs` line -- then carry on.

        # The scope runs typegen first, so it is typegen's write this diff sees and the build then
        # finds nothing to add; either way every reader after it checked a config the committed file
        # does not hold.

        # Locally the dirty tree is visible; on a runner the repaired copy is discarded with the
        # workspace, and a framework upgrade reaches this condition with nobody editing the file.
        run: |
          if ! git diff --exit-code -- fl_frontend/tsconfig.json; then
            echo "::error::the frontend scope rewrote fl_frontend/tsconfig.json -- a compilerOptions key is absent. Run 'cd fl_frontend && pnpm typegen' and commit the result."
            exit 1
          fi

  # The frontend unit tests, split by file across four shards: run in one job, they would be the
  # run's longest step.

  # Four, not three: three shards finish level with the frontend job, so the run would wait on the
  # slower of two near-equal spans; four finish well before it.
  frontend-units:
    # Spelled out because GitHub documents no default name for a matrix instance, and the budget
    # check finds each instance's row in .github/gate-wall-clock.tsv by exactly this name.
    name: frontend-units (${{ matrix.shard }})
    strategy:
      # A red shard cancels none of the others, whose results still say which files fail.
      fail-fast: false
      # `shard` alone, with no `include`: a second key or an added combination repeats an index
      # under a larger count, and the files of the indices nobody runs are tested nowhere.
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/frontend-toolchain
      - name: Run shard ${{ matrix.shard }} of ${{ strategy.job-total }} of the frontend unit tests
        # On this step alone: `verify.sh` refuses a shard beside any other scope, and `node --test`
        # counts shards from 1, as the list does.

        # The count is the matrix's own size rather than a second copy of it, so a shard added to
        # the list is a shard every instance counts.
        env:
          VERIFY_TEST_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
        run: ./scripts/gate/verify.sh --frontend-units

  # The compose files and the nginx configuration have no compiler; this scope parses and serves
  # them, and is the only thing standing between a typo in either and a failed deploy.
  ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # `any_python` falls back to the runner's python3, which is under the checkers' floor on
      # this image, and the ops scope degrades "could not run" to a skip — so without this venv
      # the job is green having never compared the compose files.

      # The dev group alone: zizmor is the only thing here past the standard library, and it is a
      # dev dependency.
      - uses: ./.github/actions/backend-toolchain
        with:
          application: false
      - name: Run the ops scope
        run: ./scripts/gate/verify.sh --ops

  # Both image builds plus the instrumentation.js presence check — the failures no other scope can
  # see, because the frontend scope builds on the runner and never inside the image.
  images:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The two builds start together only through `scripts/gate/gate_pool.py`, which needs a python at
        # the checkers' floor -- above this image's own. Without it the scope costs their sum rather
        # than the longer of the two, against the timeout above.

        # An interpreter and no virtualenv, for the reason written at `commits`: each Dockerfile
        # installs its own tree inside the build.
        with:
          python-version-file: fl_backend/.python-version
      # buildx talks to the Actions cache service itself, so there is no actions/cache
      # step and no cache directory to carry. This action exists because the runner injects the
      # service credentials into JavaScript actions alone.
      - uses: ./.github/actions/actions-runtime-env
      - name: Create a cache-capable builder
        # The default docker driver cannot export a build cache; the container driver can, and the
        # script's --load brings the built image back to the daemon for the instrumentation check.
        run: docker buildx create --use
      - name: Run the images scope
        env:
          VERIFY_IMAGES_CACHE: gha
        run: ./scripts/gate/verify.sh --images

  # THE REQUIRED STATUS CHECK. The ruleset on main requires a check named `verify`; this job is it.
  # `always()`: the verdict is the steps below, never GitHub's reading of a job skipped over a
  # failed need.
  verify:
    needs: [commits, scripts, docs, format, backend, db, frontend, frontend-units, ops, images]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # A job-level grant replaces the workflow-level one whole, so `contents` is spelled again here
    # for the sparse checkout below; the runs API the wall-clock report and the budget check read
    # needs `actions`.
    permissions:
      actions: read
      contents: read
    steps:
      # First, so it prints whether or not the verdict below refuses: a red `verify` names no job,
      # and this is where each one's result is read.
      - name: Report each scope's result
        # This job IS the required status check, so nothing diagnostic in it may decide a merge. The
        # verdict is the step below and only that step; a report that cannot format its own output
        # is annotated in the run and changes no outcome.
        continue-on-error: true
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          printf '%s' "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
      - name: Read the wall-clock reference and the budget check
        # Four files out of the tree, sparse rather than a full checkout: this job runs on every
        # event and owes the required check its start time. Without `continue-on-error`, because
        # the budget step at the end of this job decides: a checkout it cannot read from is that
        # step refusing, never a verdict skipped. The report still answers a missing reference by
        # saying so and stopping.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The token is not needed after checkout, for the reason the commits job gives above.
          persist-credentials: false
          sparse-checkout: |
            .github/gate-wall-clock.tsv
            scripts/checks/check_gate_budget.py
            scripts/lib/checker_kernel.py
            fl_backend/.python-version
          sparse-checkout-cone-mode: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        # The checkers' floor (`scripts/lib/_lib.sh :: PYTHON_FLOOR`) is above the runner's default
        # python. The pin meets it: the scripts, docs, backend and db scopes refuse a pin below it.

        # Not a `uv sync`: the report and the budget import the standard library alone, and an
        # install would sit on the required check's critical path for nothing. The toolcache holds
        # the pin, so this is a lookup.
        with:
          python-version-file: fl_backend/.python-version

      - name: Report the gate's wall clock
        # The re-bloat glance for time: per-job medians over the last window of main runs against a
        # reference table held in the tree. Advisory by construction — nothing here decides an
        # outcome, and continue-on-error keeps it away from the verdict this job is.
        continue-on-error: true
        # Main pushes only: the window it prints is main's own runs, which says nothing a pull
        # request changed, and each request it makes sits on the required check's path.
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          window=12
          fetched="${RUNNER_TEMP}/wall-clock"
          mkdir -p "$fetched"
          # `completed`, not `success`: a run that failed still carries jobs that succeeded, and
          # discarding the whole run throws their timings away. It excludes the run doing the
          # reporting, which is still in flight.
          listing="repos/${GITHUB_REPOSITORY}/actions/workflows/verify.yml/runs?branch=main&event=push&status=completed&per_page=${window}"

          # Every request is made and none ends the step: a payload gh could not fetch is left
          # absent, and the checker names each one rather than reporting a window short of it.
          gh api "$listing" > "${fetched}/runs.json" || rm -f "${fetched}/runs.json"
          for id in $(jq -r '.workflow_runs[]?.id' "${fetched}/runs.json" 2>/dev/null || true); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/jobs?per_page=100" > "${fetched}/jobs-${id}.json" || rm -f "${fetched}/jobs-${id}.json"
          done
          python scripts/checks/check_gate_budget.py --window "$fetched" --runs "$window" --summary "$GITHUB_STEP_SUMMARY"

      - name: Fail if any scope job failed or was cancelled
        # A skip is the next step's to judge. Pure expressions, no shell parsing of the needs context.
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: |
          echo "::error::A scope job failed -- its own log has the findings."
          exit 1

      # Every event runs every scope (`.claude/CLAUDE.md` §7, **ci**), so a skip is a condition
      # someone added, which the step above passes. Every job this one needs is named, `commits`
      # under the one event it runs for.
      - name: Fail if a scope job was skipped
        if: >-
          needs.scripts.result == 'skipped' || needs.docs.result == 'skipped' || needs.format.result == 'skipped'
          || needs.backend.result == 'skipped' || needs.db.result == 'skipped' || needs.frontend.result == 'skipped'
          || needs.frontend-units.result == 'skipped' || needs.ops.result == 'skipped'
          || needs.images.result == 'skipped'
          || (github.event_name == 'pull_request' && needs.commits.result == 'skipped')
        run: |
          echo "::error::A scope job was skipped, and every event runs them all -- the scope results above name it."
          exit 1

      # `scripts/checks/check_publish_verdict.py :: BUDGET_STEP` finds this step by its exact name and
      # publishes over a run it alone failed; its tests hold the two names, and this `if:`, together.
      - name: Hold every job to its wall-clock budget
        # THE BUDGET. Not advisory: a job over its row in .github/gate-wall-clock.tsv fails the
        # required check, naming the job and both figures, and so does a job that ran with no row
        # (`docs/ops/spec.md :: I17`). Run whatever the scope jobs concluded, so an overrun never
        # hides behind a failed scope; a failed job's length is not judged.
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The API the report above reads past runs from, so this run's jobs and those it compares
          # describe one population.

          # Released from `-e` so that a payload gh could not fetch reaches the checker, whose
          # refusal is the exit code, rather than ending the step on gh's own.
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/jobs?per_page=100" > "${RUNNER_TEMP}/jobs.json" || true
          python scripts/checks/check_gate_budget.py --jobs "${RUNNER_TEMP}/jobs.json"
