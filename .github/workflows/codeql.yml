name: codeql

# Static analysis for the two first-party languages, as advanced setup rather than GitHub's default
# setup: default setup configures itself invisibly in repository settings, whereas the query suite,
# the schedule and the trigger set below are version-controlled and reviewable like everything else.
#
# Invariants:
# - Every pull request, every push to main and every scheduled run analyses both languages, and
#   no filter decides which of them runs.
# - Neither language installs dependencies -- CodeQL reads source, so `build-mode: none` is the
#   whole build and an install step buys minutes of runtime and nothing else.
# - CodeQL catches pattern-matchable classes alone. An authorization gap is a valid program doing
#   the wrong thing, and belongs to the audit programme (docs/_auditing/).
# - Whether this workflow is required is a ruleset setting, outside the repository
#   (docs/_git/spec.md).

on:
  # No path filter, as the sibling workflows carry none: a push to main analyses whatever the two
  # extractors reach, `scripts/` and `.github/actions/` among them, so a filter naming fewer paths
  # leaves a pull request unanalysed and its alerts to surface on the merge commit instead.
  pull_request:
  push:
    branches: [main]
  # Query packs are updated upstream, so a scheduled run finds newly published queries against code
  # that has not changed. Off the hour by convention -- scheduled jobs cluster there and get delayed.
  schedule:
    - cron: "37 4 * * 1"

# Least privilege, same reasoning as `.github/workflows/verify.yml`. `security-events: write` is the one addition, and it
# is what uploads results to the Security tab; without it the analysis runs and the findings vanish.
permissions:
  contents: read
  security-events: write
  actions: read

# Same shell as verify.yml, for the reason written there. No `run:` step exists here today; the
# default is declared so one added later inherits the same failure semantics as the other two.
defaults:
  run:
    shell: bash

concurrency:
  group: codeql-${{ github.ref }}
  # Same rule as `.github/workflows/verify.yml`: supersede an in-flight PR run, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two jobs, and NEITHER may be re-guarded or renamed. A category is this file's path and a job's
  # name, so code scanning attributes an alert per category against the base branch: a category main
  # produces that a pull request skips leaves the alert unattributable, and a rename orphans every
  # analysis already filed under the old name.
  analyze-javascript:
    runs-on: ubuntu-latest
    # Several times the analysis's own duration at its tail; the only failure mode of a margin this
    # size is a red run somebody re-runs.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reasoning as `.github/workflows/verify.yml`: the token is not needed after checkout, and leaving it in
          # .git/config exposes it to every later step.
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          # The default suite is deliberate: `security-extended` adds queries and false positives in
          # roughly equal measure, so start quiet and escalate on evidence. To escalate, add
          # `queries: security-extended` here.
      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  analyze-python:
    runs-on: ubuntu-latest
    # Same margin as the JavaScript job, for the same reason.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none
          # Same reasoning as the JavaScript job: default suite, escalate on evidence.
      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
