name: codeql

# Static analysis for the two first-party languages, as advanced setup rather than GitHub's default
# setup: default setup configures itself invisibly in repository settings, whereas the query suite,
# the schedule and the trigger set below are version-controlled and reviewable like everything else.
#
# CodeQL catches pattern-matchable classes alone. An authorization gap is a valid program doing the
# wrong thing, and belongs to the audit programme (docs/_auditing/).
#
# Whether this workflow is required is a ruleset setting, outside the repository
# (docs/_git/spec.md).

on:
  # No path filter, as the sibling workflows carry none: a push to main analyses whatever the two
  # extractors reach, `scripts/` and `.github/actions/` among them, so a filter naming fewer paths
  # leaves a pull request unanalysed and its alerts to surface on the merge commit instead.
  pull_request:
  push:
    branches: [main]
  # Query packs are updated upstream, so a scheduled run finds newly published queries against code
  # that has not changed. Off the hour by convention -- scheduled jobs cluster there and get delayed.
  schedule:
    - cron: "37 4 * * 1"

# Least privilege, as in verify.yml. What every job here needs, and what a job added later
# inherits: `contents: read` for the checkout, and `actions: read`, the starter workflow's,
# required for a private repository only.
permissions:
  contents: read
  actions: read

# Same shell as verify.yml, for the reason written there, so a `run:` step added later inherits it.
defaults:
  run:
    shell: bash

concurrency:
  group: codeql-${{ github.ref }}
  # Same rule as `.github/workflows/verify.yml`: supersede an in-flight PR run, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Two jobs, and NEITHER may be re-guarded or renamed. A category is this file's path and a job's
  # name, so code scanning attributes an alert per category against the base branch: a category main
  # produces that a pull request skips leaves the alert unattributable, and a rename orphans every
  # analysis already filed under the old name.
  analyze-javascript:
    runs-on: ubuntu-latest
    # Several times the analysis's longest run; the only failure mode of a margin this size is a re-run.
    timeout-minutes: 10
    # `security-events: write` uploads the results to the Security tab; without it the findings
    # vanish, and only an analysis job uploads. A job block replaces the workflow's rather than
    # extending it, so both of its lines are restated here.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reasoning as `.github/workflows/verify.yml`: the token is not needed after checkout, and leaving it in
          # .git/config exposes it to every later step.
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: javascript-typescript
          # CodeQL reads source, so this is the whole build and an install step ahead of it buys
          # minutes of runtime and nothing else.
          build-mode: none
          # The default suite is deliberate: `security-extended` adds queries and false positives in
          # roughly equal measure, so start quiet and escalate on evidence. To escalate, add
          # `queries: security-extended` here.
      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9

  analyze-python:
    runs-on: ubuntu-latest
    # Same margin as the JavaScript job, for the same reason.
    timeout-minutes: 10
    # Same grants as the JavaScript job, for the same reasons.
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          build-mode: none
          # Same reasoning as the JavaScript job: default suite, escalate on evidence.
      - name: Analyse
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
