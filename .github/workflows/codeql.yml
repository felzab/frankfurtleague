name: codeql

# Static analysis for the two first-party languages, as advanced setup rather than GitHub's default
# setup: default setup configures itself invisibly in repository settings, whereas the query suite,
# the schedule and the trigger set below are version-controlled and reviewable like everything else.
#
# Invariants:
# - A pull request analyses the language whose tree changed; a push to main analyses both.
# - Neither language installs dependencies -- CodeQL reads source, so `build-mode: none` is the
#   whole build and an install step buys minutes of runtime and nothing else.
# - CodeQL catches pattern-matchable classes alone. An authorization gap is a valid program doing
#   the wrong thing, and belongs to the audit programme (docs/_auditing/).
# - Whether this workflow is required is a ruleset setting, outside the repository
#   (docs/_git/spec.md).

on:
  pull_request:
    paths:
      - "fl_frontend/**"
      - "fl_backend/**"
      - ".github/workflows/codeql.yml"
      # The mapping script the `changes` job below runs, and the library it sources. Without them a
      # pull request that breaks the mapping runs the verify gate and never this workflow, so the
      # breakage first shows as a red run on main, attributed to the change after it.
      - "scripts/ci_scopes.sh"
      - "scripts/_lib.sh"
  push:
    branches: [main]
  # Query packs are updated upstream, so a scheduled run finds newly published queries against code
  # that has not changed. Off the hour by convention -- scheduled jobs cluster there and get delayed.
  schedule:
    - cron: "37 4 * * 1"

# Least privilege, same reasoning as verify.yml. `security-events: write` is the one addition, and it
# is what uploads results to the Security tab; without it the analysis runs and the findings vanish.
permissions:
  contents: read
  security-events: write
  actions: read

concurrency:
  group: codeql-${{ github.ref }}
  # Same rule as the verify gate: supersede an in-flight PR run, never a run on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which language trees did this event touch? On anything but a pull request, both.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      frontend: ${{ steps.map.outputs.frontend }}
      backend: ${{ steps.map.outputs.backend }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Same reasoning as verify.yml: the token is not needed after checkout, and leaving it in
          # .git/config exposes it to every later step.
          persist-credentials: false
          # Full history for the merge-base diff below.
          fetch-depth: 0
      - name: Map changed paths to languages
        id: map
        # scripts/ci_scopes.sh is the repository's one path mapping; this job reads its `frontend`
        # and `backend` lines and ignores the rest. A markdown-only change inside fl_frontend/
        # therefore analyses nothing, exactly like the verify workflow's test tiers.
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            ./scripts/ci_scopes.sh "origin/${BASE_REF}" >> "$GITHUB_OUTPUT"
          else
            ./scripts/ci_scopes.sh --all >> "$GITHUB_OUTPUT"
          fi

  # Two jobs rather than one matrix: a job-level `if` cannot select matrix rows per language, and
  # separate jobs keep what the matrix bought -- separate databases, parallel runs, one language's
  # failure never hiding the other's results.
  analyze-javascript:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: javascript-typescript
          build-mode: none
          # The default suite is deliberate: `security-extended` adds queries and false positives in
          # roughly equal measure, so start quiet and escalate on evidence. To escalate, add
          # `queries: security-extended` here.
      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6

  analyze-python:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Initialise CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: python
          build-mode: none
          # Same reasoning as the JavaScript job: default suite, escalate on evidence.
      - name: Analyse
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
