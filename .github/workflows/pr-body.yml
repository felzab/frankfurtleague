# Holds a pull request body to the form in docs/_git/templates.md.
#
# A SEPARATE workflow from verify.yml on purpose. This one has to listen for `edited`, so that a
# body corrected after review turns the check green without an unrelated push — and subscribing
# verify.yml to `edited` would re-run the whole gate, image builds included, every time somebody
# fixes a typo in a description.
#
# It is therefore NOT part of verify.yml's aggregate `verify` job, which is the ruleset's required
# check. To make this one block a merge as well, add `pr-body` to the required status checks on
# `main` — the checklist is in docs/_git/spec.md, Repository settings.
name: pr-body

on:
  pull_request:
    # `synchronize` earns its place as much as `edited`: GitHub resolves a required check against
    # the HEAD commit, so a check that skips a push leaves the newest commit with no result — which
    # blocks the merge permanently rather than passing.
    types: [opened, edited, reopened, ready_for_review, synchronize]

permissions:
  contents: read

# Same shell as verify.yml, for the reason written there; its `-o pipefail` also makes the pipe
# below report printf's status, not python's alone.
defaults:
  run:
    shell: bash

concurrency:
  group: pr-body-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The job id is what GitHub lists in required status checks; the workflow's `name` never appears
  # there. It matches that name so the ruleset entry reads as the thing it is, the way verify.yml's
  # aggregate job is called `verify`.
  pr-body:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          # The pin's file, for the reason written at verify.yml's `commits` job.
          version-file: fl_backend/pyproject.toml
      - name: Create the backend virtualenv
        # As verify.yml's `commits` job, for the reasons written there.
        working-directory: fl_backend
        run: uv sync --locked --only-group dev

      - name: Check the pull request body
        # The body is attacker-controlled text on a public repository, so it reaches the script
        # through the environment and stdin — never by interpolating `${{ }}` into `run:`, the
        # script-injection shape every `run:` step here avoids.
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: printf '%s' "$PR_BODY" | fl_backend/.venv/bin/python scripts/checks/check_pr_body.py - --author "$PR_AUTHOR"
