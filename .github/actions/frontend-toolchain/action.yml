name: Frontend toolchain
description: >-
  pnpm, Node and fl_frontend's installed dependencies, in one step. Four jobs of the verify workflow
  want exactly this block, and a copy per job is a copy that can drift.

# The caller checks out first. A `./` action is read from the workspace, so the runner cannot find
# this file until actions/checkout has run -- which is also why the checkout stays in each job,
# where its own fetch-depth is decided.

# Local, so it needs no Actions allowlist entry (docs/_git/spec.md, Repository settings); the action
# it calls does. Dependabot reaches its pin through .github/dependabot.yml's composite-action entry.

runs:
  using: composite
  steps:
    # pnpm/setup fetches pnpm's binary at the `packageManager` version and installs the Node
    # `devEngines.runtime` declares: one action for both, and no npm self-install.

    # A CACHED CHECK, accepted knowingly: whatever `cache` says, pnpm's verification log is restored,
    # and an unchanged lockfile is not re-verified against the registry.

    # Bounded: a changed lockfile re-verifies, the log is uploaded when the install ends rather than
    # at job end, out of reach of later steps, and one a record vanished from is discarded.
    - uses: pnpm/setup@703c52620218391530e48b9e8870d5c0082e1b9b # v2.1.0
      with:
        # The image pins pnpm again at `fl_frontend/Dockerfile :: ARG PNPM_VERSION`; nothing compares
        # them, so bump both.
        working-directory: fl_frontend
        # The store cache, keyed on the lockfile and the runtime.
        cache: true
        # `pnpm install --frozen-lockfile`, plus a refusal when no lockfile exists at all -- where a
        # plain install resolves from the registry, writes one and exits 0.
        require-lockfile: true
