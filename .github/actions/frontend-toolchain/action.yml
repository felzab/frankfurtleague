name: Frontend toolchain
description: >-
  pnpm, Node and fl_frontend's installed dependencies, in one step. Several jobs of the verify
  workflow want exactly this block, and a copy per job is a copy that can drift.

# The caller checks out first. A `./` action is read from the workspace, so the runner cannot find
# this file until actions/checkout has run.

inputs:
  save-cache:
    description: >-
      `true` in the one caller that saves the pnpm store to the Actions cache when it changed;
      `false`, the default, restores it alone, so a lockfile change uploads one store rather than one
      per job.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # pnpm/setup fetches pnpm at the `packageManager` version, installs the Node that
    # `devEngines.runtime` names in the manifest -- from the manifest alone, the lockfile playing no
    # part, so a range there is the newest release matching it on the day the job runs -- and caches
    # the store itself (https://github.com/pnpm/setup#cache-the-pnpm-store). That field therefore
    # holds one exact release, the one fl_frontend/Dockerfile's base carries. Dependabot reaches
    # this action's pin through .github/dependabot.yml's composite-action entry.
    - uses: pnpm/setup@a0881977cd8ea73b1ed212236c99ca10dcc80cf4 # v3.1.1
      with:
        working-directory: fl_frontend
        cache: true
        save-cache: ${{ inputs.save-cache }}
        # pnpm trusts a cached lockfile verification only for the same lockfile, policy and pnpm
        # (`packageManager`), so the key carries all three files.
        cache-dependency-path: |
          fl_frontend/pnpm-lock.yaml
          fl_frontend/pnpm-workspace.yaml
          fl_frontend/package.json
        # `pnpm install --frozen-lockfile`, plus a refusal when no lockfile exists at all -- where a
        # plain install resolves from the registry, writes one and exits 0.
        require-lockfile: true
